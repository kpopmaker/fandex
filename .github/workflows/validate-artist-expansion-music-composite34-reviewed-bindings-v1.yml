name: Validate Artist Expansion Music composite34 reviewed bindings v1

on:
  push:
    branches:
      - review/artist-expansion-music-composite34-bindings-v1

permissions:
  contents: read

jobs:
  validate-music-composite34-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Music composite34 reviewed bindings
        run: python tests/artist-expansion-music-composite34-reviewed-bindings-v1.py
