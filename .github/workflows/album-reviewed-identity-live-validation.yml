name: Album Reviewed Identity Live Validation

on:
  push:
    branches:
      - integration/album-reviewed-identity-mapping-packet

permissions:
  contents: read

jobs:
  validate-live:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run bounded reviewed identity live validation
        run: npx tsx scripts/ingestion/validate-album-reviewed-identity-live-v1.mts
