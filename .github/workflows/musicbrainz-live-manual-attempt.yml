name: MusicBrainz Live Manual Research Attempt

on:
  push:
    branches:
      - research/musicbrainz-album-catalog-v1

permissions:
  contents: read

jobs:
  attempt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run exactly one IU MusicBrainz research attempt
        shell: bash
        run: |
          set +e
          npm run ingestion:musicbrainz:research-album-catalog -- \
            --canonical-artist-id=iu \
            --provider-artist-id=b9545342-1e6d-4dae-84ac-013374ad8d7c \
            --limit=100 \
            --offset=0
          code=$?
          echo "structured_attempt_exit_code=$code"
          exit 0
