name: PR127 v156 current-real post-persistence validation

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Materialize audited v155 manifest sequence 3 and verify v156
        run: |
          cat > .tmp-v156-current-real.mts <<'TS'
          import { readFile } from 'node:fs/promises';
          import {
            buildFandexMomentumPairedArtifactManifestResearch,
            evaluateFandexMomentumPairedArtifactAcceptanceResearch,
            parseFandexMomentumPairedArtifactManifestJsonl,
            serializeFandexMomentumPairedArtifactManifestRecord,
          } from './lib/intelligence/fandexMomentumPairedArtifactManifestResearch';
          import {
            evaluateFandexMomentumTripleArtifactAcceptanceResearch,
          } from './lib/intelligence/fandexMomentumTripleArtifactAcceptanceResearch';

          const [historyJsonl, watermarkJsonl, manifestJsonl, auditRaw] = await Promise.all([
            readFile('./data/momentum-research/iu_cross_family_evidence_state_v147.jsonl', 'utf8'),
            readFile('./data/momentum-research/iu_evaluation_watermark_v151.jsonl', 'utf8'),
            readFile('./data/momentum-research/iu_paired_artifact_manifest_v154.jsonl', 'utf8'),
            readFile('./data/momentum-research/iu_manifest_guarded_preflight_v155_20260920T162000Z.json', 'utf8'),
          ]);
          const audit = JSON.parse(auditRaw);
          const manifests = parseFandexMomentumPairedArtifactManifestJsonl(manifestJsonl);
          const previousManifest = manifests.at(-1);
          if (!previousManifest || previousManifest.sequence !== 2) {
            throw new Error('expected committed manifest sequence 2');
          }

          const pairAcceptance =
            evaluateFandexMomentumPairedArtifactAcceptanceResearch({
              manifest: previousManifest,
              observedHistoryJsonl: historyJsonl,
              observedWatermarkJsonl: watermarkJsonl,
            });
          if (!pairAcceptance.readyForNextEvaluation) {
            throw new Error('current committed pair not accepted');
          }

          const coordinator: any = {
            contractVersion:
              'v152_fandex_momentum_dual_artifact_evaluation_coordinator_research_v1',
            state: audit.preflight.coordinator.state,
            priorHistoryRecordCount: audit.inputs.committedHistoryRecordCount,
            resultingHistoryRecordCount: audit.inputs.committedHistoryRecordCount,
            priorWatermarkRecordCount: audit.inputs.committedWatermarkRecordCount,
            resultingWatermarkRecordCount: audit.inputs.committedWatermarkRecordCount,
            priorHistoryDigest: previousManifest.resultingHistoryDigest,
            resultingHistoryDigest: previousManifest.resultingHistoryDigest,
            priorWatermarkDigest: previousManifest.resultingWatermarkDigest,
            resultingWatermarkDigest: previousManifest.resultingWatermarkDigest,
            effects: {
              productMetricReads: 0,
              productMetricWrites: 0,
              previewFallbackReads: 0,
              databaseWrites: 0,
              historyWrites: 0,
              watermarkWrites: 0,
            },
            digest: audit.preflight.coordinator.digest,
          };

          const nextManifest = buildFandexMomentumPairedArtifactManifestResearch({
            coordinator,
            sequence: 3,
            manifestedAt: audit.manifestedAt,
            previousManifest,
          });
          if (
            nextManifest.manifestDigest
              !== audit.preflight.nextManifest.manifestDigest
          ) {
            throw new Error('audited next manifest digest mismatch');
          }

          const proposedManifestJsonl =
            manifestJsonl.replace(/\s*$/, '')
            + '\n'
            + serializeFandexMomentumPairedArtifactManifestRecord(nextManifest)
            + '\n';

          const preflight: any = {
            contractVersion:
              'v155_fandex_momentum_manifest_guarded_evaluation_preflight_research_v1',
            state: 'evaluation-prepared',
            latestManifestDigest: previousManifest.manifestDigest,
            currentPairAcceptance: pairAcceptance,
            coordinatorInvoked: true,
            coordinator,
            nextManifest,
            proposedHistoryJsonl: historyJsonl,
            proposedWatermarkJsonl: watermarkJsonl,
            proposedManifestJsonl,
            proposedWrites: {
              historyWrites: 0,
              watermarkWrites: 0,
              manifestWrites: 1,
            },
            readyForPhysicalPersistence: true,
            blockers: [],
            effects: {
              productMetricReads: 0,
              productMetricWrites: 0,
              previewFallbackReads: 0,
              databaseWrites: 0,
              historyWrites: 0,
              watermarkWrites: 0,
              manifestWrites: 0,
            },
            digest: audit.preflight.digest,
          };

          const before = evaluateFandexMomentumTripleArtifactAcceptanceResearch({
            preflight,
            observedHistoryJsonl: historyJsonl,
            observedWatermarkJsonl: watermarkJsonl,
            observedManifestJsonl: manifestJsonl,
          });
          if (
            before.state !== 'manifest-write-not-applied'
            || before.readyForNextEvaluation
          ) {
            throw new Error('unexpected pre-persistence state');
          }

          const after = evaluateFandexMomentumTripleArtifactAcceptanceResearch({
            preflight,
            observedHistoryJsonl: historyJsonl,
            observedWatermarkJsonl: watermarkJsonl,
            observedManifestJsonl: proposedManifestJsonl,
          });
          if (
            after.state !== 'accepted-resulting-triple'
            || !after.readyForNextEvaluation
          ) {
            throw new Error('expected exact triple acceptance');
          }

          console.log(JSON.stringify({
            preflightDigest: preflight.digest,
            nextManifestSequence: nextManifest.sequence,
            nextManifestDigest: nextManifest.manifestDigest,
            proposedWrites: preflight.proposedWrites,
            before: {
              state: before.state,
              digest: before.digest,
              readyForNextEvaluation: before.readyForNextEvaluation,
            },
            after: {
              state: after.state,
              digest: after.digest,
              readyForNextEvaluation: after.readyForNextEvaluation,
              pairAcceptanceState: after.pairAcceptance.state,
              observedManifestDigest: after.observedManifestDigest,
            },
          }, null, 2));
          console.log('V156_MANIFEST_BEGIN');
          process.stdout.write(proposedManifestJsonl);
          console.log('V156_MANIFEST_END');
          TS
          npx tsx --conditions=react-server .tmp-v156-current-real.mts
          rm .tmp-v156-current-real.mts
      - name: Run v156 regressions
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-triple-artifact-acceptance-v156.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-manifest-guarded-preflight-v155.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-paired-artifact-manifest-v154.test.mts
          npm run typecheck
          git diff --check
