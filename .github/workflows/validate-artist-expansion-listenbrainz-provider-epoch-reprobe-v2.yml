name: Validate Artist Expansion ListenBrainz provider epoch reprobe v2

on:
  push:
    branches:
      - evidence/artist-expansion-listenbrainz-provider-epoch-reprobe-v2

permissions:
  contents: read

jobs:
  validate-reprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate fresh provider epoch reprobe receipt
        run: python tests/artist-expansion-listenbrainz-provider-epoch-reprobe-v2.py
