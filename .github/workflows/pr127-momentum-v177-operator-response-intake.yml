name: PR127 momentum v177 operator response intake

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - 'lib/intelligence/fandexMomentumVerifierOperatorResponseIntakeResearch.ts'
      - 'tests/fandex-momentum-verifier-operator-response-intake-v177.test.mts'
      - '.github/workflows/pr127-momentum-v177-operator-response-intake.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Evaluate current v177 intake state
        run: |
          cat > .tmp-v177-current.mts <<'TS'
          import {
            evaluateFandexMomentumVerifierOperatorResponseIntake,
          } from './lib/intelligence/fandexMomentumVerifierOperatorResponseIntakeResearch';

          const out = evaluateFandexMomentumVerifierOperatorResponseIntake({
            evaluatedAt: '2026-09-23T01:10:00.000Z',
            requestIntent: 'generic-continuation',
            upstreamV176Digest:
              'd66383659245ec10012bfd3575fe4cf16a89299784580a2a5159638d4e146ed5',
            upstreamV172Digest:
              'e779f7386db56d4fff7202d45a82c35c522036748018071b8205523a843f4b2a',
            response: null,
          });
          console.log('V177_CURRENT_BEGIN');
          console.log(JSON.stringify(out, null, 2));
          console.log('V177_CURRENT_END');
          TS
          npx tsx --conditions=react-server .tmp-v177-current.mts
          rm .tmp-v177-current.mts
      - name: Validate v177 and upstream regressions
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-operator-response-intake-v177.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-inventory-operator-handoff-v176.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-real-inventory-acquisition-readiness-v175.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-vercel-inventory-execution-envelope-v173.test.mts
          npm run typecheck
          git diff --check
