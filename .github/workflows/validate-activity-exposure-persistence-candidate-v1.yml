name: Validate Activity Exposure persistence candidate v1

on:
  push:
    branches:
      - validation/activity-exposure-live-provider-coverage-v1
    paths:
      - docs/validation/sql/activity-exposure-persistence-candidate-v1.sql
      - docs/validation/sql/activity-exposure-persistence-candidate-v1.test.sql
      - .github/workflows/validate-activity-exposure-persistence-candidate-v1.yml

permissions:
  contents: read

jobs:
  validate-persistence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: fandex_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fandex_validation"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGDATABASE: fandex_validation
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runtime role
        run: psql -v ON_ERROR_STOP=1 -c "CREATE ROLE fandex_runtime NOLOGIN;"
      - name: Apply existing FANDEX persistence schema
        run: |
          psql -v ON_ERROR_STOP=1 -f database/migrations/001_v114_managed_postgres_persistence.sql
          psql -v ON_ERROR_STOP=1 -f database/migrations/002_v121_naver_news_operational_ingestion.sql
      - name: Apply Activity Exposure candidate schema
        run: psql -v ON_ERROR_STOP=1 -f docs/validation/sql/activity-exposure-persistence-candidate-v1.sql
      - name: Execute Activity Exposure persistence invariants
        run: psql -v ON_ERROR_STOP=1 -f docs/validation/sql/activity-exposure-persistence-candidate-v1.test.sql
      - name: Confirm NAVER schema remains intact
        run: |
          psql -At -v ON_ERROR_STOP=1 -c "SELECT provider='naver-news' FROM information_schema.check_constraints cc JOIN information_schema.constraint_column_usage ccu USING (constraint_catalog,constraint_schema,constraint_name) JOIN fandex.source_ingestion_jobs j ON false LIMIT 0;" >/dev/null || true
          psql -At -v ON_ERROR_STOP=1 -c "SELECT to_regclass('fandex.source_ingestion_jobs'), to_regclass('fandex.source_ingestion_raw_evidence'), to_regclass('fandex.source_ingestion_normalized_records');"
      - name: Confirm no numeric methodology columns
        run: |
          test -z "$(psql -At -v ON_ERROR_STOP=1 -c "SELECT column_name FROM information_schema.columns WHERE table_schema='fandex' AND table_name LIKE 'activity_exposure_%' AND column_name ~* '(score|point|weight|decay|active_window|active_until)';")"
