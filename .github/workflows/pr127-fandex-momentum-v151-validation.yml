name: PR127 FANDEX momentum v151 validation

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate v151 watermark persistence and upstream contracts
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-evaluation-watermark-v151.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-common-cutoff-advancement-v150.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-current-real-v150-fixture.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-append-from-artifact-v148.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-unified-history-v147.test.mts
          npm run typecheck
          git diff --check

      - name: Materialize current real v151 evaluation watermark
        run: |
          cat > .tmp-v151-materialize.mts <<'TS'
          import { readFile } from 'node:fs/promises';
          import {
            evaluateFandexMomentumCommonCutoffAdvancementGateResearch,
          } from './lib/intelligence/fandexMomentumCommonCutoffAdvancementGateResearch';
          import {
            persistFandexMomentumEvaluationWatermarkResearch,
          } from './lib/intelligence/fandexMomentumEvaluationWatermarkResearch';

          const historyJsonl = await readFile(
            './data/momentum-research/iu_cross_family_evidence_state_v147.jsonl',
            'utf8',
          );

          const result: any = {
            contractVersion: 'v143_fandex_momentum_output_form_eligibility_research_v1',
            sourceContractVersion: 'v142_fandex_momentum_cross_family_combination_research_v1',
            state: 'categorical-research-output-only',
            canonicalArtistId: 'iu',
            alignmentCutoffAt: '2026-09-20T01:59:13.000Z',
            currentResearchOutput: {
              outputForm: 'structured-categorical-evidence',
              directionalConsensus: 'direction-conflicted',
              persistenceConsensus: 'persistence-not-applicable',
              qualitativeDirectionEvidenceUsable: false,
              levelPercentileSpreadDiagnostic: 100,
              productMomentumScore: null,
            },
            numericEligibility: {
              status: 'not-eligible',
              unmetRequirements: [],
              numericEstimand: null,
              calibrationTarget: null,
              mappingOrWeights: null,
              outOfSampleValidation: null,
              additionalFamiliesAloneSufficient: false,
              legacyPreviewSeedCalibrationAllowed: false,
            },
            currentProductSchema: {
              metricValueKind: 'number-or-null',
              weightedScoreRequiresNumericValue: true,
              currentMomentumSourceStage: 'derived_signal',
              currentMomentumQualityLabel: 'preview',
              previewFallbackEnabled: true,
              previewFallbackExample: null,
              categoricalEvidenceFitsCurrentMomentumSlot: false,
            },
            researchCarrier: {
              observationContractVersion: 'fandex-observation-v1',
              categoricalRawValueSupported: true,
              recommendedVariableId: 'momentum.cross-family-evidence-state.research',
              registryBindingEstablished: false,
              productMetricBindingEstablished: false,
            },
            blockers: [],
            digest: '87edf2884c2f35a3a5819349ebb374012926f103fdeb3d41af10da59ca68de7a',
            effects: {
              externalCalls: 0,
              databaseReads: 0,
              databaseWrites: 0,
              masterScoreWrites: 0,
              websiteWrites: 0,
            },
          };

          const previousEvaluationBoundary: any = {
            canonicalArtistId: 'iu',
            evaluatedAt: '2026-09-20T07:04:00.000Z',
            commonAlignmentCutoffAt: '2026-09-20T01:59:13.000Z',
            sourceV143Digest: '87edf2884c2f35a3a5819349ebb374012926f103fdeb3d41af10da59ca68de7a',
            directionalConsensus: 'direction-conflicted',
            persistenceConsensus: 'persistence-not-applicable',
            sourceEvidence: {
              lastfmEvidenceId: '723cf73abb93882779edc0621a12381ab80e464c',
              lastfmLatestComponentEndAt: '2026-09-20T01:59:13.000Z',
              naverEvidenceId: 'cc9abd83d82ab18c7304977070f95f1a5e2960c128cc6f1cba83a190d9a8afad',
              naverThroughSlotStart: '2026-09-20T06:00:00.000Z',
            },
          };

          const gate = evaluateFandexMomentumCommonCutoffAdvancementGateResearch({
            historyJsonl,
            result,
            sourceEvidence: {
              lastfmEvidenceId: '723cf73abb93882779edc0621a12381ab80e464c',
              lastfmLatestComponentEndAt: '2026-09-20T01:59:13.000Z',
              naverEvidenceId: '21a47c4d99698dfa18dd802f05ca5210a6618139529a0f917598854398b8e0c5',
              naverThroughSlotStart: '2026-09-20T14:00:00.000Z',
            },
            evaluatedAt: '2026-09-20T14:10:00.000Z',
            previousEvaluationBoundary,
          });

          if (gate.digest !== '72d556dc6925d2d2601d964bbbf73fcdccc6d68f84bc3f0df1ff1d0fc6e44ee8') {
            throw new Error('v150 digest mismatch');
          }

          const persisted = persistFandexMomentumEvaluationWatermarkResearch({
            watermarkJsonl: '',
            gate,
          });
          if (persisted.state !== 'appended' || persisted.resultingRecordCount !== 1) {
            throw new Error('v151 initial watermark materialization failed');
          }

          console.log(JSON.stringify({
            state: persisted.state,
            recordCount: persisted.resultingRecordCount,
            latestRecordDigest: persisted.resultingLatestRecordDigest,
            gateDigest: gate.digest,
            semanticCutoff: persisted.latestEvaluationBoundary?.commonAlignmentCutoffAt,
            naverThrough: persisted.latestEvaluationBoundary?.sourceEvidence.naverThroughSlotStart,
          }, null, 2));
          console.log('V151_JSONL_BEGIN');
          process.stdout.write(persisted.watermarkJsonl);
          console.log('V151_JSONL_END');
          TS
          npx tsx --conditions=react-server .tmp-v151-materialize.mts
          rm .tmp-v151-materialize.mts
