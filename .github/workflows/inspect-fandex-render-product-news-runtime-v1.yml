name: Inspect FANDEX Render Product News runtime v1

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-fandex-render-product-news-runtime-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-fandex-render-product-news-runtime-v1
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'kpopmaker/fandex' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Render Product beta once without retry
        shell: bash
        run: |
          set -euo pipefail

          status="$(
            curl               --silent               --show-error               --location               --request GET               --retry 0               --connect-timeout 15               --max-time 45               --output /tmp/fandex-render-beta.html               --write-out '%{http_code}'               'https://fandex-product-self-host-v1.onrender.com/artists/iu/fandex-beta'
          )"

          if [[ "$status" != "200" ]]; then
            echo "FANDEX_RENDER_PRODUCT_BETA_HTTP=failed"
            exit 1
          fi

          echo "FANDEX_RENDER_PRODUCT_BETA_HTTP=200"

      - name: Validate News runtime card only
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const html = fs.readFileSync(
            '/tmp/fandex-render-beta.html',
            'utf8',
          );

          const articles =
            html.match(/<article\b[\s\S]*?<\/article>/g) ?? [];
          const newsCard = articles.find((article) =>
            article.includes('newsIssuePoint'),
          );

          if (!newsCard) {
            console.log(
              'FANDEX_RENDER_NEWS_RUNTIME_CARD=missing',
            );
            process.exit(1);
          }

          const text = newsCard
            .replace(/<script\b[\s\S]*?<\/script>/g, ' ')
            .replace(/<style\b[\s\S]*?<\/style>/g, ' ')
            .replace(/<[^>]+>/g, ' ')
            .replace(/&nbsp;/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();

          const productionReal =
            text.includes('newsIssuePoint')
            && text.includes('Production')
            && /Material\s+real/.test(text)
            && !text.includes('확인 필요')
            && !text.includes('runtime-read-failed');

          if (!productionReal) {
            console.log(
              'FANDEX_RENDER_NEWS_RUNTIME_CARD=not-production-real',
            );
            process.exit(1);
          }

          console.log(
            'FANDEX_RENDER_NEWS_RUNTIME_CARD=production-real',
          );
          console.log(
            'FANDEX_RENDER_NEWS_RUNTIME_READ=validated',
          );
          NODE

      - name: Safety boundary
        if: always()
        run: |
          echo "FANDEX_RENDER_NEWS_RUNTIME_HTTP_GETS=1"
          echo "FANDEX_RENDER_NEWS_RUNTIME_PROVIDER_EXECUTIONS=0"
          echo "FANDEX_RENDER_NEWS_RUNTIME_DATABASE_WRITES=0"
          echo "FANDEX_RENDER_NEWS_RUNTIME_BLOB_WRITES=0"
          echo "FANDEX_RENDER_NEWS_RUNTIME_SCORE_WRITES=0"
          echo "FANDEX_RENDER_NEWS_RUNTIME_PUBLICATION_CHANGES=0"
          echo "FANDEX_RENDER_NEWS_RUNTIME_RAW_RESPONSE_LOGGED=false"
          echo "FANDEX_RENDER_NEWS_RUNTIME_CREDENTIALS_LOGGED=false"
