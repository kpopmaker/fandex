name: Inspect FANDEX Render Product runtime v1

on:
  pull_request:
    paths:
      - '.github/workflows/inspect-fandex-render-product-news-runtime-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inspect-fandex-render-product-runtime-v1
  cancel-in-progress: false

jobs:
  inspect:
    if: >-
      github.repository == 'kpopmaker/fandex'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read Render Product beta once without retry
        shell: bash
        run: |
          set -euo pipefail

          status="$(
            curl               --silent               --show-error               --location               --request GET               --retry 0               --connect-timeout 15               --max-time 45               --output /tmp/fandex-render-beta.html               --write-out '%{http_code}'               'https://fandex-product-self-host-v1.onrender.com/artists/iu/fandex-beta'
          )"

          if [[ "$status" != "200" ]]; then
            echo "FANDEX_RENDER_PRODUCT_BETA_HTTP=failed"
            exit 1
          fi

          echo "FANDEX_RENDER_PRODUCT_BETA_HTTP=200"

      - name: Validate News and Momentum runtime cards
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');

          const html = fs.readFileSync(
            '/tmp/fandex-render-beta.html',
            'utf8',
          );

          const articles =
            html.match(/<article\b[\s\S]*?<\/article>/g) ?? [];
          const newsCard = articles.find((article) =>
            article.includes('newsIssuePoint'),
          );

          if (!newsCard) {
            console.log('FANDEX_RENDER_NEWS_RUNTIME_CARD=missing');
            process.exit(1);
          }

          const newsText = newsCard
            .replace(/<script\b[\s\S]*?<\/script>/g, ' ')
            .replace(/<style\b[\s\S]*?<\/style>/g, ' ')
            .replace(/<[^>]+>/g, ' ')
            .replace(/&nbsp;/g, ' ')
            .replace(/\s+/g, ' ')
            .trim();

          const productionReal =
            newsText.includes('newsIssuePoint')
            && newsText.includes('Production')
            && /Material\s+real/.test(newsText)
            && !newsText.includes('확인 필요')
            && !newsText.includes('runtime-read-failed');

          if (!productionReal) {
            console.log(
              'FANDEX_RENDER_NEWS_RUNTIME_CARD=not-production-real',
            );
            process.exit(1);
          }

          function card(variableId, nextVariableId) {
            const start = html.indexOf(variableId);
            if (start < 0) {
              throw new Error('missing-card:' + variableId);
            }
            const end = nextVariableId
              ? html.indexOf(
                  nextVariableId,
                  start + variableId.length,
                )
              : html.length;
            if (end < 0) {
              throw new Error('missing-next-card:' + nextVariableId);
            }
            return html.slice(start, end);
          }

          const momentum = card(
            'growthMomentumPoint',
            'riskAdjustmentPoint',
          );
          const blockers = [
            'upstream-read-not-ok',
            'upstream-readiness-blocked',
            'runtime-read-failed',
            'source-currentness-audit-read-failed',
            'current-lastfm-status-read-failed',
          ];
          const blocker = blockers.find((value) =>
            momentum.includes(value),
          );

          if (blocker) {
            console.log(
              'FANDEX_RENDER_MOMENTUM_RUNTIME=blocked:' + blocker,
            );
            process.exit(1);
          }

          console.log(
            'FANDEX_RENDER_NEWS_RUNTIME_CARD=production-real',
          );
          console.log(
            'FANDEX_RENDER_NEWS_RUNTIME_READ=validated',
          );
          console.log(
            'FANDEX_RENDER_MOMENTUM_RUNTIME=readiness-traced',
          );
          NODE

      - name: Safety boundary
        if: always()
        run: |
          echo "FANDEX_RENDER_PRODUCT_RUNTIME_HTTP_GETS=1"
          echo "FANDEX_RENDER_PRODUCT_RUNTIME_PROVIDER_EXECUTIONS=0"
          echo "FANDEX_RENDER_PRODUCT_RUNTIME_DATABASE_WRITES=0"
          echo "FANDEX_RENDER_PRODUCT_RUNTIME_BLOB_WRITES=0"
          echo "FANDEX_RENDER_PRODUCT_RUNTIME_SCORE_WRITES=0"
          echo "FANDEX_RENDER_PRODUCT_RUNTIME_PUBLICATION_CHANGES=0"
          echo "FANDEX_RENDER_PRODUCT_RUNTIME_RAW_RESPONSE_LOGGED=false"
          echo "FANDEX_RENDER_PRODUCT_RUNTIME_CREDENTIALS_LOGGED=false"
