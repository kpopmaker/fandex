name: Validate Momentum PR324 against runtime-current main v1
# revalidation epoch: post-pr325

on:
  push:
    branches:
      - validation/momentum-pr324-runtime-current-main-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validation branch scope
        run: |
          git diff --name-only 2547d36d339b7bb3e231f82da19c72b2f446a953...HEAD | sort > /tmp/changed.txt
          printf '%s\n' '.github/workflows/validate-momentum-pr324-runtime-current-main-v1.yml' > /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - name: Capture runtime-current main and merge-simulate
        run: |
          git fetch origin "+refs/heads/main:refs/remotes/origin/main"
          CURRENT_MAIN="$(git rev-parse refs/remotes/origin/main)"
          echo "MOMENTUM_VALIDATED_MAIN_SHA=$CURRENT_MAIN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git merge --no-commit --no-ff "$CURRENT_MAIN"

      - run: npm ci

      - name: V2 carrier record candidate regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-v2-carrier-record-candidate-v1.test.mts

      - name: Current evaluation execution regression
        run: npx tsx --test tests/momentum-current-evaluation-execution-v1.test.mts

      - name: Preview-independent categorical attestation regression
        run: npx tsx --test tests/momentum-categorical-output-attestation-current-main-v1.test.mts

      - name: Carrier persistence decision regression
        run: npx tsx --test tests/momentum-carrier-persistence-decision-v1.test.mts

      - name: Carrier lineage regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-carrier-attestation-lineage-v2.test.mts

      - name: Existing carrier runtime regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-evidence-consensus-runtime-read-v1.test.mts

      - name: Existing Momentum Product contract regression
        run: npx tsx --test tests/momentum-evidence-consensus-product-contract-v1.test.mts

      - name: Existing live-shadow readiness regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-live-shadow-product-readiness-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
