name: Album Fix Observation ID Determinism

on:
  push:
    branches:
      - integration/album-first-bounded-production-research-write
    paths:
      - ".github/workflows/album-fix-observation-id-determinism.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/album-first-bounded-production-research-write
      - name: Patch stable observation ID projection
        shell: python
        run: |
          from pathlib import Path
          p = Path('lib/alternative-evidence/directAlbumProvider.ts')
          text = p.read_text()
          start = text.index('export function buildDirectAlbumObservationId(')
          end = text.index('\n\nexport function buildDirectAlbumObservation(', start)
          replacement = '''export function buildDirectAlbumObservationId(input: Readonly<{
            providerId: string;
            providerObservationId: string | null;
            providerArtistId: string | null;
            providerReleaseId: string | null;
            providerEditionId: string | null;
            providerSkuId: string | null;
            semantic: DirectAlbumObservationSemantic;
            value: number | null;
            unit: DirectAlbumObservationUnit;
            territory: string | null;
            format: string | null;
            providerPeriod: string | null;
            revisionId: string | null;
          }>): string {
            return sha256Canonical({
              contractVersion: DIRECT_ALBUM_OBSERVATION_CONTRACT_VERSION,
              providerId: input.providerId,
              providerObservationId: input.providerObservationId,
              providerArtistId: input.providerArtistId,
              providerReleaseId: input.providerReleaseId,
              providerEditionId: input.providerEditionId,
              providerSkuId: input.providerSkuId,
              semantic: input.semantic,
              value: input.value,
              unit: input.unit,
              territory: input.territory,
              format: input.format,
              providerPeriod: input.providerPeriod,
              revisionId: input.revisionId,
            });
          }'''
          p.write_text(text[:start] + replacement + text[end:])
      - name: Verify only target file changed
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          test "$changed" = "lib/alternative-evidence/directAlbumProvider.ts"
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/alternative-evidence/directAlbumProvider.ts
          git commit -m "fix(album): make direct observation IDs time-invariant"
          git push origin HEAD:integration/album-first-bounded-production-research-write
