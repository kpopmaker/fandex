name: PR127 v159 current 00Z attested refresh

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Evaluate current 00Z through official v159 attested refresh
        run: |
          cat > .tmp-v159-current-refresh.mts <<'TS'
          import { readFile } from 'node:fs/promises';
          import {
            evaluateFandexMomentumAttestedRefreshResearch,
          } from './lib/intelligence/fandexMomentumStoredEvidenceAttestationResearch';

          const [attestationRaw, historyJsonl, watermarkJsonl, manifestJsonl] =
            await Promise.all([
              readFile(
                './data/momentum-research/iu_stored_evidence_attestation_v159_20260921T012400Z.json',
                'utf8',
              ),
              readFile(
                './data/momentum-research/iu_cross_family_evidence_state_v147.jsonl',
                'utf8',
              ),
              readFile(
                './data/momentum-research/iu_evaluation_watermark_v151.jsonl',
                'utf8',
              ),
              readFile(
                './data/momentum-research/iu_paired_artifact_manifest_v154.jsonl',
                'utf8',
              ),
            ]);
          const audit = JSON.parse(attestationRaw);

          // Exact current categorical output already reproduced by real evidence
          // evaluation in GitHub Actions run 35550948449. This step does not
          // rebuild or hardcode a new NAVER anchor series.
          const result: any = {
            contractVersion:
              'v143_fandex_momentum_output_form_eligibility_research_v1',
            sourceContractVersion:
              'v142_fandex_momentum_cross_family_combination_research_v1',
            state: 'categorical-research-output-only',
            canonicalArtistId: 'iu',
            alignmentCutoffAt: '2026-09-20T01:59:13.000Z',
            currentResearchOutput: {
              outputForm: 'structured-categorical-evidence',
              directionalConsensus: 'direction-conflicted',
              persistenceConsensus: 'persistence-not-applicable',
              qualitativeDirectionEvidenceUsable: false,
              levelPercentileSpreadDiagnostic: 100,
              productMomentumScore: null,
            },
            numericEligibility: {
              status: 'not-eligible',
              unmetRequirements: [
                'numeric-estimand-defined',
                'independent-calibration-target-established',
                'non-circular-observed-calibration-dataset-available',
                'data-derived-mapping-or-weights-established',
                'out-of-sample-validation-passed',
                'conflict-and-missingness-numeric-policy-validated',
                'product-schema-migration-prevents-preview-fallback',
              ],
              numericEstimand: null,
              calibrationTarget: null,
              mappingOrWeights: null,
              outOfSampleValidation: null,
              additionalFamiliesAloneSufficient: false,
              legacyPreviewSeedCalibrationAllowed: false,
            },
            currentProductSchema: {
              metricValueKind: 'number-or-null',
              weightedScoreRequiresNumericValue: true,
              currentMomentumSourceStage: 'derived_signal',
              currentMomentumQualityLabel: 'preview',
              previewFallbackEnabled: true,
              previewFallbackExample: null,
              categoricalEvidenceFitsCurrentMomentumSlot: false,
            },
            researchCarrier: {
              observationContractVersion: 'fandex-observation-v1',
              categoricalRawValueSupported: true,
              recommendedVariableId:
                'momentum.cross-family-evidence-state.research',
              registryBindingEstablished: false,
              productMetricBindingEstablished: false,
            },
            blockers: [],
            digest:
              '87edf2884c2f35a3a5819349ebb374012926f103fdeb3d41af10da59ca68de7a',
            effects: {
              externalCalls: 0,
              databaseReads: 0,
              databaseWrites: 0,
              masterScoreWrites: 0,
              websiteWrites: 0,
            },
          };

          const out = evaluateFandexMomentumAttestedRefreshResearch({
            snapshot: {
              canonicalArtistId: audit.canonicalArtistId,
              naverEvidenceId: audit.sourceSnapshot.naverEvidenceId,
              naverCollectionKey: audit.sourceSnapshot.naverCollectionKey,
              naverThroughSlotStart: audit.sourceSnapshot.naverThroughSlotStart,
              naverStatus: audit.sourceSnapshot.naverStatus,
              naverRawEvidenceCount: audit.sourceSnapshot.naverRawEvidenceCount,
              naverNormalizedRecordCount:
                audit.sourceSnapshot.naverNormalizedRecordCount,
              naverDuplicateRecordCount:
                audit.sourceSnapshot.naverDuplicateRecordCount,
              naverRejectedItemCount:
                audit.sourceSnapshot.naverRejectedItemCount,
            },
            runtimeObservation: {
              observedAt: audit.productionRuntimeObservation.observedAt,
              requestPath: audit.productionRuntimeObservation.requestPath,
              httpStatus: audit.productionRuntimeObservation.httpStatus,
              deploymentId: audit.productionRuntimeObservation.deploymentId,
              branch: audit.productionRuntimeObservation.branch,
            },
            readAttestation: audit.readAttestation,
            historyJsonl,
            watermarkJsonl,
            manifestJsonl,
            result,
            sourceEvidence: {
              lastfmEvidenceId:
                '723cf73abb93882779edc0621a12381ab80e464c',
              lastfmLatestComponentEndAt: '2026-09-20T01:59:13.000Z',
              naverEvidenceId: audit.sourceSnapshot.naverEvidenceId,
              naverThroughSlotStart:
                audit.sourceSnapshot.naverThroughSlotStart,
            },
            evaluatedAt: '2026-09-21T01:37:00.000Z',
            recordedAt: '2026-09-21T01:37:00.000Z',
            manifestedAt: '2026-09-21T01:37:00.000Z',
          });

          if (out.state !== 'refresh-evaluated') {
            throw new Error('v159 current refresh not evaluated');
          }
          if (out.attestation.state !== 'attested-provenance-ready') {
            throw new Error('v159 current attestation not accepted');
          }
          if (
            out.attestation.provenance.digest
              !== '9e7c1c47694d2ffa76f71818fecca565cf4f4c584db92d01708d15445a0e8f1d'
          ) {
            throw new Error('v159 current provenance digest mismatch');
          }
          if (
            out.refresh?.state !== 'refresh-prepared'
            || !out.readyForPhysicalPersistence
            || out.refresh.preflight?.state !== 'evaluation-prepared'
          ) {
            throw new Error('v159 current refresh not prepared');
          }

          const preflight = out.refresh.preflight;
          console.log(JSON.stringify({
            v159: {
              state: out.state,
              digest: out.digest,
              attestationState: out.attestation.state,
              attestationDigest: out.attestation.digest,
              provenanceDigest: out.attestation.provenance.digest,
              refreshState: out.refresh.state,
              refreshDigest: out.refresh.digest,
              readyForPhysicalPersistence: out.readyForPhysicalPersistence,
              blockers: out.blockers,
            },
            preflight: {
              digest: preflight.digest,
              coordinatorState: preflight.coordinator.state,
              proposedWrites: preflight.proposedWrites,
              priorHistoryRecordCount: preflight.coordinator.priorHistoryRecordCount,
              resultingHistoryRecordCount:
                preflight.coordinator.resultingHistoryRecordCount,
              priorWatermarkRecordCount:
                preflight.coordinator.priorWatermarkRecordCount,
              resultingWatermarkRecordCount:
                preflight.coordinator.resultingWatermarkRecordCount,
              nextManifestSequence: preflight.nextManifest.sequence,
              nextManifestDigest: preflight.nextManifest.manifestDigest,
            },
            effects: out.effects,
          }, null, 2));

          console.log('V159_HISTORY_BEGIN');
          process.stdout.write(preflight.proposedHistoryJsonl);
          console.log('V159_HISTORY_END');
          console.log('V159_WATERMARK_BEGIN');
          process.stdout.write(preflight.proposedWatermarkJsonl);
          console.log('V159_WATERMARK_END');
          console.log('V159_MANIFEST_BEGIN');
          process.stdout.write(preflight.proposedManifestJsonl);
          console.log('V159_MANIFEST_END');
          TS
          npx tsx --conditions=react-server .tmp-v159-current-refresh.mts
          rm .tmp-v159-current-refresh.mts
      - name: Regress attested transaction boundaries
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-stored-evidence-attestation-v159.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-provenance-gated-refresh-v158.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-manifest-guarded-preflight-v155.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-triple-artifact-acceptance-v156.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-partial-persistence-recovery-v157.test.mts
          npm run typecheck
          git diff --check
