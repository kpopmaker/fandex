name: Validate snsFandomPoint common Product adapter v1

on:
  pull_request:
    paths:
      - 'lib/product/adapters/snsFandomPointFandexVariableProduct.ts'
      - 'lib/product/contracts/fandexVariableProduct.ts'
      - 'lib/intelligence/snsFandomPointContracts.ts'
      - 'tests/sns-fandom-point-fandex-variable-product-v1.test.mts'
      - '.github/workflows/validate-sns-fandom-point-fandex-variable-product-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/sns-fandom-point-fandex-variable-product-v1.test.mts tests/risk-adjustment-current-main-sns-fandom-eligibility-v1.test.mts tests/fandex-variable-product-contract-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
