name: PR170 album provider survey validation

on:
  push:
    branches:
      - research/musicbrainz-album-catalog-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate album provider survey and readiness
        run: |
          npx tsx --test tests/album-completed-purchase-provider-survey-research-v1.test.mts
          npx tsx --test tests/album-production-readiness-research-v1.test.mts
          npx tsx --test tests/album-provider-authorization-research-v1.test.mts
          npx tsx --test tests/album-normalization-research-v1.test.mts
          npx tsx --test tests/album-direct-first-week-absolute-research-v1.test.mts
          npm run typecheck
