name: NAVER Media Activity Production Research Once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  research:
    if: contains(github.event.head_commit.message, '[media-activity-runtime-research]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require scheduler secret
        shell: bash
        env:
          FANDEX_NAVER_NEWS_SCHEDULER_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_SCHEDULER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "$FANDEX_NAVER_NEWS_SCHEDULER_SECRET" ]; then
            echo "Scheduler secret is not configured."
            exit 2
          fi

      - name: Invoke production read-only methodology research
        shell: bash
        env:
          FANDEX_NAVER_NEWS_SCHEDULER_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_SCHEDULER_SECRET }}
        run: |
          set -euo pipefail
          url="https://fandex-eta.vercel.app/api/internal/naver-news/media-activity-method-research"
          rm -f response.json
          for attempt in $(seq 1 30); do
            status=$(curl \
              --silent \
              --show-error \
              --output response.json \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${FANDEX_NAVER_NEWS_SCHEDULER_SECRET}" \
              --header 'Content-Type: application/json' \
              --data '{}' \
              --connect-timeout 10 \
              --max-time 30 \
              "$url" || true)
            if [ "$status" = "200" ]; then
              node <<'NODE'
          const fs = require('node:fs');
          const body = JSON.parse(fs.readFileSync('response.json', 'utf8'));
          const expectedWindows = [1, 2, 4, 8, 12];
          const valid = body?.ok === true
            && body?.mode === 'media-activity-method-research'
            && body?.executionScope === 'research_only_non_normative'
            && body?.lifecycle === 'research'
            && body?.directProductContributionEligible === false
            && body?.productScorePublished === false
            && body?.canonicalArtistId === 'iu'
            && body?.throughSlotStart === '2026-09-16T06:00:00.000Z'
            && JSON.stringify(body?.candidateWindowSlotCounts) === JSON.stringify(expectedWindows);
          if (!valid) {
            console.error('Production methodology research response failed the bounded research contract.');
            process.exit(1);
          }
          process.stdout.write(`${JSON.stringify(body, null, 2)}\n`);
          NODE
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 10
            fi
          done
          echo "Production methodology research did not return HTTP 200 within the retry window."
          if [ -f response.json ]; then
            cat response.json
          fi
          exit 1
