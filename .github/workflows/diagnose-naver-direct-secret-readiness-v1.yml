name: Diagnose NAVER direct secret readiness v1

on:
  push:
    branches:
      - diagnostic/naver-direct-secret-readiness-v1

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FANDEX_RUNTIME_DATABASE_URL: ${{ secrets.FANDEX_RUNTIME_DATABASE_URL }}
      FANDEX_NAVER_NEWS_CLIENT_ID: ${{ secrets.FANDEX_NAVER_NEWS_CLIENT_ID }}
      FANDEX_NAVER_NEWS_CLIENT_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_CLIENT_SECRET }}
      FANDEX_NAVER_NEWS_SCHEDULER_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_SCHEDULER_SECRET }}
    steps:
      - name: Emit bounded presence classes only
        shell: bash
        run: |
          set -euo pipefail
          classify() {
            if [[ -n "$2" ]]; then
              echo "$1=present"
            else
              echo "$1=missing"
            fi
          }
          classify FANDEX_DIRECT_SECRET_RUNTIME_DATABASE "$FANDEX_RUNTIME_DATABASE_URL"
          classify FANDEX_DIRECT_SECRET_NAVER_CLIENT_ID "$FANDEX_NAVER_NEWS_CLIENT_ID"
          classify FANDEX_DIRECT_SECRET_NAVER_CLIENT_SECRET "$FANDEX_NAVER_NEWS_CLIENT_SECRET"
          classify FANDEX_DIRECT_SECRET_SCHEDULER_SECRET "$FANDEX_NAVER_NEWS_SCHEDULER_SECRET"
          echo "FANDEX_DIRECT_SECRET_VALUES_LOGGED=false"
          echo "FANDEX_DIRECT_PRODUCTION_EFFECTS=0"
