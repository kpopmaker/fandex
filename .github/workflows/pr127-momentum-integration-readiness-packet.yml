name: PR127 momentum integration readiness packet

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - data/momentum-research/pr127_integration_readiness_packet_20260925T093700KST.json
      - tests/fandex-momentum-pr127-integration-readiness-packet.test.mts
      - .github/workflows/pr127-momentum-integration-readiness-packet.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: packet invariants
        run: npx tsx --test tests/fandex-momentum-pr127-integration-readiness-packet.test.mts
      - name: stale-base audit replay
        run: npx tsx --test tests/fandex-momentum-pr127-stale-base-conflict-audit.test.mts
      - name: v181 regression
        run: npx tsx --test tests/fandex-momentum-verifier-external-capability-resume-gate-v181.test.mts
      - name: typecheck
        run: npm run typecheck
      - name: full PR diff check
        run: git diff --check origin/main...HEAD
