name: Apply Activity Exposure Neon main migration v1

on:
  push:
    branches:
      - validation/activity-exposure-neon-main-migration-v1

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FANDEX_MIGRATION_DATABASE_URL: ${{ secrets.FANDEX_MIGRATION_DATABASE_URL }}
      FANDEX_APPROVE_V114_MIGRATION: approved-v114-managed-postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Migration credential preflight
        shell: bash
        run: |
          if [[ -z "${FANDEX_MIGRATION_DATABASE_URL}" ]]; then
            echo "FANDEX_MIGRATION_DATABASE_URL_AVAILABLE=false"
            exit 1
          fi
          echo "FANDEX_MIGRATION_DATABASE_URL_AVAILABLE=true"
      - name: Verify exact migration plan
        shell: bash
        run: |
          npx tsx scripts/database/run-postgres-migrations.mts > /tmp/fandex-migration-plan.json
          node - <<'NODE'
          const fs = require('fs');
          const plan = JSON.parse(fs.readFileSync('/tmp/fandex-migration-plan.json', 'utf8'));
          const v3 = plan.migrations.filter((m) => m.version === 3);
          if (v3.length !== 1) throw new Error('v003_plan_count_mismatch');
          if (v3[0].fileName !== '003_activity_exposure_persistence_v1.sql') throw new Error('v003_plan_filename_mismatch');
          console.log('V003_PLAN_SHA256=' + v3[0].sha256);
          NODE
      - name: Apply approved Neon main migration
        run: npx tsx scripts/database/run-postgres-migrations.mts --apply
      - name: Verify applied schema and digest
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { readFile } from 'node:fs/promises';
          import pg from 'pg';
          const { Client } = pg;
          const sql = (await readFile('database/migrations/003_activity_exposure_persistence_v1.sql','utf8')).replace(/\r\n/g,'\n');
          const expected = createHash('sha256').update(sql,'utf8').digest('hex');
          const client = new Client({
            connectionString: process.env.FANDEX_MIGRATION_DATABASE_URL,
            ssl: { rejectUnauthorized: true },
          });
          await client.connect();
          try {
            const mig = await client.query(
              'SELECT migration_sha256 FROM fandex.schema_migrations WHERE version = $1',
              [3],
            );
            if (mig.rowCount !== 1 || mig.rows[0].migration_sha256 !== expected) {
              throw new Error('v003_migration_digest_mismatch');
            }
            const tables = await client.query(`
              SELECT
                to_regclass('fandex.activity_exposure_collection_runs') IS NOT NULL AS runs,
                to_regclass('fandex.activity_exposure_provider_observations') IS NOT NULL AS observations,
                to_regclass('fandex.activity_exposure_raw_payloads') IS NOT NULL AS raw_payloads,
                to_regclass('fandex.activity_exposure_events') IS NOT NULL AS events,
                to_regclass('fandex.source_ingestion_jobs') IS NOT NULL AS naver_jobs,
                to_regclass('fandex.source_ingestion_raw_evidence') IS NOT NULL AS naver_raw,
                to_regclass('fandex.source_ingestion_normalized_records') IS NOT NULL AS naver_normalized
            `);
            const row = tables.rows[0];
            if (!Object.values(row).every(Boolean)) throw new Error('required_table_missing');
            const numeric = await client.query(`
              SELECT count(*)::int AS count
              FROM information_schema.columns
              WHERE table_schema='fandex'
                AND table_name LIKE 'activity_exposure_%'
                AND column_name ~* '(score|point|weight|decay|active_window|active_until)'
            `);
            if (numeric.rows[0].count !== 0) throw new Error('prohibited_numeric_methodology_column');
            const grants = await client.query(`
              SELECT count(*)::int AS count
              FROM information_schema.role_table_grants
              WHERE grantee='fandex_runtime'
                AND table_schema='fandex'
                AND table_name IN (
                  'activity_exposure_collection_runs',
                  'activity_exposure_provider_observations',
                  'activity_exposure_raw_payloads',
                  'activity_exposure_events'
                )
            `);
            if (grants.rows[0].count < 8) throw new Error('runtime_grants_incomplete');
            console.log('ACTIVITY_EXPOSURE_NEON_MAIN_MIGRATION=PASS');
            console.log('V003_APPLIED_SHA256=' + expected);
          } finally {
            await client.end();
          }
          NODE
