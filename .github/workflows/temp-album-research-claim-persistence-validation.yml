name: temp-album-research-claim-persistence-validation

on:
  push:
    branches:
      - research/musicbrainz-album-catalog-v1
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/album-research-claim-persistence-v1.test.mts
      - run: npx tsx --test tests/iu-the-winning-research-evidence-v1.test.mts
      - run: npm run test:alternative-evidence:v1
      - run: npm run test:album:synthetic-gate
      - run: npm run typecheck
      - run: |
          npx tsx -e "import {buildIuTheWinningReportedWeeklySalesClaim,serializeAlbumResearchClaim} from './lib/alternative-evidence/albumResearchClaimPersistenceResearch.ts'; console.log(JSON.stringify(serializeAlbumResearchClaim(buildIuTheWinningReportedWeeklySalesClaim()),null,2));"
