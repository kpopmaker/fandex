name: PR127 v166 Configuration Mutation Execution

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - .github/workflows/pr127-v166-configuration-mutation-execution.yml

permissions:
  contents: read

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      FANDEX_NAVER_NEWS_SCHEDULER_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_SCHEDULER_SECRET }}
      MOMENTUM_V166_RESULT_PATH: operator-result/pr127_v166_configuration_mutation_result.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Validate frozen authorization and execute bounded Production verifier configuration mutation
        run: npx tsx scripts/momentum-research/pr127-v166-execute-configuration-mutation.mts

      - name: Upload sanitized mutation result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr127-v166-configuration-mutation-${{ github.run_id }}
          path: operator-result/pr127_v166_configuration_mutation_result.json
          if-no-files-found: error
          retention-days: 7
