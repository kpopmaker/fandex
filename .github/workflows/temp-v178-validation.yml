name: temp-v178-validation
on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model

jobs:
  validate-v178:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: v178 tests
        run: npx tsx --test tests/fandex-momentum-verifier-operator-response-projection-v178.test.mts
      - name: v177 regression
        run: npx tsx --test tests/fandex-momentum-verifier-operator-response-intake-v177.test.mts
      - name: v173 regression
        run: npx tsx --test tests/fandex-momentum-verifier-vercel-inventory-execution-envelope-v173.test.mts
      - name: typecheck
        run: npm run typecheck
      - name: diff check
        run: git diff --check HEAD^ HEAD
