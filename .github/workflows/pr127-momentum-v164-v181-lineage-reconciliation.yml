name: PR127 momentum v164-v181 lineage reconciliation

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - 'lib/intelligence/fandexMomentumVerifierConfigurationEvidenceResearch.ts'
      - 'lib/intelligence/fandexMomentumVerifierVercelInventoryExecutionEnvelopeResearch.ts'
      - 'tests/fandex-momentum-verifier-configuration-evidence-v164.test.mts'
      - 'tests/fandex-momentum-verifier-vercel-inventory-execution-envelope-v173.test.mts'
      - '.github/workflows/pr127-momentum-v164-v181-lineage-reconciliation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Evaluate current v181 capability recheck
        run: |
          cat > .tmp-v181-current-recheck.mts <<'TS'
          import {
            evaluateFandexMomentumVerifierExternalCapabilityResumeGate,
          } from './lib/intelligence/fandexMomentumVerifierExternalCapabilityResumeGateResearch';

          const result = evaluateFandexMomentumVerifierExternalCapabilityResumeGate({
            observedAt: '2026-09-24T07:51:00.000Z',
            upstreamV180Digest:
              '66e38e1ff092131b3e1bb9761e7f173970e937386ef7e4336cb7271d19e7377c',
            target: {
              teamId: 'team_OrRPxuBxMwCYU3kk0r76AfOs',
              projectId: 'prj_aT3p8zmjyochu8iGmFOuNR1lSU7v',
              method: 'GET',
              endpoint: '/v10/projects/{idOrName}/env',
              decrypt: 'false',
              maximumProviderCalls: 1,
              maximumInventoryReads: 1,
            },
            connectedCapability: {
              vercelPluginInstalled: true,
              vercelPluginEnabled: true,
              vercelSkillAdvertisesEnvironmentVariableSupport: true,
              exactEnvInventoryReadToolExposed: false,
              genericRestReadToolExposed: false,
              projectMetadataToolExposed: true,
              projectMetadataToolCallableForTarget: false,
              projectMetadataToolFailure:
                'connector-schema-server-argument-mismatch',
            },
            localCapability: {
              vercelCliInstalled: false,
              vercelCliAuthenticated: false,
              vercelTokenEnvironmentPresent: false,
            },
            browserCapability: {
              executableBrowserAutomationToolExposed: false,
              authenticatedVercelBrowserSessionAvailable: false,
            },
            externalOperator: {
              validV177PreReadResponseAvailable: false,
              validV179PostReadResponseAvailable: false,
            },
          });
          console.log('V181_RECHECK_BEGIN');
          console.log(JSON.stringify(result, null, 2));
          console.log('V181_RECHECK_END');
          TS
          npx tsx --conditions=react-server .tmp-v181-current-recheck.mts
          rm .tmp-v181-current-recheck.mts

      - name: Validate full v164-v181 lineage
        run: |
          for test_file in \
            tests/fandex-momentum-verifier-configuration-evidence-v164.test.mts \
            tests/fandex-momentum-verifier-provisioning-authorization-plan-v165.test.mts \
            tests/fandex-momentum-verifier-configuration-authorization-v166.test.mts \
            tests/fandex-momentum-verifier-configuration-mutation-execution-guard-v167.test.mts \
            tests/fandex-momentum-verifier-vercel-mutation-dry-run-v168.test.mts \
            tests/fandex-momentum-verifier-premutation-rollback-readiness-v169.test.mts \
            tests/fandex-momentum-verifier-vercel-inventory-adapter-v170.test.mts \
            tests/fandex-momentum-verifier-vercel-inventory-acquisition-v171.test.mts \
            tests/fandex-momentum-verifier-vercel-inventory-read-channel-plan-v172.test.mts \
            tests/fandex-momentum-verifier-vercel-inventory-execution-envelope-v173.test.mts \
            tests/fandex-momentum-verifier-vercel-inventory-execution-receipt-v174.test.mts \
            tests/fandex-momentum-verifier-real-inventory-acquisition-readiness-v175.test.mts \
            tests/fandex-momentum-verifier-inventory-operator-handoff-v176.test.mts \
            tests/fandex-momentum-verifier-operator-response-intake-v177.test.mts \
            tests/fandex-momentum-verifier-operator-response-projection-v178.test.mts \
            tests/fandex-momentum-verifier-external-inventory-execution-response-intake-v179.test.mts \
            tests/fandex-momentum-verifier-external-execution-channel-resolution-v180.test.mts \
            tests/fandex-momentum-verifier-external-capability-resume-gate-v181.test.mts
          do
            npx tsx --conditions=react-server --test "$test_file"
          done
          npm run typecheck
          git diff --check
          git fetch origin main:refs/remotes/origin/main
          git diff --check origin/main...HEAD
