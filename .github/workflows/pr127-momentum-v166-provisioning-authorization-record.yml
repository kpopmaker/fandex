name: PR127 momentum v166 provisioning authorization record

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - 'lib/intelligence/fandexMomentumVerifierProvisioningAuthorizationRecordResearch.ts'
      - 'tests/fandex-momentum-verifier-provisioning-authorization-record-v166.test.mts'
      - '.github/workflows/pr127-momentum-v166-provisioning-authorization-record.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Evaluate current pending v166 authorization record
        run: |
          cat > .tmp-v166-current.mts <<'TS'
          import {
            evaluateFandexMomentumVerifierProvisioningAuthorizationRecord,
          } from './lib/intelligence/fandexMomentumVerifierProvisioningAuthorizationRecordResearch';

          const out = evaluateFandexMomentumVerifierProvisioningAuthorizationRecord({
            expectedV165PlanDigest:
              'f75d091666f2f8e9109918e8857cb0e0941c1a641cac8dd86660ba45cb10734f',
            evaluationAt: '2026-09-21T23:35:00.000Z',
            record: {
              upstreamV165PlanDigest:
                'f75d091666f2f8e9109918e8857cb0e0941c1a641cac8dd86660ba45cb10734f',
              target: {
                teamId: 'team_OrRPxuBxMwCYU3kk0r76AfOs',
                projectId: 'prj_aT3p8zmjyochu8iGmFOuNR1lSU7v',
                projectName: 'fandex',
                environment: 'production',
              },
              authorizedChanges: [
                {
                  key: 'FANDEX_MOMENTUM_NATIVE_VERIFIER_CHANNEL_ENABLED',
                  operation: 'set-exact-non-secret-value',
                  exactValue: 'approved-v162-research-read-only',
                  productionOnly: true,
                },
                {
                  key: 'FANDEX_MOMENTUM_NATIVE_VERIFIER_CHANNEL_DEPLOYMENT',
                  operation: 'set-exact-non-secret-value',
                  exactValue: 'production',
                  productionOnly: true,
                },
                {
                  key: 'FANDEX_MOMENTUM_NATIVE_VERIFIER_SECRET',
                  operation: 'create-or-set-dedicated-secret-without-output',
                  exactValue: null,
                  productionOnly: true,
                },
              ],
              dedicatedSecretPolicy: {
                schedulerCredentialKey: 'FANDEX_NAVER_NEWS_SCHEDULER_SECRET',
                minimumUtf8Bytes: 24,
                maximumUtf8Bytes: 512,
                whitespaceOrControlCharactersForbidden: true,
                mustDifferFromSchedulerCredential: true,
                nonEqualityProofRequiredWithoutSecretOutput: true,
                secretValueExposureAuthorized: false,
              },
              exclusions: {
                runtimeDatabaseMutationAuthorized: false,
                schedulerConfigurationMutationAuthorized: false,
                productMutationAuthorized: false,
                registryMutationAuthorized: false,
                productionDeploymentAuthorized: false,
                verifierActivationAuthorized: false,
                nativeVerifierExecutionAuthorized: false,
                ledgerAdvanceAuthorized: false,
              },
              decision: {
                state: 'pending',
                decidedAt: null,
                decidedBy: null,
                expiresAt: null,
                reason: null,
              },
            },
          });

          if (
            out.state !== 'authorization-pending'
            || out.authorizationEffective
            || out.configurationMutationAuthorized
          ) {
            throw new Error('current v166 record must remain pending/ungranted');
          }

          console.log('V166_CURRENT_BEGIN');
          console.log(JSON.stringify(out, null, 2));
          console.log('V166_CURRENT_END');
          TS
          npx tsx --conditions=react-server .tmp-v166-current.mts
          rm .tmp-v166-current.mts

      - name: Validate v166 and upstream regressions
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-provisioning-authorization-record-v166.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-provisioning-authorization-plan-v165.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-configuration-evidence-v164.test.mts
          npm run typecheck
          git diff --check
