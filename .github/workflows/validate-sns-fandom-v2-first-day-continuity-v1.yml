name: Validate snsFandom v2 first-day continuity readback v1

on:
  pull_request:
    paths:
      - 'lib/intelligence/snsFandomYoutubeV2FirstDayContinuityV1.ts'
      - 'scripts/operations/snsFandomYoutubeV2FirstDayContinuityReadbackV1.mts'
      - 'tests/sns-fandom-youtube-v2-first-day-continuity-v1.test.mts'
      - '.github/workflows/validate-sns-fandom-v2-first-day-continuity-v1.yml'
  workflow_dispatch:
    inputs:
      verify_live_blob:
        description: Run read-only first-day evidence audit on main (no writes or provider calls)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: First-day continuity and safety regressions
        run: npx tsx --test tests/sns-fandom-youtube-v2-first-day-continuity-v1.test.mts
      - name: Typecheck
        run: npm run typecheck
      - name: Safety boundary
        if: always()
        run: |
          echo "providerCallsPerformed=false"
          echo "blobWrites=0"
          echo "manualV2ProviderDispatch=false"
          echo "historicalBackfill=false"
          echo "productionCollectionAuthorized=false"
          echo "productActivationAuthorized=false"

  live-readback:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.verify_live_blob == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.FANDEX_NAVER_EVIDENCE_BLOB_READ_WRITE_TOKEN }}
      FANDEX_SNS_FANDOM_RECURRING_V2_AUTHORIZED_REVISION_SHA: '27a007c2afb4776cf2ae89c2e8bd4ba5f9a8f688'
      FANDEX_SNS_FANDOM_RECURRING_V2_CUTOVER_EVIDENCE_REF: 'github-issue://kpopmaker/fandex/issues/509#issuecomment-6049459425'
      FANDEX_SNS_FANDOM_V2_FIRST_SUCCESSFUL_SLOT_START: '2026-10-08T01:00:00.000Z'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify stored v2 first-day canonical and all 24 immutable receipts
        run: |
          test -n "$BLOB_READ_WRITE_TOKEN"
          npx tsx scripts/operations/snsFandomYoutubeV2FirstDayContinuityReadbackV1.mts
      - name: Safety boundary
        if: always()
        run: |
          echo "auditScope=first-24-natural-v2-hourly-slots"
          echo "blobWrites=0"
          echo "providerCallsPerformed=false"
          echo "manualV2ProviderDispatch=false"
          echo "historicalBackfill=false"
          echo "productionCollectionAuthorized=false"
          echo "productActivationAuthorized=false"
