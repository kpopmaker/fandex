name: Temporary Momentum recovery current-evidence probe v1

on:
  push:
    branches:
      - work/momentum-post-outage-recovery-readiness-v1

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FANDEX_RUNTIME_DATABASE_URL: ${{ secrets.FANDEX_RUNTIME_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read current recovery readiness
        run: npx tsx scripts/operations/momentumPostOutageRecoveryReadinessV1.mts
