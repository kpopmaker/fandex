name: FANDEX market collect

# 15분마다 실데이터를 모아 market-data 브랜치를 새로 만든다.
# (사이트는 market-data 브랜치의 latest.json, history.json.gz를 읽는다)
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
  # 개발 중 확인용: 수집기 코드를 work 브랜치에 올리면 한 번 돌려 본다.
  push:
    branches:
      - 'work/market-live-*'
    paths:
      - 'scripts/market/**'
      - 'data/market/**'
      - 'lib/market/formula.ts'
      - 'lib/market/variables.ts'
      - 'lib/market/dataFiles.ts'
      - '.github/workflows/market-collect.yml'

permissions:
  contents: write

concurrency:
  group: fandex-market-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load previous market data
        run: |
          mkdir -p market-prev
          if git fetch --depth=1 origin market-data:refs/remotes/origin/market-data; then
            git archive origin/market-data | tar -x -C market-prev
          else
            echo "No previous market data. Starting fresh."
          fi

      - name: Collect
        env:
          PREV_DIR: market-prev
          OUT_DIR: market-out
          FANDEX_NAVER_NEWS_CLIENT_ID: ${{ secrets.FANDEX_NAVER_NEWS_CLIENT_ID }}
          FANDEX_NAVER_NEWS_CLIENT_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_CLIENT_SECRET }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          # 벅스처럼 중간 인증서를 빠뜨리는 사이트도 받을 수 있게 시스템 인증서를 쓴다.
          NODE_OPTIONS: --use-system-ca
        run: npx --yes tsx@4.23.12 scripts/market/collect.ts

      - name: Publish market-data branch
        shell: bash
        run: |
          set -euo pipefail
          cd market-out
          git init -q -b market-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "market data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" market-data:market-data
