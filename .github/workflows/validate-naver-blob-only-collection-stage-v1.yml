name: Validate NAVER Blob-only collection stage v1

on:
  push:
    branches:
      - integration/ops-naver-blob-only-collection-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event_name == 'push' ||
      github.head_ref == 'integration/ops-naver-blob-only-collection-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "+refs/heads/main:refs/remotes/origin/main"
            MERGE_BASE="$(git merge-base refs/remotes/origin/main "$PR_HEAD_SHA")"
            git diff --name-only "$MERGE_BASE...$PR_HEAD_SHA" | sort > /tmp/changed.txt
          else
            git diff --name-only 76fb7eef62723c8ba8186614d3d862a00fce7a31...HEAD | sort > /tmp/changed.txt
          fi
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/validate-naver-blob-only-collection-stage-v1.yml
          .github/workflows/validate-momentum-post319-execution-currentness-v1.yml
          .github/workflows/validate-momentum-productionization-current-main-v1.yml
          lib/server/ingestion/naverNewsBlobOnlyCollectionStage.ts
          tests/naver-news-blob-only-collection-stage-v1.test.mts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Neon-independent Blob collection stage regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/naver-news-blob-only-collection-stage-v1.test.mts

      - name: Existing Stored Evidence mirror regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/naver-news-stored-evidence-mirror-v1.test.mts

      - name: Existing canonical job evidence regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/naver-news-canonical-job-evidence-v130.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
