name: PR127 v158 access audit validation

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - 'data/momentum-research/iu_provenance_gated_refresh_v158_20260921T003602Z.json'
      - 'tests/fandex-momentum-provenance-gated-refresh-v158.test.mts'
      - '.github/workflows/pr127-v158-access-audit-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate v158 access audit and upstream gates
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-provenance-gated-refresh-v158.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-source-provenance-v153.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-partial-persistence-recovery-v157.test.mts
          npm run typecheck
          git diff --check
