name: Validate Artist Expansion Product source superset v1

on:
  push:
    branches:
      - validation/artist-expansion-current-main-v20

permissions:
  contents: read

jobs:
  validate-product-source-superset:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install beautifulsoup4 requests
      - name: Superset workflow syntax
        run: |
          python -m py_compile \
            scripts/fandex-cloud-migration/source/lastfm_global_interest_rolling_score_preview_v1.py \
            scripts/fandex-cloud-migration/source/fandex_master_score_v10.py \
            scripts/fandex-cloud-migration/source/fandex_python_health_check_v3.py \
            scripts/fandex-cloud-migration/source/fandex_daily_summary_v3.py
      - name: Materialized candidate regression
        run: python tests/artist-expansion-materialized-candidate-pipeline-v1.py
      - name: Short English alias boundary regression
        run: python tests/artist-expansion-music-short-english-alias-boundary-v1.py
      - name: Source promotion transition regression
        run: python tests/artist-expansion-source-promotion-transition-v1.py
      - name: Product source superset regression
        run: python tests/artist-expansion-product-source-superset-v1.py
