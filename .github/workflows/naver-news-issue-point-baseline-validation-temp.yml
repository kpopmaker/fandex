name: TEMP NAVER newsIssuePoint Baseline Validation

on:
  push:
    branches:
      - methodology/naver-news-issue-point-baseline-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused baseline contract test
        run: npx tsx --test tests/naver-news-issue-point-construct.test.mts

      - name: Typecheck
        run: npm run typecheck
