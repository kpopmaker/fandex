name: Validate snsFandom completed-window receipt intake v1

on:
  push:
    branches:
      - 'work/sns-fandom-completed-window-receipt-intake-v1'
    paths:
      - 'lib/intelligence/snsFandomPointYoutubeCompletedWindowReceiptIntake.ts'
      - 'tests/sns-fandom-youtube-completed-window-receipt-intake-v1.test.mts'
      - '.github/workflows/validate-sns-fandom-completed-window-receipt-intake-v1.yml'
  pull_request:
    paths:
      - 'lib/intelligence/snsFandomPointYoutubeCompletedWindowReceiptIntake.ts'
      - 'tests/sns-fandom-youtube-completed-window-receipt-intake-v1.test.mts'
      - '.github/workflows/validate-sns-fandom-completed-window-receipt-intake-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Completed-window receipt intake regressions
        run: >-
          npx tsx --test
          tests/sns-fandom-youtube-completed-window-receipt-intake-v1.test.mts
          tests/sns-fandom-youtube-quota-window-completion-gate-v1.test.mts
          tests/sns-fandom-youtube-quota-closeout-v1.test.mts
          tests/sns-fandom-youtube-quota-estimate-materialization-v1.test.mts
          tests/sns-fandom-youtube-current-submission-readiness-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
