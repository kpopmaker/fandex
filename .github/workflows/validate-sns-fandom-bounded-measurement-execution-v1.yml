name: Validate snsFandom bounded measurement execution v1

on:
  push:
    branches:
      - 'work/sns-fandom-phase-c-bounded-measurement-execution-v1'
    paths:
      - 'lib/intelligence/snsFandomPointYoutubeBoundedMeasurement.ts'
      - 'scripts/operations/snsFandomYoutubeBoundedMeasurementV1.mts'
      - 'scripts/operations/snsFandomYoutubeBoundedMeasurementExecutionGateV1.mts'
      - 'tests/sns-fandom-point-youtube-bounded-measurement-v1.test.mts'
      - '.github/workflows/execute-sns-fandom-youtube-bounded-measurement-v1.yml'
      - '.github/workflows/validate-sns-fandom-bounded-measurement-execution-v1.yml'
      - 'docs/research/sns-fandom-youtube-api-audit-packet-v1.md'
  pull_request:
    paths:
      - 'lib/intelligence/snsFandomPointYoutubeBoundedMeasurement.ts'
      - 'scripts/operations/snsFandomYoutubeBoundedMeasurementV1.mts'
      - 'scripts/operations/snsFandomYoutubeBoundedMeasurementExecutionGateV1.mts'
      - 'tests/sns-fandom-point-youtube-bounded-measurement-v1.test.mts'
      - '.github/workflows/execute-sns-fandom-youtube-bounded-measurement-v1.yml'
      - '.github/workflows/validate-sns-fandom-bounded-measurement-execution-v1.yml'
      - 'docs/research/sns-fandom-youtube-api-audit-packet-v1.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bounded measurement regression
        run: >-
          npx tsx --test
          tests/sns-fandom-point-youtube-bounded-measurement-v1.test.mts
          tests/sns-fandom-point-youtube-quota-measurement-handoff-v1.test.mts
          tests/sns-fandom-point-youtube-quota-worksheet-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
