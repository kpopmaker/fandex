name: Validate Artist Expansion Last.fm V LISA MBID resolution v1

on:
  push:
    branches:
      - evidence/artist-expansion-lastfm-v-lisa-mbid-resolution-v1

permissions:
  contents: read

jobs:
  validate-lastfm-mbid-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate durable MBID resolution evidence
        run: python tests/artist-expansion-lastfm-v-lisa-mbid-resolution-v1.py
