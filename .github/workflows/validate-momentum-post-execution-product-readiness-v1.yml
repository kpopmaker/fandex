name: Validate Momentum post-execution Product readiness v1

on:
  push:
    branches:
      - work/momentum-post-execution-product-readiness-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        run: |
          git diff --name-only 9616fe5fe562ac40071fc0112353e60d74d7d594...HEAD | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/validate-momentum-post-execution-product-readiness-v1.yml
          lib/product/readiness/momentumPostExecutionProductReadiness.ts
          tests/momentum-post-execution-product-readiness-v1.test.mts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Momentum post-execution Product readiness
        run: npx tsx --test tests/momentum-post-execution-product-readiness-v1.test.mts

      - name: Consumed execution regression
        run: npx tsx --test tests/momentum-native-verifier-production-execution-authorization-v1.test.mts

      - name: Activity Exposure Production regression
        run: npx tsx --test tests/activity-exposure-public-route-cutover-execution-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
