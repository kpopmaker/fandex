name: PR162 Shadow Series Verifier Check

on:
  push:
    branches:
      - chore/naver-shadow-series-verifier

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run shadow series verifier tests
        run: npm run test:ingestion:shadow-series-verifier

      - name: Typecheck
        run: npm run typecheck
