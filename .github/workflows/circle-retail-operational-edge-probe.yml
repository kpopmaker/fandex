name: Circle Retail Operational Edge Probe

on:
  push:
    branches:
      - integration/album-circle-retail-discovery

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Circle operational, discovery, adapter and provider tests
        run: npx tsx --test tests/circle-retail-operational-semantics-v1.test.mts tests/circle-retail-discovery-v1.test.mts tests/circle-retail-adapter-v1.test.mts tests/album-provider-specific-integration-depth-v1.test.mts
      - name: Typecheck
        run: npm run typecheck
