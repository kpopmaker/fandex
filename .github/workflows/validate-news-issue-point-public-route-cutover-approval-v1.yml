name: validate-news-issue-point-public-route-cutover-approval-v1

on:
  push:
    branches:
      - validation/news-issue-point-public-route-cutover-approval-79b92a

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact feature parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "79b92ac198a4e0565057ad5e21f286c846110980"

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Production dependency security
        run: npm run security:audit:production

      - name: Public-route cutover approval record
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-public-route-cutover-approval-v1.test.mts

      - name: Public-route cutover authorization regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-public-route-cutover-authorization-v1.test.mts

      - name: Public-route cutover candidate regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-public-route-cutover-candidate-v1.test.mts

      - name: Activation approval regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-activation-approval-v1.test.mts

      - name: Activation authorization regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-activation-authorization-v1.test.mts

      - name: Activation readiness regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-activation-readiness-v1.test.mts

      - name: Promotion / Product boundary regressions
        run: >-
          npx tsx --conditions=react-server --test
          tests/product-news-issue-point-product-operations-approval-v1.test.mts
          tests/product-news-issue-point-promotion-authorization-v1.test.mts
          tests/product-news-issue-point-real-read-boundary-v1.test.mts
          tests/product-news-issue-point-real-promotion-gate-v1.test.mts
          tests/product-news-issue-point-real-selector-v1.test.mts
          tests/product-news-issue-point-real-candidate-v1.test.mts
          tests/intelligence-variable-confidence-v1.test.mts
          tests/product-variable-boundary-v1.test.mts
          tests/product-evidence-boundary-v1.test.mts

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Exact approval diff sanity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check f1c32a298fb7d7155f1cb8358a7afdb22db8c7e0...79b92ac198a4e0565057ad5e21f286c846110980
          git diff --name-only f1c32a298fb7d7155f1cb8358a7afdb22db8c7e0...79b92ac198a4e0565057ad5e21f286c846110980 > /tmp/files
          test "$(wc -l < /tmp/files | tr -d ' ')" = "2"
          grep -Fx "lib/product/activation/newsIssuePointPublicRouteCutoverApproval.ts" /tmp/files
          grep -Fx "tests/product-news-issue-point-public-route-cutover-approval-v1.test.mts" /tmp/files
