name: Validate Momentum carrier attestation lineage v2

on:
  push:
    branches:
      - work/momentum-carrier-attestation-lineage-v2
  pull_request:
    branches:
      - work/momentum-preview-independent-attestation-current-main-v1
      - main

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.head_ref == 'work/momentum-carrier-attestation-lineage-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" | sort > /tmp/changed.txt
          else
            git fetch origin work/momentum-preview-independent-attestation-current-main-v1
            STACK_BASE="$(git rev-parse origin/work/momentum-preview-independent-attestation-current-main-v1)"
            git diff --name-only "$STACK_BASE...HEAD" | sort > /tmp/changed.txt
          fi
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/validate-momentum-carrier-attestation-lineage-v2.yml
          lib/product/adapters/momentumEvidenceConsensusProductReadModel.ts
          lib/product/contracts/productMomentumEvidenceConsensus.ts
          lib/product/readiness/momentumPublicRouteDesignCandidate.ts
          lib/server/ingestion/momentumEvidenceConsensusRepository.ts
          tests/momentum-carrier-attestation-lineage-v2.test.mts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Carrier attestation lineage v2 regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-carrier-attestation-lineage-v2.test.mts

      - name: Existing carrier runtime regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-evidence-consensus-runtime-read-v1.test.mts

      - name: Existing Momentum Product contract regression
        run: npx tsx --test tests/momentum-evidence-consensus-product-contract-v1.test.mts

      - name: Existing live-shadow readiness regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-live-shadow-product-readiness-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
