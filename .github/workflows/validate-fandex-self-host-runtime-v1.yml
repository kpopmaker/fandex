name: Validate FANDEX self-host runtime v1

on:
  push:
    branches:
      - work/product-self-host-runtime-v1
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "next.config.ts"
      - "app/api/health/route.ts"
      - ".github/workflows/validate-fandex-self-host-runtime-v1.yml"
      - "app/artists/[artistId]/fandex-beta/**"
      - "lib/server/product/**"
      - "data/fandex-cloud-v10/**"
      - "data/momentum-product/**"
  pull_request:
    paths:
      - ".dockerignore"
      - "Dockerfile"
      - "next.config.ts"
      - "app/api/health/route.ts"
      - ".github/workflows/validate-fandex-self-host-runtime-v1.yml"
      - "app/artists/[artistId]/fandex-beta/**"
      - "lib/server/product/**"
      - "data/fandex-cloud-v10/**"
      - "data/momentum-product/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Build portable FANDEX image
        run: docker build --progress=plain -t fandex-self-host-v1 .

      - name: Start portable FANDEX runtime
        run: |
          docker run --rm -d \
            --name fandex-self-host-v1 \
            -p 3000:3000 \
            fandex-self-host-v1
          echo "fandex-self-host-v1" > /tmp/fandex-container-name

      - name: Verify host-neutral health endpoint
        run: |
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error http://127.0.0.1:3000/api/health > /tmp/fandex-health.json; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker logs fandex-self-host-v1
              exit 1
            fi
            sleep 1
          done

          node - <<'NODE'
          const fs = require('node:fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/fandex-health.json', 'utf8'));
          if (payload.ok !== true || payload.service !== 'fandex' || payload.runtime !== 'nodejs') {
            throw new Error('host-neutral-health-contract-failed');
          }
          NODE

      - name: Verify Beta route without Vercel runtime
        run: |
          if ! curl --fail --silent --show-error \
            http://127.0.0.1:3000/artists/iu/fandex-beta \
            > /tmp/fandex-beta.html; then
            docker logs fandex-self-host-v1
            exit 1
          fi

          node - <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync('/tmp/fandex-beta.html', 'utf8');

          function card(variableId, nextVariableId) {
            const start = html.indexOf(variableId);
            if (start < 0) throw new Error(`missing-card:${variableId}`);
            const end = nextVariableId ? html.indexOf(nextVariableId, start + variableId.length) : html.length;
            if (end < 0) throw new Error(`missing-next-card:${nextVariableId}`);
            return html.slice(start, end);
          }

          const music = card('musicAlbumPoint', 'newsIssuePoint');
          if (music.includes('repository-state-read-failed')) {
            throw new Error('music-repository-evidence-not-traced');
          }

          const momentum = card('growthMomentumPoint', 'riskAdjustmentPoint');
          if (
            momentum.includes('upstream-read-not-ok')
            || momentum.includes('runtime-read-failed')
          ) {
            throw new Error('momentum-repository-evidence-not-traced');
          }

          if (!html.includes('산정 보류')) {
            throw new Error('fandex-score-withhold-boundary-missing');
          }
          NODE

      - name: Stop portable FANDEX runtime
        if: always()
        run: docker rm -f fandex-self-host-v1 >/dev/null 2>&1 || true

      - name: Verify host-neutral Brand Fit durable Product runtime
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          PROBE_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_SCHEDULER_SECRET }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test -n "$PROBE_SECRET"

          docker run --rm -d \
            --name fandex-self-host-brand-fit-v1 \
            -p 3000:3000 \
            -e FANDEX_PRODUCT_RUNTIME_ENV=production \
            -e FANDEX_BRAND_FIT_EVIDENCE_BLOB_STORE_ID=store_oe4nEFW5ox93XB8v \
            -e VERCEL_TOKEN="$VERCEL_TOKEN" \
            -e FANDEX_NAVER_NEWS_SCHEDULER_SECRET="$PROBE_SECRET" \
            fandex-self-host-v1

          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error \
              http://127.0.0.1:3000/api/health \
              > /tmp/fandex-brand-fit-health.json; then
              break
            fi
            if [ "$attempt" -eq 45 ]; then
              docker logs fandex-self-host-brand-fit-v1
              exit 1
            fi
            sleep 1
          done

          status=""
          for attempt in $(seq 1 10); do
            set +e
            status="$(
              curl \
                --silent \
                --show-error \
                --request POST \
                --retry 0 \
                --output /tmp/fandex-brand-fit-readiness.json \
                --write-out '%{http_code}' \
                --header "Authorization: Bearer ${PROBE_SECRET}" \
                --header 'X-Fandex-Product-Runtime-Probe-Id: ops-fandex-product-runtime-readiness-20261004-v1' \
                --header 'X-Fandex-Probe-Source: github-actions-manual-v1' \
                http://127.0.0.1:3000/api/internal/fandex/product-runtime-readiness
            )"
            curl_exit="$?"
            set -e

            if [ "$curl_exit" -eq 0 ] && { [ "$status" = "200" ] || [ "$status" = "503" ]; }; then
              break
            fi

            if [ "$attempt" -eq 10 ]; then
              echo "brand-fit-readiness-http-status=$status"
              echo "brand-fit-readiness-curl-exit=$curl_exit"
              docker logs fandex-self-host-brand-fit-v1
              exit 1
            fi

            sleep 2
          done

          node <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(
            fs.readFileSync(
              '/tmp/fandex-brand-fit-readiness.json',
              'utf8',
            ),
          );
          const states = Array.isArray(value?.variableStates)
            ? value.variableStates
            : [];
          const brandFit = states.find(
            (entry) => entry?.variableId === 'brandFitPoint',
          );

          if (
            brandFit?.sourceState !== 'resolved'
            || brandFit?.adapterState !== 'ok'
            || brandFit?.reason !== null
            || !Array.isArray(value?.resolvedVariableIds)
            || !value.resolvedVariableIds.includes('brandFitPoint')
            || value?.scoreCalculated !== false
            || value?.methodologyFinalized !== false
            || value?.publicRouteActivated !== false
            || value?.providerExecutionPerformed !== false
            || value?.writeOperationsAuthorized !== false
          ) {
            console.error(JSON.stringify({
              status: value?.status ?? null,
              brandFitSourceState: brandFit?.sourceState ?? null,
              brandFitAdapterState: brandFit?.adapterState ?? null,
              brandFitReason: brandFit?.reason ?? null,
              scoreCalculated: value?.scoreCalculated ?? null,
              methodologyFinalized: value?.methodologyFinalized ?? null,
              publicRouteActivated: value?.publicRouteActivated ?? null,
              providerExecutionPerformed:
                value?.providerExecutionPerformed ?? null,
              writeOperationsAuthorized:
                value?.writeOperationsAuthorized ?? null,
            }));
            process.exit(1);
          }

          console.log(JSON.stringify({
            brandFitHostNeutralRuntime: 'ok',
            sourceState: brandFit.sourceState,
            adapterState: brandFit.adapterState,
            reason: brandFit.reason,
            providerCalls: 0,
            blobWrites: 0,
            databaseWrites: 0,
            productActivations: 0,
            publications: 0,
          }));
          NODE

      - name: Stop host-neutral Brand Fit runtime
        if: always()
        run: >-
          docker rm -f fandex-self-host-brand-fit-v1
          >/dev/null 2>&1 || true
