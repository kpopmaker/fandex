name: site check (probe)
on:
  push:
    branches: ['sitecheck-probe']
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe live site
        run: |
          base=https://fandex-product-self-host-v1.onrender.com
          for p in /api/health / /ranking /artists /artists/aespa "/compare?ids=aespa,ive,riize"; do
            out=$(curl -s -o body.html -w "%{http_code} total=%{time_total}s %{size_download}B" --max-time 90 "$base$p" || echo "curl-exit-$?")
            asof=$(grep -o '[0-9]*\. [0-9]*\. [0-9:]* 기준' body.html | head -1)
            echo "::notice title=$p::$out [$asof]"
          done
