name: site check (probe)
on:
  push:
    branches: ['sitecheck-probe']
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe live site
        run: |
          base=https://fandex-product-self-host-v1.onrender.com
          for p in / /ranking /artists/aespa /artists/bts "/compare?ids=aespa,ive"; do
            out=$(curl -s -o body.html -w "%{http_code} total=%{time_total}s %{size_download}B" --max-time 90 "$base$p" || echo "curl-exit-$?")
            more=$(grep -o '더보기' body.html | wc -l); hist=$(grep -c '음원 차트 기록' body.html || true); news=$(grep -o '7일 기사 [0-9]*건' body.html | head -1)
            echo "::notice title=$p::$out more=$more history=$hist [$news]"
          done
