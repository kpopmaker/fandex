name: site check (probe)
on:
  push:
    branches: ['sitecheck-probe']
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Probe Melon week/day pages
        run: |
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36'
          try() {
            name=$1; url=$2
            code=$(curl -s -A "$UA" -o m.html -w "%{http_code}" --max-time 40 -H 'Referer: https://www.melon.com/' "$url" || echo x)
            rows=$(grep -c 'class="ellipsis rank01"' m.html || true)
            dates=$(grep -o '[12][0-9]\{3\}\.[01][0-9]\.[0-3][0-9]' m.html | sort -u | head -4 | tr '\n' ' ')
            first=$(grep -o 'title="[^"]* 재생"' m.html | head -1)
            echo "::notice title=$name::code=$code rows=$rows dates=[$dates] $first"
          }
          try w2024 "https://www.melon.com/chart/week/index.htm?classCd=DM0000&startDay=20241028&endDay=20241103&moved=Y"
          try w2020 "https://www.melon.com/chart/week/index.htm?classCd=DM0000&startDay=20200106&endDay=20200112&moved=Y"
          try w2015 "https://www.melon.com/chart/week/index.htm?classCd=DM0000&startDay=20150105&endDay=20150111&moved=Y"
          try w2010 "https://www.melon.com/chart/week/index.htm?classCd=DM0000&startDay=20100104&endDay=20100110&moved=Y"
          try w2005 "https://www.melon.com/chart/week/index.htm?classCd=DM0000&startDay=20050103&endDay=20050109&moved=Y"
          try d20241101 "https://www.melon.com/chart/day/index.htm?classCd=DM0000&day=20241101"
          try d20200101 "https://www.melon.com/chart/day/index.htm?classCd=DM0000&day=20200101"
          try d20261101 "https://www.melon.com/chart/day/index.htm?classCd=DM0000&day=20261101"
          try m201503 "https://www.melon.com/chart/month/index.htm?classCd=DM0000&moved=Y&rankMonth=201503"
