name: site check (probe)
on:
  push:
    branches: ['sitecheck-probe']
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test ranking dropdowns in a browser
        run: |
          npm i --no-save playwright@1.56.1 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
          cat > t.mjs <<'JS'
          import { chromium } from 'playwright';
          const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 1440, height: 900 } });
          const reqs = [];
          p.on('request', (r) => { if (r.headers()['rsc'] || r.url().includes('_rsc')) reqs.push(r.method() + ' ' + r.url().replace('https://fandex-product-self-host-v1.onrender.com','')); });
          await p.goto('https://fandex-product-self-host-v1.onrender.com/ranking', { waitUntil: 'networkidle' });
          await p.waitForTimeout(1500);
          const h = await p.evaluate(() => document.body.scrollHeight);
          await p.evaluate(() => window.scrollTo(0, 500));
          await p.waitForTimeout(300);
          const out = ['height=' + h + ' scroll0=' + await p.evaluate(() => window.scrollY) + ' rscBefore=' + reqs.length];
          reqs.length = 0;
          const sel = p.locator('select');
          for (const [i, v] of [[0,'rise'],[1,'1W'],[4,'asc'],[0,'brandFit']]) {
            await sel.nth(i).selectOption(v);
            await p.waitForTimeout(1500);
            out.push(`set ${i}=${v} scrollY=${await p.evaluate(() => window.scrollY)} rsc=${reqs.length} ${reqs.slice(0,2).join(' | ')}`);
            reqs.length = 0;
          }
          for (const line of out) console.log('::notice::' + line);
          await b.close();
          JS
          node t.mjs
