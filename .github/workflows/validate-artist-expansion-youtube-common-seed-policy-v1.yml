name: Validate Artist Expansion YouTube common seed policy v1

on:
  push:
    branches:
      - work/artist-expansion-youtube-common-seed-policy-v1

permissions:
  contents: read

jobs:
  validate-common-seed-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate common reviewed seed policy
        run: python tests/artist-expansion-youtube-common-seed-policy-v1.py
