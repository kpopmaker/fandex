name: PR127 FANDEX momentum v152 current-real materialization

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Evaluate latest real IU through v152 dual-artifact coordinator
        run: |
          git fetch origin main
          git show origin/main:data/lastfm-cloud/lastfm_artist_interest_history_v1.csv > /tmp/current-main-lastfm-history.csv

          cat > .tmp-v152-current-real.mts <<'TS'
          import { readFile } from 'node:fs/promises';
          import {
            deriveFandexNaverMediaAttentionMomentumResearch,
          } from './lib/intelligence/fandexNaverMediaAttentionMomentumResearch';
          import {
            evaluateFandexMomentumTemporalNormalizationResearch,
          } from './lib/intelligence/fandexMomentumTemporalNormalizationResearch';
          import {
            evaluateFandexMomentumCrossFamilyCombinationResearch,
          } from './lib/intelligence/fandexMomentumCrossFamilyCombinationResearch';
          import {
            evaluateFandexMomentumOutputFormEligibilityResearch,
          } from './lib/intelligence/fandexMomentumOutputFormEligibilityResearch';
          import {
            coordinateFandexMomentumDualArtifactEvaluationResearch,
          } from './lib/intelligence/fandexMomentumDualArtifactCoordinatorResearch';
          import {
            NAVER_NEWS_ISSUE_POINT_FROZEN_METHODOLOGY_CONTRACT_VERSION,
          } from './lib/server/ingestion/naverNewsIssuePointFrozenMethodology';
          import {
            NAVER_NEWS_ISSUE_POINT_METHODOLOGY_VERSION,
          } from './lib/intelligence/naverNewsIssuePointConstruct';

          const anchors = [
            ['2026-09-17T15:00:00.000Z', 0.0075, 58.974358974359, 39],
            ['2026-09-17T23:00:00.000Z', 0.00125, 23.404255319149, 47],
            ['2026-09-18T07:00:00.000Z', 0.0325, 100, 55],
            ['2026-09-18T15:00:00.000Z', 0.00375, 42.857142857143, 63],
            ['2026-09-18T23:00:00.000Z', 0.00125, 16.901408450704, 71],
            ['2026-09-19T07:00:00.000Z', 0.0025, 43.037974683544, 79],
            ['2026-09-19T15:00:00.000Z', 0, 0, 87],
            ['2026-09-19T23:00:00.000Z', 0, 0, 95],
            ['2026-09-20T07:00:00.000Z', 0.00625, 70.873786407767, 103],
            ['2026-09-20T15:00:00.000Z', 0.0025, 45.945945945946, 111],
          ] as const;

          const points = anchors.map(([throughSlotStart, activityRate, score, priorDefinedWindowCount]) => ({
            contractVersion: NAVER_NEWS_ISSUE_POINT_FROZEN_METHODOLOGY_CONTRACT_VERSION,
            methodologyVersion: NAVER_NEWS_ISSUE_POINT_METHODOLOGY_VERSION,
            lifecycle: 'research',
            directProductContributionEligible: false,
            productScorePublished: false,
            variableId: 'newsIssuePoint',
            canonicalArtistId: 'iu',
            protocolStart: '2026-09-15T16:00:00.000Z',
            throughSlotStart,
            selectedWindowSlotCount: 8,
            rollingWindowSemantics: 'overlapping',
            baselineScope: 'same_artist_same_official_shadow_epoch',
            baselineReadiness: {
              cycleSlotCount: 24,
              utcHourCoverageCount: 24,
              completeCycleCount: 2,
              sameUtcHourReplicationFloor: 2,
              sameUtcHourReplicationCeiling: 2,
              status: 'replicated_cycle_history',
            },
            normalizationType: 'HISTORICAL_STRICT_EXCEEDANCE_SHARE',
            status: 'available',
            reason: 'frozen_methodology_value_available',
            score,
            currentActivityRate: activityRate,
            priorDefinedWindowCount,
            priorLessThanLatestCount: 0,
            priorEqualToLatestCount: 0,
            priorGreaterThanLatestCount: 0,
            currentWindow: null,
            eligiblePriorWindows: [],
            excludedWindows: [],
            evidenceTrace: { windows: [], storedEvidenceJobIds: [] },
          })) as any;

          const [lastfmHistory, historyJsonl, watermarkJsonl] = await Promise.all([
            readFile('/tmp/current-main-lastfm-history.csv', 'utf8'),
            readFile('./data/momentum-research/iu_cross_family_evidence_state_v147.jsonl', 'utf8'),
            readFile('./data/momentum-research/iu_evaluation_watermark_v151.jsonl', 'utf8'),
          ]);

          const v140 = deriveFandexNaverMediaAttentionMomentumResearch(points);
          const v141 = evaluateFandexMomentumTemporalNormalizationResearch({
            canonicalArtistId: 'iu',
            lastfmHistoryCsv: lastfmHistory,
            naverComponent: v140,
          });
          const v142 = evaluateFandexMomentumCrossFamilyCombinationResearch(v141);
          const v143 = evaluateFandexMomentumOutputFormEligibilityResearch(v142);

          const v152 = coordinateFandexMomentumDualArtifactEvaluationResearch({
            historyJsonl,
            watermarkJsonl,
            result: v143,
            sourceEvidence: {
              lastfmEvidenceId: '723cf73abb93882779edc0621a12381ab80e464c',
              lastfmLatestComponentEndAt: '2026-09-20T01:59:13.000Z',
              naverEvidenceId: '39ec4ddeeda1eedd906bc33288e1550a6c8fd3aeb1f46be590e661fcb6c41a9c',
              naverThroughSlotStart: '2026-09-20T15:00:00.000Z',
            },
            evaluatedAt: '2026-09-20T15:10:00.000Z',
            recordedAt: '2026-09-20T15:10:00.000Z',
          });

          console.log(JSON.stringify({
            v140: {
              latestAnchor: v140.anchors.at(-1),
              selectedAnchorCount: v140.anchors.length,
              latestDirection: v140.latestDirection,
              latestDirectionalRunTransitionCount: v140.latestDirectionalRunTransitionCount,
              persistenceObserved: v140.persistenceObserved,
              digest: v140.digest,
            },
            v141: {
              state: v141.state,
              alignmentCutoffAt: v141.alignmentCutoffAt,
              components: v141.components.map((x) => ({
                family: x.family,
                selectedKey: x.selectedKey,
                selectedComponentEndAt: x.selectedComponentEndAt,
                nativeValue: x.nativeValue,
                previousNativeValue: x.previousNativeValue,
                nativeDelta: x.nativeDelta,
                direction: x.direction,
                directionalRunTransitionCount: x.latestDirectionalRunTransitionCount,
                historicalStrictExceedanceShare: x.historicalStrictExceedanceShare,
              })),
              digest: v141.digest,
            },
            v142: {
              state: v142.state,
              directionalConsensus: v142.directionalConsensus,
              persistenceConsensus: v142.persistenceConsensus,
              digest: v142.digest,
            },
            v143: {
              state: v143.state,
              alignmentCutoffAt: v143.alignmentCutoffAt,
              directionalConsensus: v143.currentResearchOutput.directionalConsensus,
              persistenceConsensus: v143.currentResearchOutput.persistenceConsensus,
              digest: v143.digest,
            },
            v152: {
              state: v152.state,
              gateState: v152.gate.state,
              historyDisposition: v152.historyDisposition,
              watermarkDisposition: v152.watermarkDisposition,
              priorHistoryRecordCount: v152.priorHistoryRecordCount,
              resultingHistoryRecordCount: v152.resultingHistoryRecordCount,
              priorWatermarkRecordCount: v152.priorWatermarkRecordCount,
              resultingWatermarkRecordCount: v152.resultingWatermarkRecordCount,
              priorHistoryDigest: v152.priorHistoryDigest,
              resultingHistoryDigest: v152.resultingHistoryDigest,
              priorWatermarkDigest: v152.priorWatermarkDigest,
              resultingWatermarkDigest: v152.resultingWatermarkDigest,
              effects: v152.effects,
              digest: v152.digest,
            },
          }, null, 2));

          if (
            v152.effects.productMetricReads !== 0
            || v152.effects.productMetricWrites !== 0
            || v152.effects.previewFallbackReads !== 0
            || v152.effects.databaseWrites !== 0
          ) {
            throw new Error('v152 isolation violated');
          }

          console.log('V152_HISTORY_BEGIN');
          process.stdout.write(v152.historyJsonl);
          console.log('V152_HISTORY_END');
          console.log('V152_WATERMARK_BEGIN');
          process.stdout.write(v152.watermarkJsonl);
          console.log('V152_WATERMARK_END');
          TS

          npx tsx --conditions=react-server .tmp-v152-current-real.mts
          rm .tmp-v152-current-real.mts
      - name: Run v152 regression
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-dual-artifact-coordinator-v152.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-evaluation-watermark-v151.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-common-cutoff-advancement-v150.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-append-from-artifact-v148.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-unified-history-v147.test.mts
          npm run typecheck
          git diff --check
