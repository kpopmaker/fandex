name: Validate Artist Expansion YouTube lineage guard v2

on:
  push:
    branches:
      - validation/artist-expansion-youtube-lineage-guard-v2

permissions:
  contents: read

jobs:
  youtube-lineage-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: YouTube lineage syntax
        run: |
          python -m py_compile \
            scripts/fandex-cloud-migration/source/fandex_master_score_v10.py \
            scripts/fandex-cloud-migration/source/youtube_v3_legacy_reproducibility_audit_v1.py \
            scripts/fandex-cloud-migration/source/youtube_recover_historical_seed_v1.py
      - name: YouTube lineage expansion guard
        run: python tests/artist-expansion-youtube-lineage-guard-v1.py
