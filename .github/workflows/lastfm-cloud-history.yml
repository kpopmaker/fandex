name: FANDEX Last.fm Cloud History

on:
  schedule:
    # 00:00 UTC = 09:00 KST
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fandex-lastfm-cloud-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Collect Last.fm daily history
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python scripts/lastfm-cloud/lastfm_cloud_history_v1.py

      - name: Commit updated history
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lastfm-cloud

          if git diff --cached --quiet; then
            echo "No Last.fm history changes to commit."
            exit 0
          fi

          git commit -m "chore(lastfm): append daily cloud history"

          for attempt in 1 2 3; do
            echo "Push attempt ${attempt}/3"
            git pull --rebase origin main

            if git push origin HEAD:main; then
              echo "Last.fm cloud history push: OK"
              exit 0
            fi

            sleep 3
          done

          echo "Last.fm cloud history push failed after 3 attempts."
          exit 1
