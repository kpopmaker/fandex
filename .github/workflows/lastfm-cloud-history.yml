name: FANDEX Last.fm Cloud History

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fandex-lastfm-cloud-history
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Collect Last.fm daily history
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
        run: python scripts/lastfm-cloud/lastfm_cloud_history_v1.py

      - name: Commit updated history
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/lastfm-cloud
          if git diff --cached --quiet; then
            echo "No Last.fm history changes to commit."
            exit 0
          fi
          git commit -m "chore(lastfm): append daily cloud history"
          git push
