name: Circle Retail Hour Year Probe

on:
  push:
    branches:
      - integration/album-circle-retail-discovery

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe direct Circle Hourly rows
        shell: bash
        run: |
          node <<'NODE'
          const base = 'https://circlechart.kr';
          const post = async (path, params) => {
            const response = await fetch(`${base}${path}`, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                'X-Requested-With': 'XMLHttpRequest',
              },
              body: new URLSearchParams(params).toString(),
              redirect: 'manual',
            });
            const text = await response.text();
            let json = null;
            try { json = JSON.parse(text); } catch {}
            return { response, text, json };
          };

          const helper = await post('/data/api/chart_func/retail/hour_time', { termGbn: 'hour' });
          if (!helper.json || helper.json.ResultStatus !== 'OK') {
            console.log(JSON.stringify({ label: 'hour-helper-failed', status: helper.response.status, json: helper.json }));
            process.exit(0);
          }

          const hourRange = Array.isArray(helper.json.Hour_Range) ? helper.json.Hour_Range.join(',') : '';
          const thisHour = String(helper.json.Hour_End ?? helper.json.Hour_Now ?? '');
          const params = {
            yyyymmdd: String(helper.json.YYYYMMDD ?? ''),
            HourRange: hourRange,
            ListType: String(helper.json.ListType ?? ''),
            thisHour,
          };
          const result = await post('/data/api/chart/retail_hour', params);
          const json = result.json;
          const list = json && typeof json === 'object' && json.List && typeof json.List === 'object'
            ? Object.values(json.List)
            : [];
          const first = list[0] && typeof list[0] === 'object' ? list[0] : null;
          console.log(JSON.stringify({
            label: 'hour-direct',
            helper: {
              YYYYMMDD: helper.json.YYYYMMDD,
              Hour_End: helper.json.Hour_End,
              Hour_Now: helper.json.Hour_Now,
              ListType: helper.json.ListType,
              HourRangeCount: Array.isArray(helper.json.Hour_Range) ? helper.json.Hour_Range.length : null,
            },
            request: params,
            status: result.response.status,
            contentType: result.response.headers.get('content-type'),
            rootKeys: json && typeof json === 'object' ? Object.keys(json) : [],
            resultStatus: json && typeof json === 'object' ? json.ResultStatus ?? null : null,
            listType: json && typeof json === 'object' && json.List !== undefined ? (Array.isArray(json.List) ? 'array' : typeof json.List) : 'missing',
            rowCount: list.length,
            sampleKeys: first ? Object.keys(first) : [],
            sample: first ? {
              Album: first.Album ?? null,
              Artist: first.Artist ?? null,
              Barcode: first.Barcode ?? null,
              rowSum: first.rowSum ?? null,
              KSum: first.KSum ?? null,
              ESum: first.ESum ?? null,
              RankInt: first.RankInt ?? null,
              YYYYMMDD: first.YYYYMMDD ?? null,
              Hour: first.Hour ?? first.thisHour ?? null,
            } : null,
            rawPrefix: json ? null : result.text.slice(0, 300).replace(/\s+/g, ' '),
          }));
          NODE
