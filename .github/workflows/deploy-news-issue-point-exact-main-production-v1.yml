name: Deploy exact main for IU newsIssuePoint cutover

on:
  push:
    branches:
      - validation/news-issue-point-exact-main-production-deploy-v1

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VERCEL_TOKEN_PRIMARY: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_TOKEN_ALT: ${{ secrets.VERCEL_ACCESS_TOKEN }}
      VERCEL_TOKEN_API: ${{ secrets.VERCEL_API_TOKEN }}
      EXPECTED_MAIN_SHA: d7ad96f9a207e35141104882972a97829400862c
      VERCEL_ORG_ID: team_OrRPxuBxMwCYU3kk0r76AfOs
      VERCEL_PROJECT_ID: prj_aT3p8zmjyochu8iGmFOuNR1lSU7v

    steps:
      - name: Vercel credential preflight
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_ALT:-${VERCEL_TOKEN_API:-}}}"
          if [ -z "$TOKEN" ]; then
            echo "VERCEL_DEPLOY_CREDENTIAL=BLOCKED"
            exit 1
          fi
          echo "VERCEL_DEPLOY_CREDENTIAL=AVAILABLE"

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: d7ad96f9a207e35141104882972a97829400862c
          fetch-depth: 1

      - name: Verify exact main identity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          echo "EXPECTED_MAIN_SHA=$EXPECTED_MAIN_SHA"
          echo "ACTUAL_MAIN_SHA=$ACTUAL"
          test "$ACTUAL" = "$EXPECTED_MAIN_SHA"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Guarded Product regressions
        run: |
          npx tsx --test tests/product-artist-variable-route-integration-v1.test.mts
          npx tsx --test tests/product-news-issue-point-public-route-cutover-execution-v1.test.mts
          npm run typecheck
          npm run lint

      - name: Link exact Vercel project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json

      - name: Pull Production environment
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_ALT:-${VERCEL_TOKEN_API:-}}}"
          npx vercel@59.20.0 pull --yes --environment=production --token="$TOKEN"

      - name: Build exact main with Production environment
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_ALT:-${VERCEL_TOKEN_API:-}}}"
          npx vercel@59.20.0 build --prod --token="$TOKEN"

      - name: Deploy prebuilt exact main to Production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          TOKEN="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_ALT:-${VERCEL_TOKEN_API:-}}}"
          URL="$(npx vercel@59.20.0 deploy --prebuilt --prod --yes --token="$TOKEN")"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "PRODUCTION_DEPLOYMENT_URL=$URL"

      - name: Verify deployed artifact
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          TOKEN="${VERCEL_TOKEN_PRIMARY:-${VERCEL_TOKEN_ALT:-${VERCEL_TOKEN_API:-}}}"
          npx vercel@59.20.0 inspect "$DEPLOYMENT_URL" --token="$TOKEN"
