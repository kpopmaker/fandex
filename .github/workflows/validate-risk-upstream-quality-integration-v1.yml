name: Validate Risk upstream quality integration v1

on:
  pull_request:
    paths:
      - 'lib/product/adapters/newsIssuePointRiskQualityMetadata.ts'
      - 'lib/product/adapters/activityExposureRiskQualityMetadata.ts'
      - 'tests/risk-adjustment-upstream-quality-integration-v1.test.mts'
      - 'lib/intelligence/riskAdjustmentProducerMetadataAdapter.ts'
      - 'tests/risk-adjustment-producer-metadata-adapter-v1.test.mts'
      - '.github/workflows/validate-risk-upstream-quality-integration-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/risk-adjustment-upstream-quality-integration-v1.test.mts
      - run: npx tsx --test tests/risk-adjustment-point-contract-v1.test.mts tests/risk-adjustment-categorical-states-v1.test.mts tests/risk-adjustment-news-issue-projection-v1.test.mts tests/risk-adjustment-activity-exposure-projection-v1.test.mts tests/risk-adjustment-upstream-metadata-requirements-v1.test.mts tests/risk-adjustment-product-contract-candidate-v1.test.mts tests/risk-adjustment-product-dependency-assembly-v1.test.mts tests/risk-adjustment-upstream-handoff-v1.test.mts tests/risk-adjustment-upstream-quality-envelope-v1.test.mts tests/risk-adjustment-producer-metadata-adapter-v1.test.mts tests/risk-adjustment-quality-envelope-assembly-v1.test.mts tests/risk-adjustment-quality-envelope-record-v1.test.mts
      - run: npm run typecheck
