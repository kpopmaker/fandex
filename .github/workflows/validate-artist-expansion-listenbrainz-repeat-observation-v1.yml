name: Validate Artist Expansion ListenBrainz repeat observation v1

on:
  push:
    branches:
      - evidence/artist-expansion-listenbrainz-repeat-observation-v1

permissions:
  contents: read

jobs:
  validate-repeat-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ListenBrainz repeat observation
        run: python tests/artist-expansion-listenbrainz-repeat-observation-v1.py
