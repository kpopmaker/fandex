name: PR170 IU Luminate licensed bootstrap validation

on:
  push:
    branches:
      - research/musicbrainz-album-catalog-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate licensed bootstrap manifest
        run: |
          npx tsx --test tests/iu-luminate-licensed-bootstrap-research-v1.test.mts
          npx tsx --test tests/iu-luminate-provider-identity-review-research-v1.test.mts
          npx tsx --test tests/luminate-snowflake-album-extraction-research-v1.test.mts
          npx tsx --test tests/luminate-album-authorization-research-v1.test.mts
          npx tsx --test tests/luminate-album-observation-intake-research-v1.test.mts
          npm run typecheck
