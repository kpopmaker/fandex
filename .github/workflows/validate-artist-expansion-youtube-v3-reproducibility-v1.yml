name: Validate Artist Expansion YouTube v3 reproducibility v1

on:
  push:
    branches:
      - validation/artist-expansion-youtube-v3-reproducibility-v1

permissions:
  contents: read

jobs:
  youtube-v3-reproducibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: YouTube v3 reproducibility syntax
        run: |
          python -m py_compile \
            scripts/fandex-cloud-migration/source/youtube_v3_legacy_reproducibility_audit_v1.py \
            scripts/fandex-cloud-migration/source/youtube_reviewed_seed_candidate_v1.py \
            scripts/fandex-cloud-migration/source/youtube_reviewed_seed_shadow_v1.py \
            scripts/fandex-cloud-migration/source/youtube_collect_video_metrics_v1.py \
            scripts/fandex-cloud-migration/source/youtube_publish_v3.py
      - name: Validate reviewed seed ledger and materialization
        run: python scripts/fandex-cloud-migration/source/youtube_reviewed_seed_candidate_v1.py
      - name: Live new-artist reviewed seed shadow
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fandex-cloud-migration/source/youtube_reviewed_seed_shadow_v1.py
      - name: Live legacy Product-10 reproducibility audit
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/fandex-cloud-migration/source/youtube_v3_legacy_reproducibility_audit_v1.py
      - name: Upload YouTube reproducibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artist-expansion-youtube-v3-reproducibility-v1
          path: |
            youtube_reviewed_seed_shadow_v1_latest.json
            youtube_v3_legacy_reproducibility_audit_v1_latest.json
          if-no-files-found: ignore
          retention-days: 7
