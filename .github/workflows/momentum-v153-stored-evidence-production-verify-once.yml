name: Momentum v153 Stored Evidence Production Verify Once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[momentum-v153-stored-evidence-verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require scheduler secret
        shell: bash
        env:
          FANDEX_NAVER_NEWS_SCHEDULER_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_SCHEDULER_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${FANDEX_NAVER_NEWS_SCHEDULER_SECRET:-}" ]; then
            echo "Scheduler secret is not configured."
            exit 2
          fi

      - name: Invoke Production read-only verifier and assert current stored boundary
        shell: bash
        env:
          FANDEX_NAVER_NEWS_SCHEDULER_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_SCHEDULER_SECRET }}
        run: |
          set -euo pipefail
          url="https://fandex-eta.vercel.app/api/internal/naver-news/shadow-series-verifier"
          cat > assert-response.cjs <<'NODE'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync('response.json', 'utf8'));
          if (x.ok !== true) throw new Error('verifier_not_ok');
          if (x.mode !== 'shadow-series-verifier') throw new Error('verifier_mode_invalid');
          if (x.canonicalArtistId !== 'iu') throw new Error('artist_invalid');
          if (x.protocolStart !== '2026-09-15T16:00:00.000Z') throw new Error('protocol_start_invalid');
          if (x.throughSlotStart !== '2026-09-20T15:00:00.000Z') throw new Error('through_slot_invalid');
          if (x.expectedSlotCount !== 120 || x.snapshotCount !== 120) throw new Error('slot_count_invalid');
          if (x.status !== 'available' || x.activity?.status !== 'available') throw new Error('series_unavailable');
          if (!Array.isArray(x.activity.slots) || x.activity.slots.length !== 120) throw new Error('activity_slot_count_invalid');
          const latest = x.activity.slots.at(-1);
          if (latest?.slotStart !== '2026-09-20T15:00:00.000Z') throw new Error('latest_slot_invalid');
          if (latest?.jobId !== '39ec4ddeeda1eedd906bc33288e1550a6c8fd3aeb1f46be590e661fcb6c41a9c') {
            throw new Error('latest_job_id_invalid');
          }
          if (latest?.observedObservationCount !== 100) throw new Error('latest_observation_count_invalid');
          if (latest?.bootstrap !== false) throw new Error('latest_bootstrap_invalid');
          console.log(JSON.stringify({
            ok: x.ok,
            canonicalArtistId: x.canonicalArtistId,
            protocolStart: x.protocolStart,
            throughSlotStart: x.throughSlotStart,
            expectedSlotCount: x.expectedSlotCount,
            snapshotCount: x.snapshotCount,
            status: x.status,
            reason: x.reason,
            latestSlot: latest,
          }, null, 2));
          NODE

          rm -f response.json
          for attempt in $(seq 1 30); do
            status=$(curl \
              --silent \
              --show-error \
              --output response.json \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${FANDEX_NAVER_NEWS_SCHEDULER_SECRET}" \
              --header 'Content-Type: application/json' \
              --data '{}' \
              --connect-timeout 10 \
              --max-time 30 \
              "$url" || true)
            if [ "$status" = "200" ]; then
              node assert-response.cjs
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 10
            fi
          done
          echo "Production verifier did not return a valid HTTP 200 response within the retry window."
          if [ -f response.json ]; then
            cat response.json
          fi
          exit 1
