name: PR127 v153 live stored-evidence reproduction closure

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Evaluate v153 reproduced state
        run: |
          cat > .tmp-v153-live-reproduced.mts <<'TS'
          import {
            evaluateFandexMomentumSourceProvenanceResearch,
          } from './lib/intelligence/fandexMomentumSourceProvenanceResearch';

          const result = evaluateFandexMomentumSourceProvenanceResearch({
            snapshot: {
              canonicalArtistId: 'iu',
              naverEvidenceId: '39ec4ddeeda1eedd906bc33288e1550a6c8fd3aeb1f46be590e661fcb6c41a9c',
              naverCollectionKey: 'sched-v125-naver-news-20260920t150000z-f1ed381d367d',
              naverThroughSlotStart: '2026-09-20T15:00:00.000Z',
              naverStatus: 'succeeded',
              naverRawEvidenceCount: 100,
              naverNormalizedRecordCount: 100,
              naverDuplicateRecordCount: 0,
              naverRejectedItemCount: 0,
            },
            runtimeObservation: {
              observedAt: '2026-09-20T15:37:00.000Z',
              requestPath: '/api/internal/naver-news/shadow-scheduler',
              httpStatus: 200,
              deploymentId: 'dpl_6fmT3qKqeytud3kFCNVoArBGGK1K',
              branch: 'main',
            },
            storedEvidenceReproducedThisEvaluation: true,
          });

          if (result.state !== 'stored-evidence-read-reproduced') {
            throw new Error('v153 reproduced state not reached');
          }
          if (!result.futureLiveRefreshEligible || result.blockers.length !== 0) {
            throw new Error('v153 provenance blocker not cleared');
          }
          console.log('V153_REPRODUCED_BEGIN');
          console.log(JSON.stringify(result));
          console.log('V153_REPRODUCED_END');
          TS
          npx tsx --conditions=react-server .tmp-v153-live-reproduced.mts
          rm .tmp-v153-live-reproduced.mts
      - name: Regress v153 and v156
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-source-provenance-v153.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-triple-artifact-acceptance-v156.test.mts
          npm run typecheck
          git diff --check
