name: Validate Momentum verifier Actions-secret handoff v1

on:
  push:
    branches:
      - work/momentum-verifier-github-secret-handoff-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Scope allowlist
        run: |
          git diff --name-only 9b417a76e4fffbb125e1b37c7d17a0afc434580b...HEAD | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/execute-momentum-native-verifier-production-v1.yml
          .github/workflows/validate-momentum-verifier-github-secret-handoff-v1.yml
          scripts/operations/momentumNativeVerifierProductionExecutionV1.mjs
          tests/momentum-native-verifier-production-execution-authorization-v1.test.mts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt
      - run: npm ci
      - name: Execution authorization regression
        run: npx tsx --test tests/momentum-native-verifier-production-execution-authorization-v1.test.mts
      - name: Activation regression
        run: npx tsx --test tests/momentum-production-verifier-activation-approval-v1.test.mts
      - name: Script syntax
        run: node --check scripts/operations/momentumNativeVerifierProductionExecutionV1.mjs
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
