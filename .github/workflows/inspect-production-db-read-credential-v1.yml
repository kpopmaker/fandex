name: Inspect Production DB read credential availability v1

on:
  push:
    branches:
      - 'work/product-production-readiness-reprobe-v1'
    paths:
      - '.github/workflows/inspect-production-db-read-credential-v1.yml'

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'kpopmaker/fandex' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      FANDEX_RUNTIME_DATABASE_URL: ${{ secrets.FANDEX_RUNTIME_DATABASE_URL }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DATABASE_POSTGRES_URL: ${{ secrets.DATABASE_POSTGRES_URL }}
      FANDEX_MIGRATION_DATABASE_URL: ${{ secrets.FANDEX_MIGRATION_DATABASE_URL }}
    steps:
      - name: Report credential presence only
        shell: bash
        run: |
          set -euo pipefail
          for key in FANDEX_RUNTIME_DATABASE_URL DATABASE_URL DATABASE_POSTGRES_URL FANDEX_MIGRATION_DATABASE_URL; do
            if [[ -n "${!key:-}" ]]; then
              echo "${key}=configured"
            else
              echo "${key}=missing"
            fi
          done
          echo "DATABASE_CONNECTIONS=0"
          echo "DATABASE_READS=0"
          echo "DATABASE_WRITES=0"
