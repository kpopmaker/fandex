name: NAVER News Official Manifest Finalize v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/intelligence/naverNewsOfficialManifestFinalize.ts"
      - "lib/intelligence/naverNewsOfficialManifestFinalize.test.mts"
      - ".github/workflows/naver-news-official-manifest-finalize-v1.yml"

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Validate finalize contract
        run: npx tsx --test lib/intelligence/naverNewsOfficialManifestFinalize.test.mts
