name: NAVER News Official Manifest Finalize v1

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "lib/server/ingestion/naverNewsStoredEvidenceMirror.ts"
      - "scripts/ingestion/run-naver-news-blob-only-direct-v1.ts"
      - "tests/naver-news-stored-evidence-mirror-v1.test.mts"
      - "tests/naver-news-blob-only-direct-v1.test.mts"
      - ".github/workflows/naver-news-blob-only-direct-production-v1.yml"
      - ".github/workflows/naver-news-blob-only-recurring-production-v1.yml"
      - ".github/workflows/naver-news-official-manifest-finalize-v1.yml"

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Stored Evidence finalization
        run: npx tsx --test tests/naver-news-stored-evidence-mirror-v1.test.mts

      - name: Validate direct Blob authority handoff
        run: npx tsx --test tests/naver-news-blob-only-direct-v1.test.mts

      - name: Typecheck
        run: npm run typecheck
