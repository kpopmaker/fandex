name: TMP PR127 Current Main Merge Simulation

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - .github/workflows/tmp-pr127-current-main-merge-simulation.yml

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Fetch current main and simulate merge
        shell: bash
        run: |
          set -euo pipefail
          expected_main='1df5bc16056b8a618a99369a763e89e1f5c9e997'
          branch_head="$(git rev-parse HEAD)"
          printf '%s\n' "$branch_head" > /tmp/pr127-start-head

          git fetch origin main
          actual_main="$(git rev-parse origin/main)"
          echo "actual_main=$actual_main"
          [[ "$actual_main" == "$expected_main" ]]

          cp vercel.json /tmp/pr127-vercel.json

          set +e
          git merge --no-commit --no-ff origin/main > /tmp/merge.log 2>&1
          merge_status=$?
          set -e

          cat /tmp/merge.log
          echo "merge_status=$merge_status"

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          printf 'conflict=%s\n' "${conflicts[@]}"

          [[ "${#conflicts[@]}" -eq 1 ]]
          [[ "${conflicts[0]}" == "vercel.json" ]]

          cp /tmp/pr127-vercel.json vercel.json
          git add vercel.json

          remaining="$(git diff --name-only --diff-filter=U)"
          [[ -z "$remaining" ]]

          node <<'NODE'
          const fs = require('node:fs');
          const cfg = JSON.parse(fs.readFileSync('vercel.json','utf8'));
          const d = cfg?.git?.deploymentEnabled ?? {};
          const required = [
            'validation/*',
            'research/*',
            'verify/*',
            'diagnostic/*',
            'work/*',
            'v131-lastfm-real-signal-read-model',
          ];
          for (const key of required) {
            if (d[key] !== false) throw new Error('missing suppression: ' + key);
          }
          console.log('vercel suppression resolution: PASS');
          NODE

      - run: npm ci

      - name: v181 regression
        run: npx tsx --test tests/fandex-momentum-verifier-external-capability-resume-gate-v181.test.mts

      - name: External operator regression
        run: |
          npx tsx --test tests/fandex-momentum-verifier-operator-response-intake-v177.test.mts
          npx tsx --test tests/fandex-momentum-verifier-operator-response-projection-v178.test.mts
          npx tsx --test tests/fandex-momentum-verifier-external-inventory-execution-response-intake-v179.test.mts

      - name: Typecheck merged tree
        run: npm run typecheck

      - name: Scope diff check to conflict resolution
        shell: bash
        run: git diff --cached --check -- vercel.json

      - name: Abort simulation
        if: always()
        shell: bash
        run: |
          git merge --abort || true
          start_head="$(cat /tmp/pr127-start-head)"
          test "$(git rev-parse HEAD)" = "$start_head" || {
            echo "Branch HEAD changed during simulation."
            exit 1
          }
