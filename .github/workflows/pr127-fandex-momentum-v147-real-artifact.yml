name: PR127 FANDEX momentum v147 real artifact materialization

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
  workflow_dispatch:

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate committed v147 artifact and upstream contracts
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-unified-history-v147.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-append-adapter-v146.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-carrier-change-v145.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-research-carrier-v144.test.mts
          npm run typecheck
      - name: Materialize real IU v147 unified history
        run: |
          git fetch origin main
          git show b4194f0d69e4bd9fed3604db1522cebd2cdf1d56:data/lastfm-cloud/lastfm_artist_interest_history_v1.csv > /tmp/previous-main-lastfm-history.csv
          git show origin/main:data/lastfm-cloud/lastfm_artist_interest_history_v1.csv > /tmp/current-main-lastfm-history.csv

          cat > .tmp-v147-real.mts <<'TS'
          import { readFile } from 'node:fs/promises';
          import {
            deriveFandexNaverMediaAttentionMomentumResearch,
          } from './lib/intelligence/fandexNaverMediaAttentionMomentumResearch';
          import {
            evaluateFandexMomentumTemporalNormalizationResearch,
          } from './lib/intelligence/fandexMomentumTemporalNormalizationResearch';
          import {
            evaluateFandexMomentumCrossFamilyCombinationResearch,
          } from './lib/intelligence/fandexMomentumCrossFamilyCombinationResearch';
          import {
            evaluateFandexMomentumOutputFormEligibilityResearch,
          } from './lib/intelligence/fandexMomentumOutputFormEligibilityResearch';
          import {
            materializeFandexMomentumUnifiedHistoryResearch,
          } from './lib/intelligence/fandexMomentumUnifiedHistoryMaterializerResearch';
          import {
            parseFandexMomentumUnifiedHistoryJsonl,
          } from './lib/intelligence/fandexMomentumUnifiedHistoryResearch';
          import {
            NAVER_NEWS_ISSUE_POINT_FROZEN_METHODOLOGY_CONTRACT_VERSION,
          } from './lib/server/ingestion/naverNewsIssuePointFrozenMethodology';
          import {
            NAVER_NEWS_ISSUE_POINT_METHODOLOGY_VERSION,
          } from './lib/intelligence/naverNewsIssuePointConstruct';

          function points(anchors: readonly (readonly [string, number, number, number])[]) {
            return anchors.map(([throughSlotStart, activityRate, score, priorDefinedWindowCount]) => ({
              contractVersion: NAVER_NEWS_ISSUE_POINT_FROZEN_METHODOLOGY_CONTRACT_VERSION,
              methodologyVersion: NAVER_NEWS_ISSUE_POINT_METHODOLOGY_VERSION,
              lifecycle: 'research',
              directProductContributionEligible: false,
              productScorePublished: false,
              variableId: 'newsIssuePoint',
              canonicalArtistId: 'iu',
              protocolStart: '2026-09-15T16:00:00.000Z',
              throughSlotStart,
              selectedWindowSlotCount: 8,
              rollingWindowSemantics: 'overlapping',
              baselineScope: 'same_artist_same_official_shadow_epoch',
              baselineReadiness: {
                cycleSlotCount: 24,
                utcHourCoverageCount: 24,
                completeCycleCount: 2,
                sameUtcHourReplicationFloor: 2,
                sameUtcHourReplicationCeiling: 2,
                status: 'replicated_cycle_history',
              },
              normalizationType: 'HISTORICAL_STRICT_EXCEEDANCE_SHARE',
              status: 'available',
              reason: 'frozen_methodology_value_available',
              score,
              currentActivityRate: activityRate,
              priorDefinedWindowCount,
              priorLessThanLatestCount: 0,
              priorEqualToLatestCount: 0,
              priorGreaterThanLatestCount: 0,
              currentWindow: null,
              eligiblePriorWindows: [],
              excludedWindows: [],
              evidenceTrace: { windows: [], storedEvidenceJobIds: [] },
            })) as any;
          }

          function derive(history: string, anchors: readonly (readonly [string, number, number, number])[]) {
            const v140 = deriveFandexNaverMediaAttentionMomentumResearch(points(anchors));
            const v141 = evaluateFandexMomentumTemporalNormalizationResearch({
              canonicalArtistId: 'iu',
              lastfmHistoryCsv: history,
              naverComponent: v140,
            });
            const v142 = evaluateFandexMomentumCrossFamilyCombinationResearch(v141);
            return evaluateFandexMomentumOutputFormEligibilityResearch(v142);
          }

          const previousAnchors = [
            ['2026-09-17T17:00:00.000Z', 0.00125, 26.829268292683, 41],
            ['2026-09-18T01:00:00.000Z', 0.00125, 24.489795918367, 49],
            ['2026-09-18T09:00:00.000Z', 0.03375, 98.245614035088, 57],
            ['2026-09-18T17:00:00.000Z', 0.0025, 33.846153846154, 65],
            ['2026-09-19T01:00:00.000Z', 0.0, 0.0, 73],
            ['2026-09-19T09:00:00.000Z', 0.0025, 41.975308641975, 81],
          ] as const;

          const currentAnchors = [
            ['2026-09-17T21:00:00.000Z', 0.00125, 24.444444444444, 45],
            ['2026-09-18T05:00:00.000Z', 0.02375, 94.339622641509, 53],
            ['2026-09-18T13:00:00.000Z', 0.0125, 72.131147540984, 61],
            ['2026-09-18T21:00:00.000Z', 0.00125, 17.391304347826, 69],
            ['2026-09-19T05:00:00.000Z', 0.00125, 20.779220779221, 77],
            ['2026-09-19T13:00:00.000Z', 0.00125, 18.823529411765, 85],
            ['2026-09-19T21:00:00.000Z', 0.0, 0.0, 93],
            ['2026-09-20T05:00:00.000Z', 0.00125, 30.693069306931, 101],
          ] as const;

          const [previousHistory, currentHistory] = await Promise.all([
            readFile('/tmp/previous-main-lastfm-history.csv', 'utf8'),
            readFile('/tmp/current-main-lastfm-history.csv', 'utf8'),
          ]);

          const previous = derive(previousHistory, previousAnchors);
          const current = derive(currentHistory, currentAnchors);

          if (previous.digest !== '121343630db936fa265f546523b28977614ce1658c13e68a7857344c4b3add28') {
            throw new Error('previous digest mismatch');
          }
          if (current.digest !== '87edf2884c2f35a3a5819349ebb374012926f103fdeb3d41af10da59ca68de7a') {
            throw new Error('current digest mismatch');
          }

          const materialized = materializeFandexMomentumUnifiedHistoryResearch({
            previous: {
              result: previous,
              recordedAt: '2026-09-19T15:26:05.410Z',
            },
            current: {
              result: current,
              recordedAt: '2026-09-20T05:30:00.000Z',
            },
          });

          const parsed = parseFandexMomentumUnifiedHistoryJsonl(materialized.jsonl);
          if (parsed.length !== 2) throw new Error('expected two records');
          if (parsed[1].previousRecordDigest !== parsed[0].recordDigest) {
            throw new Error('hash chain mismatch');
          }
          if (parsed[1].previousSourceV143Digest !== parsed[0].sourceV143Digest) {
            throw new Error('source lineage mismatch');
          }
          if (parsed[1].changeKind !== 'direction-and-persistence-changed') {
            throw new Error('unexpected transition kind');
          }

          console.log(JSON.stringify({
            firstRecordDigest: materialized.firstRecordDigest,
            secondRecordDigest: materialized.secondRecordDigest,
            firstObservationId: materialized.firstObservationId,
            secondObservationId: materialized.secondObservationId,
            firstSourceDigest: parsed[0].sourceV143Digest,
            secondSourceDigest: parsed[1].sourceV143Digest,
            firstDirection: parsed[0].directionalConsensus,
            firstPersistence: parsed[0].persistenceConsensus,
            secondDirection: parsed[1].directionalConsensus,
            secondPersistence: parsed[1].persistenceConsensus,
            secondChangeKind: parsed[1].changeKind,
          }, null, 2));
          console.log('V147_JSONL_BEGIN');
          process.stdout.write(materialized.jsonl);
          console.log('V147_JSONL_END');
          TS

          npx tsx --conditions=react-server .tmp-v147-real.mts
          rm .tmp-v147-real.mts
