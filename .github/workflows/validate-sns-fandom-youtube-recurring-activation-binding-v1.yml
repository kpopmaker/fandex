name: Validate snsFandom recurring activation binding v1

on:
  push:
    branches:
      - 'work/sns-fandom-recurring-activation-v1'
    paths:
      - 'lib/intelligence/snsFandomPointYoutubeRecurringActivationBinding.ts'
      - 'lib/intelligence/snsFandomPointYoutubeRecurringMeasurement.ts'
      - 'lib/intelligence/snsFandomPointYoutubeWindowSupersessionHandoff.ts'
      - 'docs/research/sns-fandom-youtube-recurring-measurement-activation-v1.json'
      - 'tests/sns-fandom-youtube-recurring-activation-binding-v1.test.mts'
      - 'tests/sns-fandom-youtube-recurring-measurement-runner-v1.test.mts'
      - 'tests/sns-fandom-youtube-window-supersession-handoff-v1.test.mts'
      - 'docs/research/sns-fandom-youtube-api-audit-packet-v1.md'
      - '.github/workflows/validate-sns-fandom-youtube-recurring-activation-binding-v1.yml'
  pull_request:
    paths:
      - 'lib/intelligence/snsFandomPointYoutubeRecurringActivationBinding.ts'
      - 'lib/intelligence/snsFandomPointYoutubeRecurringMeasurement.ts'
      - 'lib/intelligence/snsFandomPointYoutubeWindowSupersessionHandoff.ts'
      - 'docs/research/sns-fandom-youtube-recurring-measurement-activation-v1.json'
      - 'tests/sns-fandom-youtube-recurring-activation-binding-v1.test.mts'
      - 'tests/sns-fandom-youtube-recurring-measurement-runner-v1.test.mts'
      - 'tests/sns-fandom-youtube-window-supersession-handoff-v1.test.mts'
      - 'docs/research/sns-fandom-youtube-api-audit-packet-v1.md'
      - '.github/workflows/validate-sns-fandom-youtube-recurring-activation-binding-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Activation binding regressions
        run: >-
          npx tsx --test
          tests/sns-fandom-youtube-recurring-activation-binding-v1.test.mts
          tests/sns-fandom-youtube-recurring-measurement-runner-v1.test.mts
          tests/sns-fandom-youtube-window-supersession-handoff-v1.test.mts
          tests/sns-fandom-youtube-current-submission-readiness-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Safety boundary
        if: always()
        run: |
          echo "scheduleTriggerAdded=false"
          echo "providerCalls=0"
          echo "activationBoundaryMaterialized=false"
          echo "runtimeBound=false"
          echo "evidenceStoreBound=false"
          echo "productionCollectionAuthorized=false"
          echo "providerSubmissionAuthorized=false"
          echo "productActivationAuthorized=false"
