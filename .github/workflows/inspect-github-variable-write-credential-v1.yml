name: Inspect GitHub variable write credential v1

on:
  push:
    branches:
      - ops/inspect-github-variable-write-credential-20260929-v1

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      ALL_SECRETS_JSON: ${{ toJSON(secrets) }}
    steps:
      - name: Report GitHub credential candidate names only
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const raw = process.env.ALL_SECRETS_JSON || '{}';
          const obj = JSON.parse(raw);
          const names = Object.keys(obj)
            .filter((name) => /(?:^GH_|GITHUB|PAT|VARIABLES?_TOKEN|VARIABLES?_PAT)/i.test(name))
            .filter((name) => name !== 'GITHUB_TOKEN')
            .sort();
          console.log('GITHUB_VARIABLE_WRITE_CREDENTIAL_CANDIDATES=' + JSON.stringify(names));
          console.log('secretValuesLogged=false');
          console.log('productionRequests=0');
          NODE
