name: Validate snsFandom current submission readiness v1

on:
  push:
    branches:
      - 'work/sns-fandom-current-submission-readiness-regression-v1'
    paths:
      - 'docs/research/sns-fandom-youtube-provider-client-owner-input-v1.json'
      - 'docs/research/sns-fandom-youtube-quota-owner-input-v1.json'
      - 'docs/research/sns-fandom-youtube-audit-evidence-refs-v1.json'
      - 'lib/intelligence/snsFandomPointYoutubeAuditSubmissionReadiness.ts'
      - 'lib/intelligence/snsFandomPointYoutubeProviderClientOwnerHandoff.ts'
      - 'lib/intelligence/snsFandomPointYoutubeQuotaOwnerHandoff.ts'
      - 'tests/sns-fandom-youtube-current-submission-readiness-v1.test.mts'
      - '.github/workflows/validate-sns-fandom-current-submission-readiness-v1.yml'
  pull_request:
    paths:
      - 'docs/research/sns-fandom-youtube-provider-client-owner-input-v1.json'
      - 'docs/research/sns-fandom-youtube-quota-owner-input-v1.json'
      - 'docs/research/sns-fandom-youtube-audit-evidence-refs-v1.json'
      - 'lib/intelligence/snsFandomPointYoutubeAuditSubmissionReadiness.ts'
      - 'lib/intelligence/snsFandomPointYoutubeProviderClientOwnerHandoff.ts'
      - 'lib/intelligence/snsFandomPointYoutubeQuotaOwnerHandoff.ts'
      - 'tests/sns-fandom-youtube-current-submission-readiness-v1.test.mts'
      - '.github/workflows/validate-sns-fandom-current-submission-readiness-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Current submission-readiness regression
        run: npx tsx --test tests/sns-fandom-youtube-current-submission-readiness-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
