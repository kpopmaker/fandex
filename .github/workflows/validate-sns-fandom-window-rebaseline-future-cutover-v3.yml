name: Validate snsFandom future-slot rebaseline cutover v3

on:
  push:
    branches:
      - 'work/sns-fandom-window-rebaseline-future-cutover-v3'
    paths:
      - 'lib/intelligence/snsFandomPointYoutubeWindowRebaselineFutureCutoverV3.ts'
      - 'tests/sns-fandom-youtube-window-rebaseline-future-cutover-v3.test.mts'
      - 'docs/research/sns-fandom-youtube-window-rebaseline-candidate-v2.json'
      - 'docs/research/sns-fandom-youtube-window-rebaseline-future-cutover-v3.json'
      - '.github/workflows/validate-sns-fandom-window-rebaseline-future-cutover-v3.yml'
  pull_request:
    paths:
      - 'lib/intelligence/snsFandomPointYoutubeWindowRebaselineFutureCutoverV3.ts'
      - 'tests/sns-fandom-youtube-window-rebaseline-future-cutover-v3.test.mts'
      - 'docs/research/sns-fandom-youtube-window-rebaseline-candidate-v2.json'
      - 'docs/research/sns-fandom-youtube-window-rebaseline-future-cutover-v3.json'
      - '.github/workflows/validate-sns-fandom-window-rebaseline-future-cutover-v3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Future-slot rebaseline cutover regressions
        run: npx tsx --test tests/sns-fandom-youtube-window-rebaseline-future-cutover-v3.test.mts

      - name: Existing v2 candidate regression
        run: npx tsx --test tests/sns-fandom-youtube-window-rebaseline-candidate-v2.test.mts

      - name: Existing recurring activated runtime regression
        run: npx tsx --test tests/sns-fandom-youtube-recurring-activated-runtime-v1.test.mts

      - name: Existing Render trigger regression
        run: npx tsx --test tests/sns-fandom-youtube-render-trigger-binding-candidate-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - name: Safety boundary
        if: always()
        run: |
          echo "currentV1SchedulerMutation=false"
          echo "newGenerationProviderCalls=0"
          echo "futureCanonicalBoundaryMaterialized=false"
          echo "historicalV1ReceiptsReinterpreted=false"
          echo "syntheticBackfillAllowed=false"
          echo "retrospectiveProviderObservationAllowed=false"
          echo "providerSubmissionAuthorized=false"
          echo "productionCollectionAuthorized=false"
          echo "productActivationAuthorized=false"
