name: PR127 momentum v165 provisioning authorization plan

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - 'lib/intelligence/fandexMomentumVerifierProvisioningAuthorizationPlanResearch.ts'
      - 'tests/fandex-momentum-verifier-provisioning-authorization-plan-v165.test.mts'
      - '.github/workflows/pr127-momentum-v165-provisioning-authorization-plan.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Evaluate current authoritative v165 plan
        run: |
          cat > .tmp-v165-current.mts <<'TS'
          import {
            buildFandexMomentumVerifierProvisioningAuthorizationPlan,
          } from './lib/intelligence/fandexMomentumVerifierProvisioningAuthorizationPlanResearch';

          const out = buildFandexMomentumVerifierProvisioningAuthorizationPlan({
            upstreamV164State: 'configuration-evidence-blocked',
            upstreamV164Digest:
              '8fd9585c3b77396bde869a9aec80c022f9231fabf54fcac1cc6dffbeb738ba6c',
            teamId: 'team_OrRPxuBxMwCYU3kk0r76AfOs',
            projectId: 'prj_aT3p8zmjyochu8iGmFOuNR1lSU7v',
            projectName: 'fandex',
            environment: 'production',
            intendedDeploymentCommit:
              '7a1038226b07abf4a130986766ef114a43c1d638',
            intendedPreviewDeploymentId:
              'dpl_FbqAfXBDTrZBPMEiwrYswmK5kNm8',
            intendedPreviewDeploymentReady: true,
            freshSourceThroughSlotStart: '2026-09-21T12:00:00.000Z',
            freshSourceAlreadyAdvanced: false,
          });

          console.log('V165_CURRENT_BEGIN');
          console.log(JSON.stringify(out, null, 2));
          console.log('V165_CURRENT_END');
          TS
          npx tsx --conditions=react-server .tmp-v165-current.mts
          rm .tmp-v165-current.mts

      - name: Validate v165 and v164/v163 regressions
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-provisioning-authorization-plan-v165.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-configuration-evidence-v164.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-channel-readiness-v163.test.mts
          npm run typecheck
          git diff --check
