name: PR170 album normalization validation

on:
  push:
    branches:
      - research/musicbrainz-album-catalog-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate album canonical and normalization contracts
        run: |
          npx tsx --test tests/canonical-album-feature-input-v1.test.mts
          npx tsx --test tests/album-direct-first-week-absolute-research-v1.test.mts
          npx tsx --test tests/album-normalization-research-v1.test.mts
          npx tsx --test tests/album-normalization-readiness-integration-v1.test.mts
          npx tsx --test tests/album-release-eligibility-research-v1.test.mts
          npx tsx --test tests/hanteo-first-week-period-research-v1.test.mts
          npx tsx --test tests/hanteo-first-week-production-readiness-research-v1.test.mts
          npm run typecheck
