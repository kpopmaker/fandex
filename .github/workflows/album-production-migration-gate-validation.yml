name: Album Production Migration Gate Validation

on:
  push:
    branches:
      - integration/album-production-migration-gate

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run production migration gate tests
        run: npx tsx --test tests/album-production-migration-gate-v1.test.mts
      - name: Run research persistence writer regression
        run: npx tsx --test tests/album-research-persistence-writer-v1.test.mts tests/album-research-persistence-sql-contract-v1.test.mts
      - name: Typecheck
        run: npm run typecheck
