name: Hanteo Historical Asset Scan

on:
  push:
    branches:
      - integration/album-hanteo-direct-discovery

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Scan current historical page assets once
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const pageUrl = 'https://www.hanteochart.com/en/charts/album/weekly/2026-W30';
          const base = 'https://www.hanteochart.com';
          const needles = ['ranking/list','api.hanteochart','salesVolume','resultDatetime','targetIdx','/v4/ranking','WEEKLY','DAILY','MONTHLY','limit','issue','date','period','timestamp'];
          const main = async () => {
            const pageRes = await fetch(pageUrl, { headers: { 'user-agent': 'Mozilla/5.0' } });
            const html = await pageRes.text();
            const scripts = [...new Set([...html.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m => m[1]))];
            const matches = [];
            for (const src of scripts) {
              const url = /^https?:/.test(src) ? src : base + src;
              let raw = '';
              try {
                const r = await fetch(url, { headers: { 'user-agent': 'Mozilla/5.0' } });
                raw = await r.text();
              } catch {
                continue;
              }
              if (!/(ranking\/list|api\.hanteochart|salesVolume|resultDatetime|targetIdx|\/v4\/ranking|WEEKLY|DAILY|MONTHLY)/i.test(raw)) continue;
              const snippets = {};
              for (const n of needles) {
                const arr = [];
                let start = 0;
                while (arr.length < 6) {
                  const i = raw.indexOf(n, start);
                  if (i < 0) break;
                  arr.push(raw.slice(Math.max(0, i - 700), Math.min(raw.length, i + 1800)));
                  start = i + n.length;
                }
                if (arr.length) snippets[n] = arr;
              }
              matches.push({ src, length: raw.length, snippets });
            }
            const out = { pageStatus: pageRes.status, scriptCount: scripts.length, matchedAssetCount: matches.length, matches };
            fs.writeFileSync('hanteo-historical-asset-scan.json', JSON.stringify(out, null, 2));
            console.log(JSON.stringify({ pageStatus: out.pageStatus, scriptCount: out.scriptCount, matchedAssetCount: out.matchedAssetCount }, null, 2));
          };
          main().catch(err => { console.error(err); process.exit(1); });
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: hanteo-historical-asset-scan
          path: hanteo-historical-asset-scan.json
          retention-days: 1
