name: Hanteo Current Adapter Validation

on:
  push:
    branches:
      - integration/album-hanteo-direct-discovery

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Hanteo qualification tests
        run: npx tsx --test tests/hanteo-album-discovery-v1.test.mts tests/hanteo-album-adapter-v1.test.mts tests/album-provider-specific-integration-depth-v1.test.mts
      - name: Typecheck
        run: npm run typecheck
