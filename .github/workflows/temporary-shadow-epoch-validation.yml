name: Temporary Shadow Epoch Validation

on:
  push:
    branches:
      - chore/official-qstash-shadow-epoch
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate shadow epoch contracts
        run: |
          npx tsx --test tests/naver-news-shadow-epoch-v1.test.mts
          npx tsx --test tests/naver-news-shadow-first-seen-series-v1.test.mts
          npx tsx --test tests/naver-news-shadow-series-verifier.test.mts
      - name: Typecheck
        run: npm run typecheck
