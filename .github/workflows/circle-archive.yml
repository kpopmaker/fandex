name: FANDEX circle archive

# 장기 음반 기록: 써클차트 주간 앨범 차트를 모아 그룹별 초동판매량을 circle-archive 브랜치에 쌓는다.
# 한 번에 다 못 받으면 받은 만큼 저장하고 다음 실행이 이어서 받는다.
# - 매주 월요일 04:11(한국 시간). 써클은 지난주 차트를 월요일에 낸다.
# - circle-archive-run 브랜치에 푸시하면 바로 한 번 돈다(처음 채울 때).
on:
  schedule:
    - cron: '11 19 * * 0'
  push:
    branches: ['circle-archive-run']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fandex-circle-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect Circle weekly album charts
        shell: bash
        env:
          TIME_BUDGET_MIN: '50'
          CONCURRENCY: '2'
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          set -euo pipefail
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p archive-prev
          if git fetch -q --depth=1 origin +circle-archive:refs/remotes/origin/circle-archive; then
            git archive origin/circle-archive | tar -x -C archive-prev
          fi
          PREV_DIR=archive-prev OUT_DIR=archive-out npx --yes tsx@4.23.12 scripts/market/circle-archive.ts
          cd archive-out
          git init -q -b circle-archive
          git add -A
          git commit -q -m "circle archive $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "$PUSH_URL" circle-archive:circle-archive
