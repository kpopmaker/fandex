name: Validate Momentum NAVER recovery epoch migration v1

on:
  push:
    branches:
      - work/momentum-naver-recovery-epoch-migration-v1
  pull_request:
    paths:
      - 'lib/server/ingestion/naverNewsShadowEpoch.ts'
      - 'lib/server/ingestion/naverNewsIssuePointFrozenMethodology.ts'
      - 'tests/naver-news-shadow-epoch-v1.test.mts'
      - 'tests/naver-news-issue-point-frozen-methodology.test.mts'
      - 'tests/momentum-naver-recovery-epoch-migration-v1.test.mts'
      - '.github/workflows/validate-momentum-naver-recovery-epoch-migration-v1.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Epoch registry regression
        run: npx tsx --test tests/naver-news-shadow-epoch-v1.test.mts
      - name: Historical frozen methodology regression
        run: npx tsx --test tests/naver-news-issue-point-frozen-methodology.test.mts
      - name: Recovery epoch migration regression
        run: npx tsx --test tests/momentum-naver-recovery-epoch-migration-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
