name: TEMP newsIssuePoint Activation Approval Validation

on:
  push:
    branches:
      - validation/news-issue-point-activation-approval-d31380

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact activation-approval head
        uses: actions/checkout@v4
        with:
          ref: d313802b65992f5eb70b94fa24523cfeadf8ca45
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Explicit activation approval
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-activation-approval-v1.test.mts

      - name: Activation authorization regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-activation-authorization-v1.test.mts

      - name: Activation approval candidate regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-activation-approval-candidate-v2.test.mts

      - name: Activation readiness regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-activation-readiness-v1.test.mts

      - name: Promotion approval/control regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-product-operations-approval-v1.test.mts tests/product-news-issue-point-promotion-authorization-v1.test.mts

      - name: Real Product read/Evidence regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-real-read-boundary-v1.test.mts

      - name: Product boundaries
        run: npx tsx --conditions=react-server --test tests/product-variable-boundary-v1.test.mts tests/product-evidence-boundary-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint

      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build

      - name: Diff sanity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "d313802b65992f5eb70b94fa24523cfeadf8ca45"
          test -z "$(git status --short --untracked-files=all)"
          git diff --check a96659a01f6090f8aac80ce9b27310ae9d8ca806..HEAD
          git diff --stat a96659a01f6090f8aac80ce9b27310ae9d8ca806..HEAD
          git diff --name-only a96659a01f6090f8aac80ce9b27310ae9d8ca806..HEAD
