name: TEMP post-merge newsIssuePoint Promotion Control Full Validation

on:
  push:
    branches:
      - validation/post-merge-promotion-control-aaa8-full

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Verify exact current-main parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "aaa8c3bd905b7cb9040bf001444e7c5b18e6f10d"

      - name: Install exact dependencies
        run: npm ci

      - name: Production dependency security
        run: npm run security:audit:production

      - name: Promotion authorization and revocation failure matrix
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/product-news-issue-point-promotion-authorization-v1.test.mts

      - name: Product and promotion regressions
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/product-news-issue-point-real-promotion-gate-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-read-boundary-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-selector-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-candidate-v1.test.mts
          node --import tsx --test tests/product-variable-boundary-v1.test.mts
          node --import tsx --test tests/product-evidence-boundary-v1.test.mts
          node --import tsx --test tests/intelligence-variable-confidence-v1.test.mts
          node --import tsx --test tests/temp-post-merge-promotion-control-other-six.test.mts

      - name: Stored Evidence lineage regressions
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/naver-news-canonical-job-evidence-v130.test.mts
          node --import tsx --test tests/naver-news-canonical-observation-v130.test.mts

      - name: Static checks
        run: npm run typecheck && npm run lint

      - name: Production build
        run: npm run build

      - name: Diff sanity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check aaa8c3bd905b7cb9040bf001444e7c5b18e6f10d...HEAD
