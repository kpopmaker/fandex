name: Discover Artist Expansion Music full355 candidates v1

on:
  push:
    branches:
      - research/artist-expansion-music-full355-candidates-v1

permissions:
  contents: read

jobs:
  discover-music-full355:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install beautifulsoup4 requests

      - name: Materialize canonical 355 candidate targets
        run: npx tsx scripts/artist-expansion/materialize_music_chart_355_candidate_targets_v1.mts

      - name: Validate target candidate contract
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const d=JSON.parse(fs.readFileSync('music_chart_artist_targets_355_candidate_v1.json','utf8'));
          if(d.canonicalUniverseCount!==355) throw new Error('universe_count');
          if(d.artists.length!==355) throw new Error('artist_count');
          if(d.preservedReviewedSupportedCount!==21) throw new Error('reviewed_count');
          if(d.unresolvedCandidateCount!==334) throw new Error('unresolved_count');
          if(new Set(d.artists.map(x=>x.canonicalArtistId)).size!==355) throw new Error('duplicate_id');
          if(!Object.values(d.safety).every(v=>v===false)) throw new Error('safety');
          console.log('PASS: full355 candidate target contract');
          NODE

      - name: Prepare discovery working directory
        run: |
          cp music_chart_artist_targets_355_candidate_v1.json scripts/fandex-cloud-migration/source/music_chart_artist_targets_v1.json

      - name: Run live Melon Genie candidate discovery
        working-directory: scripts/fandex-cloud-migration/source
        run: python music_chart_discover_artist_candidates_v2.py

      - name: Validate discovery output
        working-directory: scripts/fandex-cloud-migration/source
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('music_chart_artist_candidates_v2_raw_latest.json').read_text(encoding='utf-8'))
          assert d['targetArtistCount'] == 355
          assert len(d['targetCanonicalArtistIds']) == 355
          assert len(set(d['targetCanonicalArtistIds'])) == 355
          assert d['seedModified'] is False
          assert d['websiteModified'] is False
          assert d['candidateCount'] == len(d['candidates'])
          assert d['identityAmbiguityCount'] == len(d['identityAmbiguities'])
          assert all(row.get('canonicalArtistId') for row in d['candidates'])
          print(
              'PASS: Music full355 live discovery | '
              f"candidates={d['candidateCount']} | "
              f"ambiguities={d['identityAmbiguityCount']} | "
              f"sources={d['sourceCounts']}"
          )
          PY

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artist-expansion-music-full355-candidates-v1
          path: |
            music_chart_artist_targets_355_candidate_v1.json
            scripts/fandex-cloud-migration/source/music_chart_artist_candidates_v2_raw_latest.json
            scripts/fandex-cloud-migration/source/music_chart_artist_candidates_v2_latest.csv
            scripts/fandex-cloud-migration/source/MUSIC_CHART_ARTIST_CANDIDATES_V2_REPORT_latest.txt
          if-no-files-found: ignore
          retention-days: 14
