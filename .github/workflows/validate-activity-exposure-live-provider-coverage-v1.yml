name: Validate Activity Exposure live provider coverage v1

on:
  workflow_dispatch:
  push:
    branches:
      - validation/activity-exposure-live-provider-coverage-v1
    paths:
      - scripts/validation/activityExposureLiveProviderCoverageV1.ts
      - .github/workflows/validate-activity-exposure-live-provider-coverage-v1.yml

permissions:
  contents: read

jobs:
  live-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      GOOGLE_YOUTUBE_API_KEY: ${{ secrets.GOOGLE_YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Credential preflight
        shell: bash
        run: |
          if [[ -n "${YOUTUBE_API_KEY}" || -n "${YOUTUBE_DATA_API_KEY}" || -n "${GOOGLE_YOUTUBE_API_KEY}" ]]; then
            echo "AUTHORIZED_YOUTUBE_CREDENTIAL_AVAILABLE=true"
          else
            echo "AUTHORIZED_YOUTUBE_CREDENTIAL_AVAILABLE=false"
          fi
      - name: Execute live provider coverage gate
        run: npx tsx scripts/validation/activityExposureLiveProviderCoverageV1.ts
      - name: Upload live coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-exposure-live-provider-coverage-v1
          path: |
            activity-exposure-live-provider-coverage-v1.json
            activity-exposure-live-provider-coverage-v1.md
          if-no-files-found: error
          retention-days: 7
      - name: Enforce live provider coverage gate
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(
            fs.readFileSync('activity-exposure-live-provider-coverage-v1.json', 'utf8')
          );
          console.log('LIVE_PROVIDER_COVERAGE_GATE=' + report.liveCoverageGate);
          console.log('MUSICBRAINZ_STATE=' + report.musicbrainz.state);
          console.log('YOUTUBE_STATE=' + report.youtube.state);
          if (report.liveCoverageGate !== 'PASS_WITH_TRUTHFUL_PROVIDER_COVERAGE') {
            process.exit(1);
          }
          NODE
