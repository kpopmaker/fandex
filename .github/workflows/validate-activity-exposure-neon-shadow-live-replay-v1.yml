name: Validate Activity Exposure Neon shadow replay v1

on:
  push:
    branches:
      - validation/activity-exposure-neon-shadow-live-replay-v1

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FANDEX_RUNTIME_DATABASE_URL: ${{ secrets.FANDEX_RUNTIME_DATABASE_URL }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Secret preflight without value disclosure
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${FANDEX_RUNTIME_DATABASE_URL}" ]]; then
            echo "FANDEX_RUNTIME_DATABASE_URL_AVAILABLE=true"
          else
            echo "FANDEX_RUNTIME_DATABASE_URL_AVAILABLE=false"
            exit 1
          fi
          if [[ -n "${YOUTUBE_API_KEY}" ]]; then
            echo "YOUTUBE_API_KEY_AVAILABLE=true"
          else
            echo "YOUTUBE_API_KEY_AVAILABLE=false"
            exit 1
          fi
      - name: Execute one Neon Shadow replay
        run: npx tsx scripts/validation/activityExposureNeonShadowReplayV1.ts
      - name: Upload bounded replay report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-exposure-neon-shadow-replay-v1
          path: activity-exposure-neon-shadow-replay-v1.json
          if-no-files-found: warn
          retention-days: 7
