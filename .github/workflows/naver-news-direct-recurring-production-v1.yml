name: NAVER News direct recurring Production v1

on:
  workflow_dispatch:
    inputs:
      execution_approval:
        description: 'Separate Production approval: type approved-github-actions-direct-v1'
        required: true
        default: 'NO'

permissions:
  contents: read

concurrency:
  group: fandex-naver-news-direct-recurring-production-v1
  cancel-in-progress: false

jobs:
  direct:
    if: >-
      github.repository == 'kpopmaker/fandex' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'workflow_dispatch' &&
      github.run_attempt == 1 &&
      inputs.execution_approval == 'approved-github-actions-direct-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FANDEX_NAVER_DIRECT_RECURRING_EXECUTION_APPROVAL: ${{ inputs.execution_approval }}
      FANDEX_NAVER_NEWS_RECURRING_ENABLED: approved-v128-recurring-foundation
      FANDEX_NAVER_NEWS_RECURRING_DEPLOYMENT: production
      FANDEX_NAVER_NEWS_RECURRING_QUERY: 아이유 IU
      FANDEX_NAVER_NEWS_RECURRING_DISPLAY: '100'
      FANDEX_NAVER_NEWS_SCHEDULER_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_SCHEDULER_SECRET }}
      FANDEX_NAVER_NEWS_API_ENDPOINT: https://openapi.naver.com/v1/search/news.json
      FANDEX_NAVER_NEWS_CLIENT_ID: ${{ secrets.FANDEX_NAVER_NEWS_CLIENT_ID }}
      FANDEX_NAVER_NEWS_CLIENT_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_CLIENT_SECRET }}
      FANDEX_RUNTIME_DATABASE_URL: ${{ secrets.FANDEX_RUNTIME_DATABASE_URL }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Guard required secret bindings
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FANDEX_NAVER_NEWS_SCHEDULER_SECRET"
          test -n "$FANDEX_NAVER_NEWS_CLIENT_ID"
          test -n "$FANDEX_NAVER_NEWS_CLIENT_SECRET"
          test -n "$FANDEX_RUNTIME_DATABASE_URL"

      - run: npm ci

      - name: Execute one direct recurring slot
        run: npx tsx scripts/ingestion/run-naver-news-recurring-direct-v1.mts

      - name: Safety boundary
        if: always()
        run: |
          echo "schedulerImmediateRetries=0"
          echo "parallelDispatches=0"
          echo "blobMirrorMode=disabled-in-direct-v1"
