name: OPS Dispatch NAVER Production Blob read verification 2026-09-29 v2

on:
  push:
    branches:
      - ops/invoke-naver-production-blob-read-verification-20260929-v2

permissions:
  contents: read
  actions: write

jobs:
  dispatch-once:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Exact main guard
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_MAIN_SHA: 7e1b71e01b39394bc346408f0bde8bc8f2b4635d
        run: |
          set -euo pipefail
          actual=$(curl -fsSL             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/kpopmaker/fandex/branches/main"             | jq -r '.commit.sha')
          echo "FANDEX_CURRENT_MAIN_SHA=$actual"
          test "$actual" = "$EXPECTED_MAIN_SHA"

      - name: Dispatch approved Production Blob read probe exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/dispatch-response.txt -w '%{http_code}'             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/kpopmaker/fandex/actions/workflows/verify-naver-production-blob-read-v1.yml/dispatches"             --data '{"ref":"main","inputs":{"execution_approval":"ops-naver-blob-read-verification-20260929-v1"}}')
          echo "FANDEX_PROBE_DISPATCH_HTTP=$code"
          test "$code" = "204"
          echo "FANDEX_PROBE_DISPATCH_COUNT=1"
