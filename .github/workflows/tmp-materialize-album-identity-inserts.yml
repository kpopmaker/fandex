name: Temporary Album Identity Insert Materializer

on:
  push:
    branches:
      - research/musicbrainz-album-catalog-v1

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/ingestion/tmp-materialize-album-identity-inserts.mts
      - name: Commit generated batches
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .tmp-album-identity-batches
          git diff --cached --quiet && exit 0
          git commit -m "ci: materialize album identity insert batches"
          git push
