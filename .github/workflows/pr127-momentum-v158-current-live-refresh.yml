name: PR127 momentum v158 current provenance gate

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - 'lib/intelligence/fandexMomentumProvenanceGatedRefreshResearch.ts'
      - 'tests/fandex-momentum-provenance-gated-refresh-v158.test.mts'
      - '.github/workflows/pr127-momentum-v158-current-live-refresh.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Evaluate current IU source through provenance gate
        run: |
          cat > .tmp-v158-current.mts <<'TS'
          import {
            evaluateFandexMomentumSourceProvenanceResearch,
          } from './lib/intelligence/fandexMomentumSourceProvenanceResearch';
          import {
            evaluateFandexMomentumProvenanceGatedRefreshResearch,
          } from './lib/intelligence/fandexMomentumProvenanceGatedRefreshResearch';

          const provenance = evaluateFandexMomentumSourceProvenanceResearch({
            snapshot: {
              canonicalArtistId: 'iu',
              naverEvidenceId: 'dae0750b1ad81f468f479328ef726e6344eaa31a62246cce3e4aeebc5d9a3f7d',
              naverCollectionKey: 'sched-v125-naver-news-20260921t000000z-f1ed381d367d',
              naverThroughSlotStart: '2026-09-21T00:00:00.000Z',
              naverStatus: 'succeeded',
              naverRawEvidenceCount: 100,
              naverNormalizedRecordCount: 100,
              naverDuplicateRecordCount: 0,
              naverRejectedItemCount: 0,
            },
            runtimeObservation: {
              observedAt: '2026-09-21T00:02:01.000Z',
              requestPath: '/api/internal/naver-news/shadow-scheduler',
              httpStatus: 200,
              deploymentId: 'dpl_6fmT3qKqeytud3kFCNVoArBGGK1K',
              branch: 'main',
            },
            storedEvidenceReproducedThisEvaluation: false,
          });

          let preflightCalls = 0;
          const result = evaluateFandexMomentumProvenanceGatedRefreshResearch({
            provenance,
            manifestJsonl: '',
            historyJsonl: '',
            watermarkJsonl: '',
            result: {
              contractVersion: 'v143_fandex_momentum_output_form_eligibility_research_v1',
              sourceContractVersion: 'v142_fandex_momentum_cross_family_combination_research_v1',
              state: 'categorical-research-output-only',
              canonicalArtistId: 'iu',
              alignmentCutoffAt: '2026-09-20T01:59:13.000Z',
              currentResearchOutput: {
                outputForm: 'structured-categorical-evidence',
                directionalConsensus: 'direction-conflicted',
                persistenceConsensus: 'persistence-not-applicable',
                qualitativeDirectionEvidenceUsable: false,
                levelPercentileSpreadDiagnostic: 100,
                productMomentumScore: null,
              },
              numericEligibility: {
                status: 'not-eligible',
                unmetRequirements: [],
                numericEstimand: null,
                calibrationTarget: null,
                mappingOrWeights: null,
                outOfSampleValidation: null,
                additionalFamiliesAloneSufficient: false,
                legacyPreviewSeedCalibrationAllowed: false,
              },
              currentProductSchema: {
                metricValueKind: 'number-or-null',
                weightedScoreRequiresNumericValue: true,
                currentMomentumSourceStage: 'derived_signal',
                currentMomentumQualityLabel: 'preview',
                previewFallbackEnabled: true,
                previewFallbackExample: null,
                categoricalEvidenceFitsCurrentMomentumSlot: false,
              },
              researchCarrier: {
                observationContractVersion: 'fandex-observation-v1',
                categoricalRawValueSupported: true,
                recommendedVariableId: 'momentum.cross-family-evidence-state.research',
                registryBindingEstablished: false,
                productMetricBindingEstablished: false,
              },
              blockers: [],
              digest: '8'.repeat(64),
              effects: {
                externalCalls: 0,
                databaseReads: 0,
                databaseWrites: 0,
                masterScoreWrites: 0,
                websiteWrites: 0,
              },
            },
            sourceEvidence: {
              lastfmEvidenceId: '723cf73abb93882779edc0621a12381ab80e464c',
              lastfmLatestComponentEndAt: '2026-09-20T01:59:13.000Z',
              naverEvidenceId: 'dae0750b1ad81f468f479328ef726e6344eaa31a62246cce3e4aeebc5d9a3f7d',
              naverThroughSlotStart: '2026-09-21T00:00:00.000Z',
            },
            evaluatedAt: '2026-09-21T00:24:00.000Z',
            recordedAt: '2026-09-21T00:24:00.000Z',
            manifestedAt: '2026-09-21T00:24:00.000Z',
          }, {
            evaluatePreflight: (() => {
              preflightCalls += 1;
              throw new Error('preflight_must_not_run_without_live_stored_read');
            }) as any,
          });

          if (provenance.state !== 'lineage-runtime-verified-stored-evidence-not-reproduced') {
            throw new Error('unexpected provenance state');
          }
          if (provenance.futureLiveRefreshEligible) {
            throw new Error('unreproduced evidence cannot be live-refresh eligible');
          }
          if (preflightCalls !== 0) throw new Error('v155 was invoked while provenance blocked');
          if (result.state !== 'provenance-blocked') throw new Error('v158 did not block');
          if (result.preflightInvoked) throw new Error('blocked refresh invoked preflight');
          if (result.readyForPhysicalPersistence) throw new Error('blocked refresh became persistence-ready');
          if (!result.blockers.includes('live-stored-evidence-provenance-required')) {
            throw new Error('missing provenance blocker');
          }

          console.log(JSON.stringify({
            source: {
              naverEvidenceId: provenance.naverEvidenceId,
              naverThroughSlotStart: provenance.naverThroughSlotStart,
            },
            runtime: {
              observedAt: '2026-09-21T00:02:01.000Z',
              requestPath: '/api/internal/naver-news/shadow-scheduler',
              httpStatus: 200,
              deploymentId: 'dpl_6fmT3qKqeytud3kFCNVoArBGGK1K',
              branch: 'main',
            },
            provenance: {
              state: provenance.state,
              storedEvidenceReproducedThisEvaluation:
                provenance.storedEvidenceReproducedThisEvaluation,
              futureLiveRefreshEligible: provenance.futureLiveRefreshEligible,
              blockers: provenance.blockers,
              digest: provenance.digest,
            },
            v158: {
              state: result.state,
              sourceEvidenceMatched: result.sourceEvidenceMatched,
              preflightInvoked: result.preflightInvoked,
              readyForPhysicalPersistence: result.readyForPhysicalPersistence,
              blockers: result.blockers,
              effects: result.effects,
              digest: result.digest,
            },
          }, null, 2));
          TS
          npx tsx --conditions=react-server .tmp-v158-current.mts
          rm .tmp-v158-current.mts
      - name: Run v158 and provenance regressions
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-provenance-gated-refresh-v158.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-source-provenance-v153.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-partial-persistence-recovery-v157.test.mts
          npm run typecheck
          git diff --check
