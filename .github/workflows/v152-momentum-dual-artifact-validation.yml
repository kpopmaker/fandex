name: v152 momentum dual-artifact validation

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - 'lib/intelligence/fandexMomentumDualArtifactCoordinatorResearch.ts'
      - 'tests/fandex-momentum-dual-artifact-coordinator-v152.test.mts'
      - '.github/workflows/v152-momentum-dual-artifact-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: v152 regression
        run: npx tsx --test tests/fandex-momentum-dual-artifact-coordinator-v152.test.mts tests/fandex-momentum-evaluation-watermark-v151.test.mts tests/fandex-momentum-common-cutoff-advancement-v150.test.mts tests/fandex-momentum-append-from-artifact-v148.test.mts tests/fandex-momentum-unified-history-v147.test.mts
      - name: typecheck
        run: npm run typecheck
      - name: diff check
        run: git diff --check
