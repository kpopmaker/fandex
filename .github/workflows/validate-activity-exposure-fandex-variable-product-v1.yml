name: Validate comebackActivityPoint common Product adapter v1

on:
  pull_request:
    paths:
      - 'lib/product/adapters/activityExposureFandexVariableProduct.ts'
      - 'lib/product/adapters/activityExposureRiskQualityMetadata.ts'
      - 'lib/product/contracts/fandexVariableProduct.ts'
      - 'lib/product/contracts/productActivityExposure.ts'
      - 'lib/product/contracts/productActivityExposurePublicRoute.ts'
      - 'tests/activity-exposure-fandex-variable-product-v1.test.mts'
      - '.github/workflows/validate-activity-exposure-fandex-variable-product-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/activity-exposure-fandex-variable-product-v1.test.mts tests/activity-exposure-risk-quality-metadata-v1.test.mts tests/fandex-variable-product-contract-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
