name: Validate snsFandom v2 final activation revision v1

on:
  push:
    branches:
      - 'work/sns-fandom-v2-final-activation-revision-v1'
    paths:
      - '.github/workflows/execute-sns-fandom-youtube-recurring-measurement-v1.yml'
      - '.github/workflows/execute-sns-fandom-youtube-v2-render-trigger-v1.yml'
      - 'docs/research/sns-fandom-youtube-v2-cutover-runtime-readiness-v1.json'
      - 'docs/research/sns-fandom-youtube-v2-final-activation-revision-v1.json'
      - 'lib/intelligence/snsFandomPointYoutubeV2CutoverApprovalEvidenceV1.ts'
      - 'scripts/operations/snsFandomYoutubeV2CutoverApprovalEvidenceVerifierV1.ts'
      - 'tests/sns-fandom-youtube-v2-cutover-runtime-readiness-v1.test.mts'
      - 'tests/sns-fandom-youtube-v2-cutover-approval-evidence-v1.test.mts'
      - 'tests/sns-fandom-youtube-v2-final-activation-revision-v1.test.mts'
      - '.github/workflows/validate-sns-fandom-v2-final-activation-revision-v1.yml'
  pull_request:
    paths:
      - '.github/workflows/execute-sns-fandom-youtube-recurring-measurement-v1.yml'
      - '.github/workflows/execute-sns-fandom-youtube-v2-render-trigger-v1.yml'
      - 'docs/research/sns-fandom-youtube-v2-cutover-runtime-readiness-v1.json'
      - 'docs/research/sns-fandom-youtube-v2-final-activation-revision-v1.json'
      - 'lib/intelligence/snsFandomPointYoutubeV2CutoverApprovalEvidenceV1.ts'
      - 'scripts/operations/snsFandomYoutubeV2CutoverApprovalEvidenceVerifierV1.ts'
      - 'tests/sns-fandom-youtube-v2-cutover-runtime-readiness-v1.test.mts'
      - 'tests/sns-fandom-youtube-v2-cutover-approval-evidence-v1.test.mts'
      - 'tests/sns-fandom-youtube-v2-final-activation-revision-v1.test.mts'
      - '.github/workflows/validate-sns-fandom-v2-final-activation-revision-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Final activation revision contract
        run: npx tsx --test tests/sns-fandom-youtube-v2-final-activation-revision-v1.test.mts

      - name: Cutover readiness and v1 suppression regressions
        run: npx tsx --test tests/sns-fandom-youtube-v2-cutover-runtime-readiness-v1.test.mts

      - name: Exact-revision owner approval evidence regressions
        run: npx tsx --test tests/sns-fandom-youtube-v2-cutover-approval-evidence-v1.test.mts

      - name: V2 activated runtime regressions
        run: npx tsx --test tests/sns-fandom-youtube-recurring-activated-runtime-v2.test.mts

      - name: Existing v1 runtime regression
        run: npx tsx --test tests/sns-fandom-youtube-recurring-activated-runtime-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - name: Safety boundary
        if: always()
        run: |
          echo "finalActivationRevisionPrepared=true"
          echo "ownerApprovalDurable=false"
          echo "renderDispatchMutationPerformed=false"
          echo "v2ProviderCalls=0"
          echo "v2CanonicalWindowMaterialized=false"
          echo "historicalV1ReceiptsReinterpreted=false"
          echo "providerSubmissionAuthorized=false"
          echo "productionCollectionAuthorized=false"
          echo "productActivationAuthorized=false"
