name: temp-hanteo-album-sales-live-probe

on:
  push:
    branches:
      - research/musicbrainz-album-catalog-v1
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute exactly one Hanteo schema probe
        run: npm run ingestion:hanteo:research-album-sales-provider
