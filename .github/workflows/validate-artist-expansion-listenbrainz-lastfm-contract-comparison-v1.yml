name: Validate Artist Expansion ListenBrainz Last.fm contract comparison v1

on:
  push:
    branches:
      - evidence/artist-expansion-listenbrainz-lastfm-contract-comparison-v1

permissions:
  contents: read

jobs:
  validate-provider-contract-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Last.fm vs ListenBrainz contract comparison
        run: python tests/artist-expansion-listenbrainz-lastfm-contract-comparison-v1.py
