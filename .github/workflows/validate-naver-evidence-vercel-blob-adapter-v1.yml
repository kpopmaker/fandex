name: Validate NAVER evidence Vercel Blob adapter v1

on:
  push:
    branches:
      - integration/naver-evidence-vercel-blob-adapter-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.head_ref == 'integration/naver-evidence-vercel-blob-adapter-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        run: |
          git diff --name-only c4c1ac8191669a760d68091647ebac57a41d71c0...HEAD | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/validate-naver-evidence-vercel-blob-adapter-v1.yml
          data/momentum-product/iu_momentum_vercel_blob_private_adapter_candidate_v1.json
          lib/server/storage/vercelBlobImmutableTextObjectStore.ts
          tests/momentum-vercel-blob-private-adapter-candidate-v1.test.mts
          tests/naver-evidence-vercel-blob-adapter-v1.test.mts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Vercel Blob adapter regression
        run: npx tsx --test tests/naver-evidence-vercel-blob-adapter-v1.test.mts

      - name: Adapter candidate evidence regression
        run: npx tsx --test tests/momentum-vercel-blob-private-adapter-candidate-v1.test.mts

      - name: Existing object mirror regression
        run: npx tsx --test tests/naver-news-stored-evidence-mirror-v1.test.mts

      - name: Existing canonical evidence regression
        run: npx tsx --test tests/naver-news-canonical-job-evidence-v130.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
