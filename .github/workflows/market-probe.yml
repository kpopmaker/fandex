name: FANDEX market probe

# 일회성 점검용(멜론 접근, 과거 데이터 범위). 결과는 probe 브랜치의 report.json.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe
        shell: bash
        env:
          FANDEX_NAVER_NEWS_CLIENT_ID: ${{ secrets.FANDEX_NAVER_NEWS_CLIENT_ID }}
          FANDEX_NAVER_NEWS_CLIENT_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_CLIENT_SECRET }}
          NODE_OPTIONS: --use-system-ca
        run: |
          set -euo pipefail
          OUT_DIR=probe-out npx --yes tsx@4.23.12 scripts/market/probe.ts
          cd probe-out
          git init -q -b probe
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "probe $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe:probe
