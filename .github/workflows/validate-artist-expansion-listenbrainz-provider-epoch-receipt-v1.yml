name: Validate Artist Expansion ListenBrainz provider epoch receipt v1

on:
  push:
    branches:
      - evidence/artist-expansion-listenbrainz-provider-epoch-v1

permissions:
  contents: read

jobs:
  validate-provider-epoch-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate provider epoch receipt
        run: python tests/artist-expansion-listenbrainz-provider-epoch-probe-v1.py
