name: TMP PR127 v167 Secret Attestation Presence

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - .github/workflows/tmp-pr127-v167-secret-attestation-presence.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      MOMENTUM_SECRET: ${{ secrets.FANDEX_MOMENTUM_NATIVE_VERIFIER_SECRET }}
      SCHEDULER_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_SCHEDULER_SECRET }}
    steps:
      - name: Check trusted secret inputs without exposing values
        shell: bash
        run: |
          set -euo pipefail

          vercel_present=false
          momentum_present=false
          scheduler_present=false
          momentum_contract=false
          non_equal=false

          if [ -n "${VERCEL_TOKEN:-}" ]; then vercel_present=true; fi
          if [ -n "${MOMENTUM_SECRET:-}" ]; then momentum_present=true; fi
          if [ -n "${SCHEDULER_SECRET:-}" ]; then scheduler_present=true; fi

          if [ "$momentum_present" = true ]; then
            export MOMENTUM_SECRET
            if node <<'NODE'
          const s = process.env.MOMENTUM_SECRET ?? '';
          const bytes = Buffer.byteLength(s, 'utf8');
          if (s.length < 24 || bytes > 512 || /[\s\u0000-\u001f\u007f]/.test(s)) {
            process.exit(1);
          }
          NODE
            then momentum_contract=true; fi
          fi

          if [ "$momentum_present" = true ] && [ "$scheduler_present" = true ]; then
            if [ "$MOMENTUM_SECRET" != "$SCHEDULER_SECRET" ]; then non_equal=true; fi
          fi

          echo "VERCEL_TOKEN_PRESENT=$vercel_present"
          echo "MOMENTUM_SECRET_PRESENT=$momentum_present"
          echo "SCHEDULER_SECRET_PRESENT=$scheduler_present"
          echo "MOMENTUM_SECRET_CONTRACT_SATISFIED=$momentum_contract"
          echo "MOMENTUM_DIFFERS_FROM_SCHEDULER=$non_equal"
          echo "No secret values were printed."
