name: Validate snsFandom recurring measurement runner v1

on:
  push:
    branches:
      - 'work/sns-fandom-recurring-measurement-runner-v1'
    paths:
      - 'lib/intelligence/snsFandomPointYoutubeRecurringMeasurement.ts'
      - 'scripts/operations/snsFandomYoutubeRecurringMeasurementRunnerV1.ts'
      - 'tests/sns-fandom-youtube-recurring-measurement-runner-v1.test.mts'
      - 'docs/research/sns-fandom-youtube-recurring-measurement-activation-v1.json'
      - 'docs/research/sns-fandom-youtube-api-audit-packet-v1.md'
      - '.github/workflows/validate-sns-fandom-youtube-recurring-measurement-runner-v1.yml'
  pull_request:
    paths:
      - 'lib/intelligence/snsFandomPointYoutubeRecurringMeasurement.ts'
      - 'scripts/operations/snsFandomYoutubeRecurringMeasurementRunnerV1.ts'
      - 'tests/sns-fandom-youtube-recurring-measurement-runner-v1.test.mts'
      - 'docs/research/sns-fandom-youtube-recurring-measurement-activation-v1.json'
      - 'docs/research/sns-fandom-youtube-api-audit-packet-v1.md'
      - '.github/workflows/validate-sns-fandom-youtube-recurring-measurement-runner-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Recurring runner regressions
        run: npx tsx --test tests/sns-fandom-youtube-recurring-measurement-runner-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
