name: Validate NAVER Blob hourly trigger candidate v1

on:
  pull_request:
    paths:
      - '.github/workflows/naver-news-blob-only-recurring-production-v1.yml'
      - '.github/workflows/validate-naver-blob-hourly-trigger-candidate-v1.yml'
      - 'tests/naver-news-blob-only-direct-v1.test.mts'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Assert dormant hourly trigger contract
        env:
          BLOB_HOURLY_TRIGGER_GATE: ${{ vars.FANDEX_NAVER_BLOB_ONLY_RECURRING_TRIGGER_ENABLED }}
        shell: bash
        run: |
          set -euo pipefail
          test "$BLOB_HOURLY_TRIGGER_GATE" != "approved-github-hourly-blob-v1"

          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync(
            '.github/workflows/naver-news-blob-only-recurring-production-v1.yml',
            'utf8',
          );
          const required = [
            "cron: '17 * * * *'",
            "vars.FANDEX_NAVER_BLOB_ONLY_RECURRING_TRIGGER_ENABLED == 'approved-github-hourly-blob-v1'",
            "github.event_name == 'schedule'",
            "github.event_name == 'workflow_dispatch'",
            "approved-github-actions-blob-only-recurring-v1",
            "schedulerManifestFinalized !== true",
            "databaseWrites=0",
            "productActivations=0",
          ];
          for (const token of required) {
            if (!source.includes(token)) {
              console.error('missing_contract_token:' + token);
              process.exit(2);
            }
          }
          console.log('FANDEX_NAVER_BLOB_HOURLY_TRIGGER_CANDIDATE=valid');
          console.log('FANDEX_NAVER_BLOB_HOURLY_TRIGGER_GATE_ACTIVE=false');
          console.log('productionRequests=0');
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Recurring runner regression
        run: npx tsx --test tests/naver-news-blob-only-direct-v1.test.mts
