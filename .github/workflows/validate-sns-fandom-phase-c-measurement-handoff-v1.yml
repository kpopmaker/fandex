name: Validate snsFandom Phase C measurement handoff v1

on:
  push:
    branches:
      - 'work/sns-fandom-phase-c-measurement-handoff-decouple-v1'
    paths:
      - 'lib/intelligence/snsFandomPointYoutubeQuotaMeasurementHandoff.ts'
      - 'lib/intelligence/snsFandomPointYoutubeQuotaWorksheet.ts'
      - 'tests/sns-fandom-point-youtube-quota-measurement-handoff-v1.test.mts'
      - 'tests/sns-fandom-point-youtube-quota-worksheet-v1.test.mts'
      - 'docs/research/sns-fandom-youtube-api-audit-packet-v1.md'
      - '.github/workflows/validate-sns-fandom-phase-c-measurement-handoff-v1.yml'
  pull_request:
    paths:
      - 'lib/intelligence/snsFandomPointYoutubeQuotaMeasurementHandoff.ts'
      - 'lib/intelligence/snsFandomPointYoutubeQuotaWorksheet.ts'
      - 'tests/sns-fandom-point-youtube-quota-measurement-handoff-v1.test.mts'
      - 'tests/sns-fandom-point-youtube-quota-worksheet-v1.test.mts'
      - 'docs/research/sns-fandom-youtube-api-audit-packet-v1.md'
      - '.github/workflows/validate-sns-fandom-phase-c-measurement-handoff-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Phase C measurement handoff regression
        run: >-
          npx tsx --test
          tests/sns-fandom-point-youtube-quota-measurement-handoff-v1.test.mts
          tests/sns-fandom-point-youtube-quota-worksheet-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
