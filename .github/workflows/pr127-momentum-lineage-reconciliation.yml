name: PR127 momentum lineage reconciliation

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - 'lib/intelligence/fandexMomentumVerifierConfigurationEvidenceResearch.ts'
      - 'tests/fandex-momentum-verifier-configuration-evidence-v164.test.mts'
      - 'lib/intelligence/fandexMomentumVerifierVercelInventoryExecutionEnvelopeResearch.ts'
      - 'tests/fandex-momentum-verifier-vercel-inventory-execution-envelope-v173.test.mts'
      - '.github/workflows/pr127-momentum-lineage-reconciliation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate v164 through v181 lineage
        run: |
          for test_file in             tests/fandex-momentum-verifier-configuration-evidence-v164.test.mts             tests/fandex-momentum-verifier-provisioning-authorization-plan-v165.test.mts             tests/fandex-momentum-verifier-configuration-authorization-v166.test.mts             tests/fandex-momentum-verifier-configuration-mutation-execution-guard-v167.test.mts             tests/fandex-momentum-verifier-vercel-mutation-dry-run-v168.test.mts             tests/fandex-momentum-verifier-premutation-rollback-readiness-v169.test.mts             tests/fandex-momentum-verifier-vercel-inventory-adapter-v170.test.mts             tests/fandex-momentum-verifier-vercel-inventory-acquisition-v171.test.mts             tests/fandex-momentum-verifier-vercel-inventory-read-channel-plan-v172.test.mts             tests/fandex-momentum-verifier-vercel-inventory-execution-envelope-v173.test.mts             tests/fandex-momentum-verifier-vercel-inventory-execution-receipt-v174.test.mts             tests/fandex-momentum-verifier-real-inventory-acquisition-readiness-v175.test.mts             tests/fandex-momentum-verifier-inventory-operator-handoff-v176.test.mts             tests/fandex-momentum-verifier-operator-response-intake-v177.test.mts             tests/fandex-momentum-verifier-operator-response-projection-v178.test.mts             tests/fandex-momentum-verifier-external-inventory-execution-response-intake-v179.test.mts             tests/fandex-momentum-verifier-external-execution-channel-resolution-v180.test.mts             tests/fandex-momentum-verifier-external-capability-resume-gate-v181.test.mts
          do
            npx tsx --conditions=react-server --test "$test_file"
          done
          npm run typecheck
          git diff --check
          git diff --check origin/main...HEAD
