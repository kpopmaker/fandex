name: Validate NAVER Blob-only direct Production v1

on:
  push:
    branches:
      - integration/ops-naver-github-blob-direct-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event_name == 'push' ||
      github.head_ref == 'integration/ops-naver-github-blob-direct-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch origin "+refs/heads/main:refs/remotes/origin/main"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            MERGE_BASE="$(git merge-base refs/remotes/origin/main "$PR_HEAD_SHA")"
            git diff --name-only "$MERGE_BASE...$PR_HEAD_SHA" | sort > /tmp/changed.txt
          else
            MERGE_BASE="$(git merge-base refs/remotes/origin/main HEAD)"
            git diff --name-only "$MERGE_BASE...HEAD" | sort > /tmp/changed.txt
          fi
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/naver-news-blob-only-direct-production-v1.yml
          .github/workflows/validate-naver-blob-only-direct-v1.yml
          scripts/ingestion/run-naver-news-blob-only-direct-v1.ts
          tests/naver-news-blob-only-direct-v1.test.mts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Direct Blob-only runner regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/naver-news-blob-only-direct-v1.test.mts

      - name: Existing Blob-only source regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: >-
          npx tsx --test
          tests/naver-news-blob-only-collection-stage-v1.test.mts
          tests/naver-evidence-vercel-blob-adapter-v1.test.mts
          tests/naver-news-stored-evidence-mirror-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
