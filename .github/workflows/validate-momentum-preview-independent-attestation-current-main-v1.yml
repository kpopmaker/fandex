name: Validate Momentum preview-independent attestation current main v1

on:
  push:
    branches:
      - work/momentum-preview-independent-attestation-current-main-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.head_ref == 'work/momentum-preview-independent-attestation-current-main-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git diff --name-only "$PR_BASE_SHA...$PR_HEAD_SHA" | sort > /tmp/changed.txt
          else
            git diff --name-only fe69d558cf720fb0aa761e207773055e9dc9e69e...HEAD | sort > /tmp/changed.txt
          fi
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/validate-momentum-preview-independent-attestation-current-main-v1.yml
          lib/intelligence/fandexMomentumCategoricalOutputAttestation.ts
          tests/momentum-categorical-output-attestation-current-main-v1.test.mts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Preview-independent categorical attestation regression
        run: npx tsx --test tests/momentum-categorical-output-attestation-current-main-v1.test.mts

      - name: Existing Momentum Product contract regression
        run: npx tsx --test tests/momentum-evidence-consensus-product-contract-v1.test.mts

      - name: Existing live-shadow readiness regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-live-shadow-product-readiness-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
