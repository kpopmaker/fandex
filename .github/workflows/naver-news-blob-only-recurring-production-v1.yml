name: FANDEX market collect (Render hourly trigger)

# Render 크론 `fandex-naver-hourly-external-trigger`가 매시 17분에 이 파일을 workflow_dispatch로 부른다.
# 예전 네이버 Blob 수집은 2026-11-07에 새 실데이터 수집기(market-collect.yml)로 교체했다.
# Render가 보내는 execution_approval 입력을 그대로 받아야 dispatch가 거부되지 않으므로 입력은 남겨 둔다.
on:
  workflow_dispatch:
    inputs:
      execution_approval:
        description: 'Render 크론이 보내는 값(쓰지 않음)'
        required: false
        default: 'render'

permissions:
  contents: write

jobs:
  collect:
    uses: ./.github/workflows/market-collect.yml
    with:
      loop_minutes: 44
    secrets: inherit
