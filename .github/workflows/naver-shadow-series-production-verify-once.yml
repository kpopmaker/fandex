name: NAVER Shadow Series Production Verify Once

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: contains(github.event.head_commit.message, '[shadow-series-runtime-verify]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require scheduler secret
        shell: bash
        env:
          FANDEX_NAVER_NEWS_SCHEDULER_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_SCHEDULER_SECRET }}
        run: |
          if [ -z "$FANDEX_NAVER_NEWS_SCHEDULER_SECRET" ]; then
            echo "Scheduler secret is not configured."
            exit 2
          fi

      - name: Invoke production read-only verifier
        shell: bash
        env:
          FANDEX_NAVER_NEWS_SCHEDULER_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_SCHEDULER_SECRET }}
        run: |
          set -euo pipefail
          url="https://fandex-eta.vercel.app/api/internal/naver-news/shadow-series-verifier"
          rm -f response.json
          for attempt in $(seq 1 30); do
            status=$(curl \
              --silent \
              --show-error \
              --output response.json \
              --write-out '%{http_code}' \
              --request POST \
              --header "Authorization: Bearer ${FANDEX_NAVER_NEWS_SCHEDULER_SECRET}" \
              --header 'Content-Type: application/json' \
              --data '{}' \
              --connect-timeout 10 \
              --max-time 30 \
              "$url" || true)
            if [ "$status" = "200" ]; then
              cat response.json
              exit 0
            fi
            if [ "$attempt" -lt 30 ]; then
              sleep 10
            fi
          done
          echo "Production verifier did not return HTTP 200 within the retry window."
          if [ -f response.json ]; then
            cat response.json
          fi
          exit 1
