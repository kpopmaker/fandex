name: Validate Artist Expansion ListenBrainz probe availability v1

on:
  push:
    branches:
      - evidence/artist-expansion-listenbrainz-probe-availability-v1

permissions:
  contents: read

jobs:
  validate-probe-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate partial provider probe handling
        run: python tests/artist-expansion-listenbrainz-probe-availability-v1.py
