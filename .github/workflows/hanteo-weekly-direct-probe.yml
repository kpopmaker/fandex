name: Hanteo Direct Contract Probe

on:
  push:
    branches:
      - integration/album-hanteo-direct-discovery

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Daily Monthly and historical page without early exit
        shell: bash
        run: |
          set -u

          daily_status=$(curl --silent --show-error --request GET \
            --header 'Accept: application/json' \
            --header 'Accept-Language: en' \
            --output daily-body.txt --write-out '%{http_code}' \
            'https://api.hanteochart.io/v4/ranking/list/ALBUM/DAILY/BASIC?limit=20' || echo '000')

          sleep 2

          monthly_status=$(curl --silent --show-error --request GET \
            --header 'Accept: application/json' \
            --header 'Accept-Language: en' \
            --output monthly-body.txt --write-out '%{http_code}' \
            'https://api.hanteochart.io/v4/ranking/list/ALBUM/MONTHLY/BASIC?limit=20' || echo '000')

          page_status=$(curl --silent --show-error \
            --output historical-page.html --write-out '%{http_code}' \
            'https://www.hanteochart.com/en/charts/album/weekly/2026-W30' || echo '000')

          DAILY_STATUS="$daily_status" MONTHLY_STATUS="$monthly_status" PAGE_STATUS="$page_status" node - <<'NODE'
          const fs=require('fs');
          function apiSummary(label,status){
            const path=`${label}-body.txt`;
            const raw=fs.existsSync(path)?fs.readFileSync(path,'utf8'):'';
            let parsed=null,parseError=null;
            try{parsed=JSON.parse(raw)}catch(e){parseError=String(e)}
            const list=parsed?.resultData?.list;
            const first=Array.isArray(list)&&list[0]&&typeof list[0]==='object'?list[0]:null;
            return {
              httpStatus:Number(status)||0,
              parseError,
              code:parsed?.code??null,
              message:parsed?.message??null,
              resultDatetime:parsed?.resultData?.resultDatetime??null,
              rowCount:Array.isArray(list)?list.length:null,
              firstRowKeys:first?Object.keys(first):[],
              firstDetailKeys:first?.detail&&typeof first.detail==='object'?Object.keys(first.detail):[],
              firstRow:first?{
                rank:first.rank??null,targetIdx:first.targetIdx??null,targetName:first.targetName??null,
                value:first.value??null,artistIdx:first.detail?.artistIdx??null,
                artistGlobalName:first.detail?.artistGlobalName??null,
                salesVolume:first.detail?.salesVolume??null,supplyPrice:first.detail?.supplyPrice??null,
                saleDate:first.detail?.saleDate??null,regDate:first.regDate??null
              }:null,
              bodyPrefix:raw.slice(0,500)
            };
          }
          const daily=apiSummary('daily',process.env.DAILY_STATUS);
          const monthly=apiSummary('monthly',process.env.MONTHLY_STATUS);
          fs.writeFileSync('daily-summary.json',JSON.stringify(daily,null,2));
          fs.writeFileSync('monthly-summary.json',JSON.stringify(monthly,null,2));

          const raw=fs.existsSync('historical-page.html')?fs.readFileSync('historical-page.html','utf8'):'';
          const scripts=[...raw.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>m[1]);
          const needles=['ranking/list','api.hanteochart','salesVolume','targetIdx','2026-W30','2026.07.20','resultDatetime'];
          const hits={};
          for(const n of needles){const i=raw.indexOf(n);hits[n]=i>=0?raw.slice(Math.max(0,i-180),Math.min(raw.length,i+420)):null;}
          const page={httpStatus:Number(process.env.PAGE_STATUS)||0,htmlLength:raw.length,scriptCount:scripts.length,scripts:scripts.slice(0,80),hits};
          fs.writeFileSync('historical-page-summary.json',JSON.stringify(page,null,2));
          console.log(JSON.stringify({daily,monthly,page},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hanteo-direct-contract-probe
          path: |
            daily-summary.json
            monthly-summary.json
            historical-page-summary.json
          retention-days: 1
