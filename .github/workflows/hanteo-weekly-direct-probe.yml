name: Hanteo Historical Selector Probe

on:
  push:
    branches:
      - integration/album-hanteo-direct-discovery

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public historical chart page chunk once
        shell: bash
        run: |
          set -euo pipefail
          base='https://www.hanteochart.com'
          chunk='/_next/static/chunks/app/%5Blocale%5D/charts/%5Bcategory%5D/%5Bterm%5D/%5Bperiod%5D/page-1803aea297a11422.js'
          curl --silent --show-error "$base$chunk" --output page-chunk.js
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('page-chunk.js','utf8');
          const needles=['ranking/list','api.hanteochart','resultDatetime','limit','period','WEEKLY','DAILY','MONTHLY','searchParams','issue','date','timestamp','ranking'];
          const hits={};
          for(const n of needles){
            const all=[]; let start=0;
            while(all.length<8){const i=raw.indexOf(n,start);if(i<0)break;all.push(raw.slice(Math.max(0,i-450),Math.min(raw.length,i+1000)));start=i+n.length;}
            hits[n]=all;
          }
          const urls=[...new Set([...raw.matchAll(/https?:\\?\/\\?\/[^"'`\\s)]+/g)].map(m=>m[0]))].slice(0,100);
          const out={length:raw.length,urls,hits};
          fs.writeFileSync('hanteo-historical-selector-hints.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify({length:out.length,urlCount:urls.length,hitCounts:Object.fromEntries(Object.entries(hits).map(([k,v])=>[k,v.length]))},null,2));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: hanteo-historical-selector-hints
          path: hanteo-historical-selector-hints.json
          retention-days: 1
