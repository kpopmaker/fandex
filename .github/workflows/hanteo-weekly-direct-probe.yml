name: Hanteo Direct Contract Probe

on:
  push:
    branches:
      - integration/album-hanteo-direct-discovery

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe Daily and Monthly once each plus historical page hints
        shell: bash
        run: |
          set -euo pipefail
          probe_api() {
            label="$1"
            url="$2"
            status=$(curl --silent --show-error \
              --request GET \
              --header 'Accept: application/json' \
              --header 'Accept-Language: en' \
              --dump-header "${label}-headers.txt" \
              --output "${label}-body.txt" \
              --write-out '%{http_code}' \
              "$url")
            LABEL="$label" HTTP_STATUS="$status" node - <<'NODE'
            const fs=require('fs');
            const label=process.env.LABEL;
            const httpStatus=Number(process.env.HTTP_STATUS);
            const raw=fs.readFileSync(`${label}-body.txt`,'utf8');
            let parsed=null, parseError=null;
            try{parsed=JSON.parse(raw)}catch(e){parseError=String(e)}
            const list=parsed?.resultData?.list;
            const first=Array.isArray(list)&&list[0]&&typeof list[0]==='object'?list[0]:null;
            const out={
              httpStatus,
              parseError,
              code:parsed?.code??null,
              message:parsed?.message??null,
              resultDatetime:parsed?.resultData?.resultDatetime??null,
              rowCount:Array.isArray(list)?list.length:null,
              firstRowKeys:first?Object.keys(first):[],
              firstDetailKeys:first?.detail&&typeof first.detail==='object'?Object.keys(first.detail):[],
              firstRow:first?{
                rank:first.rank??null,
                targetIdx:first.targetIdx??null,
                targetName:first.targetName??null,
                value:first.value??null,
                artistIdx:first.detail?.artistIdx??null,
                artistGlobalName:first.detail?.artistGlobalName??null,
                salesVolume:first.detail?.salesVolume??null,
                supplyPrice:first.detail?.supplyPrice??null,
                saleDate:first.detail?.saleDate??null,
                regDate:first.regDate??null
              }:null
            };
            fs.writeFileSync(`${label}-summary.json`,JSON.stringify(out,null,2));
            console.log(label,JSON.stringify(out));
            NODE
          }

          probe_api daily 'https://api.hanteochart.io/v4/ranking/list/ALBUM/DAILY/BASIC?limit=20'
          sleep 2
          probe_api monthly 'https://api.hanteochart.io/v4/ranking/list/ALBUM/MONTHLY/BASIC?limit=20'

          curl --silent --show-error \
            'https://www.hanteochart.com/en/charts/album/weekly/2026-W30' \
            --output historical-page.html

          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('historical-page.html','utf8');
          const scripts=[...raw.matchAll(/<script[^>]+src=["']([^"']+)["']/gi)].map(m=>m[1]);
          const needles=['ranking/list','api.hanteochart','salesVolume','targetIdx','2026-W30','2026.07.20','resultDatetime'];
          const hits={};
          for(const n of needles){
            const i=raw.indexOf(n);
            hits[n]=i>=0?raw.slice(Math.max(0,i-180),Math.min(raw.length,i+420)):null;
          }
          const out={htmlLength:raw.length,scriptCount:scripts.length,scripts:scripts.slice(0,80),hits};
          fs.writeFileSync('historical-page-summary.json',JSON.stringify(out,null,2));
          console.log(JSON.stringify(out));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: hanteo-direct-contract-probe
          path: |
            daily-summary.json
            monthly-summary.json
            historical-page-summary.json
          retention-days: 1
