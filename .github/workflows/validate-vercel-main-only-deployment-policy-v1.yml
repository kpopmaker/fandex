name: Validate Vercel main-only deployment policy v1

on:
  push:
    branches:
      - integration/ops-vercel-main-only-deploy-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event_name == 'push' ||
      github.head_ref == 'integration/ops-vercel-main-only-deploy-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "+refs/heads/main:refs/remotes/origin/main"
            MERGE_BASE="$(git merge-base refs/remotes/origin/main "$PR_HEAD_SHA")"
            git diff --name-only "$MERGE_BASE...$PR_HEAD_SHA" | sort > /tmp/changed.txt
          else
            git diff --name-only e8ad0ecab3731e2aed9ea54d7dea89519648865a...HEAD | sort > /tmp/changed.txt
          fi
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/validate-vercel-main-only-deployment-policy-v1.yml
          tests/vercel-main-only-git-deployment-policy-v1.test.mts
          vercel.json
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Deployment policy regression
        run: npx tsx --test tests/vercel-main-only-git-deployment-policy-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
