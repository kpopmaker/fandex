name: Validate NAVER recurring write runtime OIDC v1

on:
  push:
    branches:
      - integration/naver-recurring-write-runtime-oidc-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --conditions=react-server --import tsx --test tests/naver-news-shadow-recurring-activation-v1.test.mts tests/naver-news-recurring-scheduler-v128.test.mts tests/naver-news-production-write-v124.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
