name: Validate Momentum current dual-source evaluation v1

on:
  push:
    branches:
      - work/momentum-current-dual-source-evaluation-v1

permissions:
  contents: read

concurrency:
  group: momentum-current-dual-source-evaluation-v1
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        run: |
          git diff --name-only 8c766ce1c4706941cf16472b0a861dcdc4e6a497...HEAD | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/validate-momentum-current-dual-source-evaluation-v1.yml
          data/momentum-product/iu_momentum_current_dual_source_evaluation_v1.json
          data/momentum-product/iu_momentum_live_shadow_source_currentness_audit_v1.json
          lib/intelligence/fandexMomentumCrossFamilyCombinationResearch.ts
          lib/intelligence/fandexMomentumTemporalNormalizationResearch.ts
          lib/intelligence/fandexNaverMediaAttentionMomentumResearch.ts
          lib/lastfm-signal/contracts.ts
          lib/lastfm-signal/csv.ts
          lib/lastfm-signal/historicalReplaySourceBundle.ts
          lib/lastfm-signal/historicalWindow.ts
          lib/lastfm-signal/identityQualityGate.ts
          lib/lastfm-signal/readModel.ts
          lib/lastfm-signal/shadowVariableAdapter.ts
          lib/product/readiness/momentumLiveShadowProductReadiness.ts
          lib/server/product/momentumLiveShadowProductReadiness.ts
          scripts/research/momentumCurrentDualSourceEvaluationV1.mts
          tests/momentum-live-shadow-product-readiness-v1.test.mts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Static no-Product/no-write boundary
        run: |
          ! grep -R "getResolvedMetricScore\|artistMonthlyMetricSeed\|metricScoringPipeline" \
            scripts/research/momentumCurrentDualSourceEvaluationV1.mts \
            lib/intelligence/fandexNaverMediaAttentionMomentumResearch.ts \
            lib/intelligence/fandexMomentumTemporalNormalizationResearch.ts \
            lib/intelligence/fandexMomentumCrossFamilyCombinationResearch.ts \
            lib/lastfm-signal/historicalReplaySourceBundle.ts \
            lib/lastfm-signal/contracts.ts \
            lib/lastfm-signal/csv.ts \
            lib/lastfm-signal/readModel.ts \
            lib/lastfm-signal/identityQualityGate.ts \
            lib/lastfm-signal/historicalWindow.ts \
            lib/lastfm-signal/shadowVariableAdapter.ts
          ! grep -R "INSERT INTO\|UPDATE .* SET\|DELETE FROM" \
            scripts/research/momentumCurrentDualSourceEvaluationV1.mts
          grep -q "productMomentumScore: null" \
            lib/intelligence/fandexMomentumCrossFamilyCombinationResearch.ts

      - name: Recorded current evaluation evidence consistency
        run: |
          node - <<'NODE'
          const fs = require('node:fs');

          const evidence = JSON.parse(fs.readFileSync(
            'data/momentum-product/iu_momentum_current_dual_source_evaluation_v1.json',
            'utf8',
          ));
          const audit = JSON.parse(fs.readFileSync(
            'data/momentum-product/iu_momentum_live_shadow_source_currentness_audit_v1.json',
            'utf8',
          ));

          const expected = {
            main: '8c766ce1c4706941cf16472b0a861dcdc4e6a497',
            run: 36290882671,
            job: 108540600155,
            naverSlot: '2026-09-27T03:00:00.000Z',
            naverJob: '362b77504d31b89d9f9a5b66a1216c6adb59be376b2ae811d664f351929677f2',
            snapshots: 276,
            cutoff: '2026-09-27T02:10:05.000Z',
            direction: 'direction-conflicted',
            persistence: 'persistence-not-applicable',
            digest: '3ac534dd6afc2e75f534cf4bc98ce6fb33fdd22e081eaae9aedcf97a90fd6721',
            classification: 'new-carrier-cutoff-advanced-same-state',
          };

          if (evidence.evaluatedAgainstMain !== expected.main) process.exit(1);
          if (evidence.workflowRunId !== expected.run) process.exit(1);
          if (evidence.workflowJobId !== expected.job) process.exit(1);
          if (evidence.latestNaverStoredEvidence.throughSlotStart !== expected.naverSlot) process.exit(1);
          if (evidence.latestNaverStoredEvidence.jobId !== expected.naverJob) process.exit(1);
          if (evidence.latestNaverStoredEvidence.expectedSlotCount !== expected.snapshots) process.exit(1);
          if (evidence.latestNaverStoredEvidence.reproducedSnapshotCount !== expected.snapshots) process.exit(1);
          if (evidence.temporalNormalization.alignmentCutoffAt !== expected.cutoff) process.exit(1);
          if (evidence.categoricalEvaluation.alignmentCutoffAt !== expected.cutoff) process.exit(1);
          if (evidence.categoricalEvaluation.directionalConsensus !== expected.direction) process.exit(1);
          if (evidence.categoricalEvaluation.persistenceConsensus !== expected.persistence) process.exit(1);
          if (evidence.categoricalEvaluation.productMomentumScore !== null) process.exit(1);
          if (evidence.categoricalEvaluation.digest !== expected.digest) process.exit(1);
          if (evidence.decision.classification !== expected.classification) process.exit(1);
          if (evidence.decision.currentDualSourceCategoricalEvaluationPerformed !== true) process.exit(1);
          if (evidence.decision.currentNaverStoredEvidenceReproducedForReadiness !== true) process.exit(1);
          if (evidence.decision.newHistoryObservationRequired !== true) process.exit(1);
          if (evidence.decision.attestedNoOp !== false) process.exit(1);

          for (const [key, value] of Object.entries(evidence.safety)) {
            if (key === 'databaseMode') {
              if (value !== 'read-only') process.exit(1);
            } else if (value !== 0) {
              process.exit(1);
            }
          }

          if (audit.evaluatedAgainstMain !== expected.main) process.exit(1);
          if (audit.naverRuntime.currentStoredEvidenceReproducedForReadiness !== true) process.exit(1);
          if (audit.naverRuntime.latestStoredEvidenceThroughSlotStart !== expected.naverSlot) process.exit(1);
          if (audit.naverRuntime.latestStoredEvidenceJobId !== expected.naverJob) process.exit(1);
          if (audit.naverRuntime.reproducedSnapshotCount !== expected.snapshots) process.exit(1);
          if (audit.naverRuntime.evaluationWorkflowRunId !== expected.run) process.exit(1);
          if (audit.currentEvaluation.currentDualSourceCategoricalEvaluationPerformed !== true) process.exit(1);
          if (audit.currentEvaluation.currentCarrierProduced !== false) process.exit(1);
          if (audit.currentEvaluation.currentNoOpEvaluationAttested !== false) process.exit(1);
          if (audit.currentEvaluation.classification !== expected.classification) process.exit(1);
          if (audit.currentEvaluation.alignmentCutoffAt !== expected.cutoff) process.exit(1);
          if (audit.currentEvaluation.directionalConsensus !== expected.direction) process.exit(1);
          if (audit.currentEvaluation.persistenceConsensus !== expected.persistence) process.exit(1);
          if (audit.currentEvaluation.categoricalEvaluationDigest !== expected.digest) process.exit(1);
          if (audit.currentEvaluation.newHistoryObservationRequired !== true) process.exit(1);
          if (audit.freshnessPolicy.historyAppendDecision !== 'append-required-cutoff-advanced') process.exit(1);
          if (audit.decision.state !== 'current-carrier-persistence-required') process.exit(1);

          console.log(JSON.stringify({
            status: 'recorded-evaluation-consistent',
            workflowRunId: expected.run,
            alignmentCutoffAt: expected.cutoff,
            directionalConsensus: expected.direction,
            persistenceConsensus: expected.persistence,
            classification: expected.classification,
          }));
          NODE

      - name: Momentum live-shadow carrier persistence readiness
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-live-shadow-product-readiness-v1.test.mts

      - name: Runtime Stored Evidence regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-evidence-consensus-runtime-read-v1.test.mts

      - name: Momentum Evidence Consensus Product contract regression
        run: npx tsx --test tests/momentum-evidence-consensus-product-contract-v1.test.mts

      - name: Consumed verifier regression
        run: npx tsx --test tests/momentum-native-verifier-production-execution-authorization-v1.test.mts

      - name: Activity Exposure Production regression
        run: npx tsx --test tests/activity-exposure-public-route-cutover-execution-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
