name: Validate Momentum current dual-source evaluation v1

on:
  push:
    branches:
      - work/momentum-current-dual-source-evaluation-v1

permissions:
  contents: read

concurrency:
  group: momentum-current-dual-source-evaluation-v1
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FANDEX_RUNTIME_DATABASE_URL: ${{ secrets.FANDEX_RUNTIME_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        run: |
          git diff --name-only dd05caeab4682a642cf63e61f4f12b67182ecc9e...HEAD | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/validate-momentum-current-dual-source-evaluation-v1.yml
          lib/intelligence/fandexMomentumCrossFamilyCombinationResearch.ts
          lib/intelligence/fandexMomentumTemporalNormalizationResearch.ts
          lib/intelligence/fandexNaverMediaAttentionMomentumResearch.ts
          lib/lastfm-signal/contracts.ts
          lib/lastfm-signal/csv.ts
          lib/lastfm-signal/historicalReplaySourceBundle.ts
          lib/lastfm-signal/historicalWindow.ts
          lib/lastfm-signal/identityQualityGate.ts
          lib/lastfm-signal/readModel.ts
          lib/lastfm-signal/shadowVariableAdapter.ts
          scripts/research/momentumCurrentDualSourceEvaluationV1.mts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Static no-Product/no-write boundary
        run: |
          ! grep -R "getResolvedMetricScore\|artistMonthlyMetricSeed\|metricScoringPipeline"             scripts/research/momentumCurrentDualSourceEvaluationV1.mts             lib/intelligence/fandexNaverMediaAttentionMomentumResearch.ts             lib/intelligence/fandexMomentumTemporalNormalizationResearch.ts             lib/intelligence/fandexMomentumCrossFamilyCombinationResearch.ts \
            lib/lastfm-signal/historicalReplaySourceBundle.ts \
            lib/lastfm-signal/contracts.ts \
            lib/lastfm-signal/csv.ts \
            lib/lastfm-signal/readModel.ts \
            lib/lastfm-signal/identityQualityGate.ts \
            lib/lastfm-signal/historicalWindow.ts \
            lib/lastfm-signal/shadowVariableAdapter.ts
          ! grep -R "INSERT INTO\|UPDATE .* SET\|DELETE FROM"             scripts/research/momentumCurrentDualSourceEvaluationV1.mts
          grep -q "productMomentumScore: null"             lib/intelligence/fandexMomentumCrossFamilyCombinationResearch.ts

      - name: Current dual-source categorical evaluation
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx scripts/research/momentumCurrentDualSourceEvaluationV1.mts

      - name: Momentum live-shadow readiness regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-live-shadow-product-readiness-v1.test.mts

      - name: Runtime Stored Evidence regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-evidence-consensus-runtime-read-v1.test.mts

      - name: Consumed verifier regression
        run: npx tsx --test tests/momentum-native-verifier-production-execution-authorization-v1.test.mts

      - name: Activity Exposure Production regression
        run: npx tsx --test tests/activity-exposure-public-route-cutover-execution-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
