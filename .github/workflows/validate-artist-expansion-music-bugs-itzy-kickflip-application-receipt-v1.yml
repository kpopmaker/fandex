name: Validate Artist Expansion Music Bugs ITZY KickFlip application receipt v1

on:
  push:
    branches:
      - work/artist-expansion-music-bugs-itzy-kickflip-application-v1

permissions:
  contents: read

jobs:
  validate-bugs-itzy-kickflip-application-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Music Bugs application receipt
        run: python tests/artist-expansion-music-bugs-itzy-kickflip-application-v1.py
