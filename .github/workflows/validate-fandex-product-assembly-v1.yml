name: Validate FANDEX real seven-variable Product assembly v1

on:
  pull_request:
    paths:
      - 'lib/product/assembly/fandexProductAssembly.ts'
      - 'lib/product/adapters/**'
      - 'lib/product/contracts/fandexArtistAvailabilityMatrix.ts'
      - 'lib/product/contracts/fandexProductCandidate.ts'
      - 'lib/product/contracts/fandexProductExplainability.ts'
      - 'lib/product/contracts/fandexProductReadModel.ts'
      - 'lib/product/contracts/fandexVariableProduct.ts'
      - 'lib/product/contracts/fandexVariableProductSnapshot.ts'
      - 'tests/fandex-product-assembly-v1.test.mts'
      - 'tests/fandex-product-candidate-v1.test.mts'
      - 'tests/fandex-product-read-model-v1.test.mts'
      - 'tests/fandex-variable-product-contract-v1.test.mts'
      - '.github/workflows/validate-fandex-product-assembly-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/fandex-product-assembly-v1.test.mts tests/fandex-product-candidate-v1.test.mts tests/fandex-product-read-model-v1.test.mts tests/fandex-variable-product-contract-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
