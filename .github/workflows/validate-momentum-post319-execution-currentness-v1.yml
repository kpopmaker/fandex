name: Validate Momentum post319 execution currentness v1

on:
  push:
    branches:
      - integration/momentum-post319-execution-currentness-v1
  pull_request:
    branches:
      - integration/momentum-productionization-current-main-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "+refs/heads/$PR_BASE_REF:refs/remotes/origin/$PR_BASE_REF"
            LIVE_BASE_SHA="$(git rev-parse "refs/remotes/origin/$PR_BASE_REF")"
            git diff --name-only "$LIVE_BASE_SHA" "$PR_HEAD_SHA" | sort > /tmp/changed.txt
          else
            git fetch origin "+refs/heads/integration/momentum-productionization-current-main-v1:refs/remotes/origin/integration/momentum-productionization-current-main-v1"
            STACK_BASE="$(git rev-parse refs/remotes/origin/integration/momentum-productionization-current-main-v1)"
            git diff --name-only "$STACK_BASE" HEAD | sort > /tmp/changed.txt
          fi
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/validate-momentum-post319-execution-currentness-v1.yml
          lib/intelligence/fandexMomentumCurrentEvaluationExecution.ts
          lib/intelligence/fandexMomentumV2CarrierRecordCandidate.ts
          lib/product/readiness/momentumLiveShadowProductReadiness.ts
          tests/momentum-current-evaluation-execution-v1.test.mts
          tests/momentum-live-shadow-product-readiness-v1.test.mts
          tests/momentum-v2-carrier-record-candidate-v1.test.mts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Current evaluation execution regression
        run: npx tsx --test tests/momentum-current-evaluation-execution-v1.test.mts

      - name: V2 carrier record candidate regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-v2-carrier-record-candidate-v1.test.mts

      - name: Live-shadow readiness execution-channel regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-live-shadow-product-readiness-v1.test.mts

      - name: Preview-independent categorical attestation regression
        run: npx tsx --test tests/momentum-categorical-output-attestation-current-main-v1.test.mts

      - name: Carrier persistence decision regression
        run: npx tsx --test tests/momentum-carrier-persistence-decision-v1.test.mts

      - name: Carrier lineage regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-carrier-attestation-lineage-v2.test.mts

      - name: Existing carrier runtime regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-evidence-consensus-runtime-read-v1.test.mts

      - name: Existing Momentum Product contract regression
        run: npx tsx --test tests/momentum-evidence-consensus-product-contract-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
