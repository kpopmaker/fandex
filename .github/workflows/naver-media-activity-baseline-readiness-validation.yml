name: NAVER Media Activity Baseline Readiness Validation

on:
  push:
    branches:
      - research/naver-news-media-activity-baseline-readiness-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Baseline readiness research tests
        run: npm run test:ingestion:media-activity-baseline-readiness-research

      - name: Existing media activity evaluator regression
        run: npm run test:ingestion:media-activity-method-research

      - name: Shadow epoch regression
        run: npx tsx --test tests/naver-news-shadow-epoch-v1.test.mts

      - name: Shadow first-seen regressions
        run: npx tsx --test tests/naver-news-shadow-first-seen-activity-v1.test.mts tests/naver-news-shadow-first-seen-series-v1.test.mts

      - name: Shadow series verifier regression
        run: npm run test:ingestion:shadow-series-verifier

      - name: Typecheck
        run: npm run typecheck
