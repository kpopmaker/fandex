name: Validate FANDEX current runtime assembly readiness v1

on:
  pull_request:
    paths:
      - 'lib/product/runtime/fandexCurrentRuntimeAssemblyReadiness.ts'
      - 'lib/product/runtime/brandFitStoredEvidenceRuntime.ts'
      - 'lib/server/product/fandexCurrentRuntimeAssemblyReadiness.ts'
      - 'lib/server/product/musicAlbumPointCurrentRuntimeRead.ts'
      - 'lib/server/product/snsFandomPointCurrentRuntimeRead.ts'
      - 'lib/server/product/**'
      - 'lib/product/adapters/**'
      - 'lib/intelligence/riskAdjustment*'
      - 'lib/intelligence/snsFandomPointContracts.ts'
      - 'data/fandex-cloud-v10/seed/music_chart_artist_targets_v1.json'
      - 'data/fandex-cloud-v10/state/music_chart_*'
      - 'data/momentum-product/**'
      - 'tests/fandex-current-runtime-assembly-readiness-v1.test.mts'
      - 'tests/fandex-runtime-source-read-timings-v1.test.mts'
      - 'tests/brand-fit-stored-evidence-runtime-v1.test.mts'
      - 'tests/music-album-point-product-candidate-v1.test.mts'
      - 'tests/music-album-point-product-contract-readiness-v1.test.mts'
      - 'tests/risk-adjustment-news-issue-projection-v1.test.mts'
      - 'tests/risk-adjustment-activity-exposure-projection-v1.test.mts'
      - '.github/workflows/validate-fandex-current-runtime-assembly-readiness-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/brand-fit-stored-evidence-runtime-v1.test.mts tests/fandex-current-runtime-assembly-readiness-v1.test.mts tests/fandex-runtime-source-read-timings-v1.test.mts tests/music-album-point-product-candidate-v1.test.mts tests/music-album-point-product-contract-readiness-v1.test.mts tests/risk-adjustment-news-issue-projection-v1.test.mts tests/risk-adjustment-activity-exposure-projection-v1.test.mts tests/fandex-product-assembly-v1.test.mts tests/fandex-variable-product-contract-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
