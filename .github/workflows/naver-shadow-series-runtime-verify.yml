name: NAVER Shadow Series Runtime Verify

on:
  push:
    branches:
      - verify/naver-shadow-series-runtime-20260916

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FANDEX_RUNTIME_DATABASE_URL: ${{ secrets.FANDEX_RUNTIME_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Require runtime DB secret
        shell: bash
        run: |
          if [ -z "$FANDEX_RUNTIME_DATABASE_URL" ]; then
            echo "FANDEX_RUNTIME_DATABASE_URL secret is not configured in GitHub Actions."
            exit 2
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run read-only shadow series verifier
        run: >-
          npm run ingestion:naver-news:verify-shadow-series --
          --artist iu
          --protocol-start 2026-09-15T16:00:00.000Z
          --through-slot-start 2026-09-15T17:00:00.000Z
