name: Album Research Persistence Writer Validation

on:
  push:
    branches:
      - integration/album-research-persistence-writer

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run research persistence writer tests
        run: npx tsx --test tests/album-research-persistence-writer-v1.test.mts
      - name: Run SQL persistence contract tests
        run: npx tsx --test tests/album-research-persistence-sql-contract-v1.test.mts
      - name: Run intake regression tests
        run: npx tsx --test tests/album-research-observation-intake-v1.test.mts tests/album-research-observation-current-view-v1.test.mts
      - name: Typecheck
        run: npm run typecheck
