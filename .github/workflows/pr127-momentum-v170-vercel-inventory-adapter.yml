name: PR127 momentum v170 Vercel inventory adapter

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - 'lib/intelligence/fandexMomentumVerifierVercelInventoryAdapterResearch.ts'
      - 'tests/fandex-momentum-verifier-vercel-inventory-adapter-v170.test.mts'
      - '.github/workflows/pr127-momentum-v170-vercel-inventory-adapter.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Evaluate current blocked v170 state
        run: |
          cat > .tmp-v170-current.mts <<'TS'
          import {
            adaptFandexMomentumVerifierVercelInventoryResearch,
          } from './lib/intelligence/fandexMomentumVerifierVercelInventoryAdapterResearch';

          const out = adaptFandexMomentumVerifierVercelInventoryResearch({
            request: {
              method: 'GET',
              endpoint: '/v10/projects/{idOrName}/env',
              teamId: 'team_OrRPxuBxMwCYU3kk0r76AfOs',
              projectId: 'prj_aT3p8zmjyochu8iGmFOuNR1lSU7v',
              decryptRequested: false,
            },
            inventoryAvailable: false,
            inventoryBoundToProjectAndTeam: false,
            completeForProductionTarget: false,
            rows: [],
            opaqueSecretRollbackAttestation: null,
          });

          if (
            out.state !== 'inventory-adapter-blocked'
            || out.adapterReady
            || out.rollbackReadiness.rollbackReady
          ) {
            throw new Error('current v170 state must remain blocked');
          }

          console.log('V170_CURRENT_BEGIN');
          console.log(JSON.stringify(out, null, 2));
          console.log('V170_CURRENT_END');
          TS
          npx tsx --conditions=react-server .tmp-v170-current.mts
          rm .tmp-v170-current.mts

      - name: Validate v170 and upstream regressions
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-vercel-inventory-adapter-v170.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-premutation-rollback-readiness-v169.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-vercel-mutation-dry-run-v168.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-configuration-mutation-execution-guard-v167.test.mts
          npm run typecheck
          git diff --check
