name: Validate Artist Expansion ListenBrainz delta signal handoff v1

on:
  push:
    branches:
      - handoff/artist-expansion-listenbrainz-delta-signal-contract-v1

permissions:
  contents: read

jobs:
  validate-delta-signal-handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate ListenBrainz delta signal handoff
        run: python tests/artist-expansion-listenbrainz-delta-signal-contract-handoff-v1.py
