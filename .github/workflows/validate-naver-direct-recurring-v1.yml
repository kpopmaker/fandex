name: Validate NAVER direct recurring runner v1

on:
  push:
    branches:
      - integration/ops-naver-direct-recurring-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.head_ref == 'integration/ops-naver-direct-recurring-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/naver-news-direct-recurring-v1.test.mts
      - run: npx tsx --test tests/naver-news-scheduler-v125.test.mts
      - run: npx tsx --test tests/naver-news-scheduler-dispatch-v126.test.mts
      - run: npx tsx --test tests/naver-news-shadow-recurring-activation-v1.test.mts
      - run: npx tsx --test tests/naver-news-production-write-v124.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
