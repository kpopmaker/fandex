name: Bootstrap Blob dependency lock

on:
  push:
    branches:
      - integration/naver-live-blob-mirror-candidate-v1

permissions:
  contents: write

jobs:
  lock:
    if: "!contains(github.event.head_commit.message, 'lock(blob): resolve @vercel/blob dependency')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/naver-live-blob-mirror-candidate-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit resolved lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "lockfile already resolved"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "lock(blob): resolve @vercel/blob dependency"
          git push origin HEAD:integration/naver-live-blob-mirror-candidate-v1
