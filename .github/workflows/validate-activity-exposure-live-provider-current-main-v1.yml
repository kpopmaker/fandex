name: Validate Activity Exposure live provider on current main v1

on:
  push:
    branches:
      - validation/activity-exposure-live-provider-current-main-v1

permissions:
  contents: read

jobs:
  live-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      GOOGLE_YOUTUBE_API_KEY: ${{ secrets.GOOGLE_YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Credential preflight
        shell: bash
        run: |
          if [[ -n "${YOUTUBE_API_KEY}" || -n "${YOUTUBE_DATA_API_KEY}" || -n "${GOOGLE_YOUTUBE_API_KEY}" ]]; then
            echo "AUTHORIZED_YOUTUBE_CREDENTIAL_AVAILABLE=true"
          else
            echo "AUTHORIZED_YOUTUBE_CREDENTIAL_AVAILABLE=false"
          fi
      - name: Execute current-main Production live provider validation
        run: npx tsx scripts/validation/activityExposureProductionLiveProviderV1.ts
      - name: Upload current-main Production live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-exposure-production-live-provider-current-main-v1
          path: activity-exposure-production-live-provider-v1.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce current-main live coverage gate
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(
            fs.readFileSync('activity-exposure-production-live-provider-v1.json', 'utf8')
          );
          console.log('LIVE_PROVIDER_COVERAGE_GATE=' + report.liveProviderCoverageGate);
          console.log('MUSICBRAINZ_STATE=' + report.musicbrainz.state);
          console.log('YOUTUBE_STATE=' + report.youtube.state);
          console.log('PRODUCT_READ_MODEL=' + report.productReadModel.status);
          console.log('PRODUCT_NUMERIC_FACT=' + report.productReadModel.containsNumericFact);
          if (report.liveProviderCoverageGate !== 'PASS_WITH_TRUTHFUL_PROVIDER_COVERAGE') process.exit(1);
          if (report.productReadModel.status !== 'ok') process.exit(1);
          if (report.productReadModel.containsNumericFact !== false) process.exit(1);
          NODE
