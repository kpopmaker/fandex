name: TEMP newsIssuePoint Promotion Control Validation

on:
  push:
    branches:
      - validation/news-issue-point-promotion-control-5bcb83

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact promotion-control head
        uses: actions/checkout@v4
        with:
          ref: 5bcb831065254305f7c82d094a0ab45e2cfaffbc
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Promotion authorization/control/read-model
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-promotion-authorization-v1.test.mts
      - name: Canonical registry regression
        run: npx tsx --conditions=react-server --test tests/intelligence-variable-confidence-v1.test.mts
      - name: Promotion gate regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-real-promotion-gate-v1.test.mts
      - name: Selector regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-real-selector-v1.test.mts
      - name: Candidate regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-real-candidate-v1.test.mts
      - name: Product boundary regressions
        run: npx tsx --conditions=react-server --test tests/product-variable-boundary-v1.test.mts tests/product-evidence-boundary-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
      - name: Diff sanity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "5bcb831065254305f7c82d094a0ab45e2cfaffbc"
          test -z "$(git status --short --untracked-files=all)"
          git diff --check 2cb01343ae2cb51b551ceb7f873442e310217ba7..HEAD
          git diff --stat 2cb01343ae2cb51b551ceb7f873442e310217ba7..HEAD
          git diff --name-only 2cb01343ae2cb51b551ceb7f873442e310217ba7..HEAD
