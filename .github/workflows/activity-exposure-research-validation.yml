name: Activity Exposure Research Validation

on:
  push:
    branches:
      - research/comeback-activity-point-source-contract-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Activity Exposure event contract tests
        run: npx tsx --test tests/activity-exposure-event-contract-v1.test.mts

      - name: Run Activity Exposure observation tests
        run: npx tsx --test tests/activity-exposure-observation-v1.test.mts

      - name: Run MusicBrainz collector tests
        run: npx tsx --test tests/musicbrainz-activity-collector-v1.test.mts

      - name: Run YouTube collector tests
        run: npx tsx --test tests/youtube-activity-collector-v1.test.mts

      - name: Run IU end-to-end stream tests
        run: npx tsx --test tests/iu-activity-exposure-end-to-end-v1.test.mts

      - name: Run Product-readable view tests
        run: npx tsx --test tests/activity-exposure-product-view-v1.test.mts

      - name: Run live coverage manifest tests
        run: npx tsx --test tests/activity-exposure-coverage-manifest-v1.test.mts

      - name: Run provider retention policy tests
        run: npx tsx --test tests/activity-exposure-retention-policy-v1.test.mts

      - name: Typecheck
        run: npm run typecheck
