name: Activity Exposure Research Validation

on:
  push:
    branches:
      - research/comeback-activity-point-source-contract-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Activity Exposure contract tests
        run: npx tsx --test tests/activity-exposure-event-contract-v1.test.mts

      - name: Typecheck
        run: npm run typecheck
