name: PR170 Luminate observation intake validation

on:
  push:
    branches:
      - research/musicbrainz-album-catalog-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate Luminate observation intake and shared readiness
        run: |
          npx tsx --test tests/luminate-album-observation-intake-research-v1.test.mts
          npx tsx --test tests/luminate-album-authorization-research-v1.test.mts
          npx tsx --test tests/luminate-album-sales-production-candidate-research-v1.test.mts
          npx tsx --test tests/album-production-readiness-research-v1.test.mts
          npx tsx --test tests/album-normalization-research-v1.test.mts
          npx tsx --test tests/album-normalization-readiness-integration-v1.test.mts
          npx tsx --test tests/album-direct-first-week-absolute-research-v1.test.mts
          npx tsx --test tests/album-completed-purchase-provider-survey-research-v1.test.mts
          npx tsx --test tests/official-charts-album-sales-production-candidate-research-v1.test.mts
          npx tsx --test tests/oricon-album-sales-production-candidate-research-v1.test.mts
          npm run typecheck
