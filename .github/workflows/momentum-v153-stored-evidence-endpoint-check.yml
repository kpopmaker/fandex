name: Momentum v153 Stored Evidence Endpoint Check

on:
  push:
    branches:
      - verify/momentum-v153-stored-evidence-live

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify fixed guarded scope
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const s = fs.readFileSync('app/api/internal/naver-news/shadow-series-verifier/route.ts','utf8');
          for (const required of [
            "isNaverNewsRecurringAuthorizationValid",
            "readNaverNewsRecurringConfig",
            "runNaverNewsShadowSeriesVerification",
            "'2026-09-15T16:00:00.000Z'",
            "'2026-09-20T15:00:00.000Z'",
          ]) {
            if (!s.includes(required)) throw new Error('missing_guarded_scope:' + required);
          }
          if (/GET\s*\(/.test(s)) throw new Error('unexpected_get_surface');
          NODE
      - name: Run verifier regression
        run: npx tsx --test tests/naver-news-shadow-series-verifier.test.mts
      - name: Typecheck
        run: npm run typecheck
      - name: Diff check
        run: git diff --check
