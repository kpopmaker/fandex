name: TEMP newsIssuePoint Product Operations Approval Validation

on:
  push:
    branches:
      - validation/news-issue-point-promotion-approval-224273

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact promotion-approval head
        uses: actions/checkout@v4
        with:
          ref: 224273f5a9f9e86c921970fec8caf6375c3aec7f
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Product Operations approval
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-product-operations-approval-v1.test.mts
      - name: Activation readiness
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-activation-readiness-v1.test.mts
      - name: Promotion authorization/control
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-promotion-authorization-v1.test.mts
      - name: Real Product read and Evidence
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-real-read-boundary-v1.test.mts
      - name: Promotion gate
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-real-promotion-gate-v1.test.mts
      - name: Selector and candidate
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-real-selector-v1.test.mts tests/product-news-issue-point-real-candidate-v1.test.mts
      - name: Registry regression
        run: npx tsx --conditions=react-server --test tests/intelligence-variable-confidence-v1.test.mts
      - name: Product boundaries
        run: npx tsx --conditions=react-server --test tests/product-variable-boundary-v1.test.mts tests/product-evidence-boundary-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
      - name: Diff sanity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "224273f5a9f9e86c921970fec8caf6375c3aec7f"
          test -z "$(git status --short --untracked-files=all)"
          test "$(git rev-parse HEAD^{tree})" = "564783b4feb559cb2b5d492f3349d854c7960051"
          git diff --check ba52664ae3551ff7a2630feee569c6b40f9e96cf..HEAD
          git diff --stat ba52664ae3551ff7a2630feee569c6b40f9e96cf..HEAD
          git diff --name-only ba52664ae3551ff7a2630feee569c6b40f9e96cf..HEAD
