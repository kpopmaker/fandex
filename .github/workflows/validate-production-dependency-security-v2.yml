name: Validate production dependency security v2

on:
  push:
    branches:
      - integration/security-next-16-3-6-v1
  pull_request:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/validate-production-dependency-security-v2.yml'

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event_name == 'push' ||
      github.head_ref == 'integration/security-next-16-3-6-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "+refs/heads/main:refs/remotes/origin/main"
            MERGE_BASE="$(git merge-base refs/remotes/origin/main "$PR_HEAD_SHA")"
            git diff --name-only "$MERGE_BASE...$PR_HEAD_SHA" | sort > /tmp/changed.txt
          else
            git diff --name-only f4e9bea33d0182fff51096eb13891fd3f4fd643f...HEAD | sort > /tmp/changed.txt
          fi

          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/validate-production-dependency-security-v2.yml
          package-lock.json
          package.json
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Production dependency security gate
        run: npm run security:audit:production

      - name: Security gate regression
        run: npm run test:security

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
