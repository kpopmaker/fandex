name: Validate Momentum product activation readiness v1

on:
  push:
    branches:
      - integration/momentum-product-activation-readiness-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.head_ref == 'integration/momentum-product-activation-readiness-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        run: |
          git diff --name-only 6834738c6a6845a84619ca87f8fad728a46f041b...HEAD | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/validate-momentum-product-activation-readiness-v1.yml
          .github/workflows/validate-momentum-public-route-design-v1.yml
          lib/product/activation/momentumProductActivationReadiness.ts
          lib/server/product/momentumProductActivationReadiness.ts
          tests/momentum-product-activation-readiness-v1.test.mts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Momentum activation readiness regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-product-activation-readiness-v1.test.mts

      - name: Momentum public route design regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-public-route-design-v1.test.mts

      - name: Momentum live-shadow readiness regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-live-shadow-product-readiness-v1.test.mts

      - name: Momentum Product contract regression
        run: npx tsx --test tests/momentum-evidence-consensus-product-contract-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
