name: Artist Expansion Cloud YouTube Generic Cohort v1

on:
  push:
    branches:
      - validation/artist-expansion-generic-naver-pipeline-v1

permissions:
  contents: read

jobs:
  validate-cloud-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python syntax check
        run: |
          python -m py_compile scripts/fandex-cloud-migration/source/fandex_master_score_v10.py
          python -m py_compile scripts/fandex-cloud-v10/fandex_cloud_runner_v1.py
      - name: Generic 11-artist cloud and YouTube cohort regression
        run: python tests/artist-expansion-cloud-youtube-generic-cohort-v1.py
