name: Validate Momentum live-shadow current evaluation post-merge v1

on:
  push:
    branches:
      - validation/momentum-live-shadow-current-evaluation-post-merge-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify merged main parent
        run: test "$(git rev-parse HEAD^)" = "dd05caeab4682a642cf63e61f4f12b67182ecc9e"
      - run: npm ci
      - name: Momentum live-shadow current evaluation readiness
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-live-shadow-product-readiness-v1.test.mts
      - name: Momentum post-execution readiness regression
        run: npx tsx --test tests/momentum-post-execution-product-readiness-v1.test.mts
      - name: Real IU runtime Stored Evidence read regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-evidence-consensus-runtime-read-v1.test.mts
      - name: Momentum Evidence Consensus Product contract regression
        run: npx tsx --test tests/momentum-evidence-consensus-product-contract-v1.test.mts
      - name: Consumed execution regression
        run: npx tsx --test tests/momentum-native-verifier-production-execution-authorization-v1.test.mts
      - name: Activity Exposure Production regression
        run: npx tsx --test tests/activity-exposure-public-route-cutover-execution-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
