name: Validate Artist Expansion materialized candidate pipeline v1

on:
  push:
    branches:
      - validation/artist-expansion-current-main-v15
  pull_request:
    branches:
      - integration/artist-expansion-current-main-v5

permissions:
  contents: read

jobs:
  validate-materialized-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validation dependencies
        run: python -m pip install beautifulsoup4 requests
      - name: Candidate workflow syntax
        run: |
          python -m py_compile \
            scripts/fandex-cloud-migration/source/artist_source_compatibility_review_v1.py \
            scripts/fandex-cloud-migration/source/artist_source_compatibility_application_preview_v1.py
      - name: Active source binding contract
        run: python tests/artist-expansion-source-binding-contract-v1.py
      - name: Reviewed source compatibility ledger
        run: python tests/artist-expansion-source-compatibility-review-v1.py
      - name: Materialized candidate pipeline
        run: python tests/artist-expansion-materialized-candidate-pipeline-v1.py
