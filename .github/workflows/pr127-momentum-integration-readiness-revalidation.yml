name: PR127 momentum integration readiness revalidation

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - data/momentum-research/pr127_integration_readiness_revalidation_20260925T111500KST.json
      - tests/fandex-momentum-pr127-integration-readiness-revalidation.test.mts
      - .github/workflows/pr127-momentum-integration-readiness-revalidation.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: revalidation packet invariants
        run: npx tsx --test tests/fandex-momentum-pr127-integration-readiness-revalidation.test.mts
      - name: assert expected current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "f6cd81625c2cfb3b03d54bfc087b78efcc8af24f"
      - name: simulate current-main merge and resolution
        shell: bash
        run: |
          set -euo pipefail
          cp vercel.json /tmp/pr127-vercel.json
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_rc=$?
          set -e

          if [ "$merge_rc" -eq 0 ]; then
            echo "expected one add/add conflict"
            exit 1
          fi

          git diff --name-only --diff-filter=U | sort -u > /tmp/unmerged
          cat /tmp/unmerged
          test "$(wc -l < /tmp/unmerged | tr -d ' ')" = "1"
          test "$(cat /tmp/unmerged)" = "vercel.json"

          cp /tmp/pr127-vercel.json vercel.json
          git add vercel.json
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --cached --check -- vercel.json

          node <<'NODE'
          const fs = require('node:fs');
          const cfg = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          const enabled = cfg.git?.deploymentEnabled ?? {};
          for (const key of [
            'validation/*',
            'research/*',
            'verify/*',
            'diagnostic/*',
            'work/*',
            'v131-lastfm-real-signal-read-model',
          ]) {
            if (enabled[key] !== false) {
              throw new Error(`missing suppression: ${key}`);
            }
          }
          NODE

          git merge --abort
          test -z "$(git status --porcelain)"
      - name: v181 regression
        run: npx tsx --test tests/fandex-momentum-verifier-external-capability-resume-gate-v181.test.mts
      - name: typecheck
        run: npm run typecheck
      - name: full PR diff check
        run: git diff --check origin/main...HEAD
