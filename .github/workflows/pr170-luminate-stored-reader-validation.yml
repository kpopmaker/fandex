name: PR170 Luminate stored reader validation

on:
  push:
    branches:
      - research/musicbrainz-album-catalog-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate stored observation reader path
        run: |
          npx tsx --test tests/luminate-album-observation-stored-reader-research-v1.test.mts
          npx tsx --test tests/iu-luminate-stored-normalization-research-v1.test.mts
          npx tsx --test tests/luminate-album-observation-persistence-research-v1.test.mts
          npx tsx --test tests/luminate-album-observation-intake-research-v1.test.mts
          npm run typecheck
