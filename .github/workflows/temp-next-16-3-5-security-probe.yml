name: TEMP Next 16.3.5 Security Probe

on:
  push:
    branches:
      - validation/security-next-16-3-5-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Verify exact main parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "6199ed4d727911d270f572ebe9fb0169238cc65e"

      - run: npm ci

      - name: Probe Next security update without committing
        run: npm install next@16.3.5 --save-exact

      - name: Show changed dependency files
        run: git diff -- package.json package-lock.json

      - name: Summarize production audit after probe
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high --json > audit.json || true
          node <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync('audit.json','utf8'));
          const vulns = report.vulnerabilities || {};
          const rows = Object.entries(vulns)
            .filter(([,v]) => v && (v.severity === 'high' || v.severity === 'critical'))
            .map(([name,v]) => ({name, severity:v.severity, range:v.range, fixAvailable:v.fixAvailable}));
          console.log(JSON.stringify({metadata:report.metadata, highCritical:rows}, null, 2));
          NODE

      - name: Run production security gate
        run: npm run security:audit:production

      - name: Typecheck and build after probe
        run: npm run typecheck && npm run build
