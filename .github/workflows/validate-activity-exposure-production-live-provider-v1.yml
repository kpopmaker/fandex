name: Validate Activity Exposure Production live provider v1

on:
  workflow_dispatch:
  push:
    branches:
      - validation/activity-exposure-production-live-provider-v1
    paths:
      - scripts/validation/activityExposureProductionLiveProviderV1.ts
      - .github/workflows/validate-activity-exposure-production-live-provider-v1.yml

permissions:
  contents: read

jobs:
  live-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
      GOOGLE_YOUTUBE_API_KEY: ${{ secrets.GOOGLE_YOUTUBE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Execute Production live provider validation
        run: npx tsx scripts/validation/activityExposureProductionLiveProviderV1.ts
      - name: Upload Production live report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: activity-exposure-production-live-provider-v1
          path: activity-exposure-production-live-provider-v1.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce full live coverage gate
        shell: bash
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(
            fs.readFileSync('activity-exposure-production-live-provider-v1.json', 'utf8')
          );
          if (report.liveProviderCoverageGate !== 'PASS_WITH_TRUTHFUL_PROVIDER_COVERAGE') {
            console.error('LIVE_PROVIDER_COVERAGE_GATE=' + report.liveProviderCoverageGate);
            process.exit(1);
          }
          NODE
