name: Validate snsFandom window supersession handoff v1

on:
  push:
    branches:
      - 'work/sns-fandom-window-supersession-handoff-v1'
    paths:
      - 'lib/intelligence/snsFandomPointYoutubeWindowSupersessionHandoff.ts'
      - 'tests/sns-fandom-youtube-window-supersession-handoff-v1.test.mts'
      - 'docs/research/sns-fandom-youtube-window-supersession-owner-input-v1.json'
      - '.github/workflows/validate-sns-fandom-youtube-window-supersession-handoff-v1.yml'
  pull_request:
    paths:
      - 'lib/intelligence/snsFandomPointYoutubeWindowSupersessionHandoff.ts'
      - 'tests/sns-fandom-youtube-window-supersession-handoff-v1.test.mts'
      - 'docs/research/sns-fandom-youtube-window-supersession-owner-input-v1.json'
      - '.github/workflows/validate-sns-fandom-youtube-window-supersession-handoff-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Window supersession handoff regressions
        run: npx tsx --test tests/sns-fandom-youtube-window-supersession-handoff-v1.test.mts

      - name: Existing recurring runner regression
        run: npx tsx --test tests/sns-fandom-youtube-recurring-measurement-runner-v1.test.mts

      - name: Existing completed-window intake regression
        run: npx tsx --test tests/sns-fandom-youtube-completed-window-receipt-intake-v1.test.mts

      - name: Existing quota window regression
        run: npx tsx --test tests/sns-fandom-youtube-quota-window-completion-gate-v1.test.mts

      - name: Existing current submission readiness regression
        run: npx tsx --test tests/sns-fandom-youtube-current-submission-readiness-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

      - name: Safety boundary
        if: always()
        run: |
          echo "historicalWindowRewritten=false"
          echo "newWindowMaterialized=false"
          echo "syntheticBackfillAllowed=false"
          echo "retrospectiveProviderObservationAllowed=false"
          echo "schedulerMutationPerformed=false"
          echo "providerCalls=0"
          echo "productionCollectionAuthorized=false"
          echo "providerSubmissionAuthorized=false"
          echo "productActivationAuthorized=false"
