name: Dispatch NAVER recurring trigger first run v1

on:
  push:
    branches:
      - ops/dispatch-naver-recurring-trigger-first-run-20260929-v1

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_MAIN_SHA: c547621f0064ae523c62619d755edccaad7e558b
      TARGET_WORKFLOW: naver-news-shadow-recurring-production-v1.yml
    steps:
      - name: Dispatch exact-main recurring workflow once
        shell: bash
        run: |
          set -euo pipefail

          main_sha="$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/commits/main" \
            | python -c "import json,sys; print(json.load(sys.stdin)['sha'])")"

          test "$main_sha" = "$EXPECTED_MAIN_SHA"

          curl -fsSL -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$TARGET_WORKFLOW/dispatches" \
            -d '{"ref":"main"}'

          echo "FANDEX_NAVER_RECURRING_FIRST_RUN_DISPATCH=accepted"
