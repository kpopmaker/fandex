name: NAVER News shadow recurring Production v1

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fandex-naver-news-shadow-recurring-production-v1
  cancel-in-progress: false

jobs:
  dispatch:
    if: vars.FANDEX_NAVER_NEWS_RECURRING_TRIGGER_ENABLED == 'approved-github-hourly-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FANDEX_PRODUCTION_BASE_URL: https://fandex-eta.vercel.app
      FANDEX_NAVER_NEWS_SCHEDULER_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_SCHEDULER_SECRET }}
    steps:
      - name: Guard activation and secret
        run: |
          set -euo pipefail
          test -n "$FANDEX_NAVER_NEWS_SCHEDULER_SECRET"
          test "$FANDEX_PRODUCTION_BASE_URL" = "https://fandex-eta.vercel.app"

      - name: Dispatch canonical shadow scheduler once
        run: |
          set -euo pipefail
          code=$(curl -sS             --connect-timeout 15             --max-time 300             --retry 0             -o /tmp/response.json             -w '%{http_code}'             -X POST             -H "Authorization: Bearer $FANDEX_NAVER_NEWS_SCHEDULER_SECRET"             -H "X-Fandex-Scheduler-Source: github-actions-hourly-v1"             -H "Content-Type: application/json"             "$FANDEX_PRODUCTION_BASE_URL/api/internal/naver-news/shadow-scheduler")
          echo "FANDEX_NAVER_RECURRING_HTTP=$code"
          if [[ "$code" != "200" ]]; then
            node <<'NODE'
          const fs=require('fs');
          let d;
          try { d=JSON.parse(fs.readFileSync('/tmp/response.json','utf8')); }
          catch { process.exit(2); }
          const allowed=new Set(['config_rejected','protocol_rejected','authorization_rejected','dispatch_failed']);
          if (d?.ok !== false || d?.code !== 'naver_news_shadow_recurring_scheduler_rejected'
              || !allowed.has(d?.errorClass)) process.exit(2);
          console.log('FANDEX_NAVER_RECURRING_ERROR_CLASS=' + d.errorClass);
          NODE
            exit 1
          fi

          node <<'NODE'
          const fs=require('fs');
          let d;
          try { d=JSON.parse(fs.readFileSync('/tmp/response.json','utf8')); }
          catch { process.exit(2); }
          if (d?.ok !== true) process.exit(2);
          if (d?.mode !== 'shadow-recurring-scheduler') process.exit(3);
          if (typeof d?.collectionKey !== 'string') process.exit(4);
          console.log('FANDEX_NAVER_RECURRING_RESULT=success');
          console.log('FANDEX_NAVER_RECURRING_COLLECTION_KEY=' + d.collectionKey);
          console.log('FANDEX_NAVER_RECURRING_STATUS=' + String(d.status ?? 'unknown'));
          NODE

      - name: Safety boundary
        if: always()
        run: |
          rm -f /tmp/response.json
          echo "retries=0"
          echo "parallelDispatches=0"
