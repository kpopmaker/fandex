name: Validate Artist Expansion YouTube rebaseline policy v1

on:
  push:
    branches:
      - validation/artist-expansion-youtube-rebaseline-policy-v1

permissions:
  contents: read

jobs:
  validate-youtube-rebaseline-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate decision handoff
        run: python tests/artist-expansion-youtube-rebaseline-policy-handoff-v1.py
