name: Validate Activity Exposure post-merge cutover approval v1

on:
  push:
    branches:
      - validation/activity-exposure-post-merge-cutover-approval-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FANDEX_RUNTIME_DATABASE_URL: ${{ secrets.FANDEX_RUNTIME_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Activity Exposure cutover approval regression
        run: >
          npx tsx --test
          tests/activity-exposure-public-route-cutover-approval-v1.test.mts
          tests/activity-exposure-production-activation-approval-v1.test.mts
      - name: Live Neon post-merge cutover approval audit
        run: npx tsx scripts/validation/activityExposurePublicRouteCutoverApprovalV1.ts
      - run: npm run typecheck
      - run: npm run build
