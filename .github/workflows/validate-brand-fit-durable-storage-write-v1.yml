name: Validate Brand Fit durable storage write v1

on:
  pull_request:
    paths:
      - 'lib/intelligence/brandFitDurableStorageWriteAuthorization.ts'
      - 'lib/intelligence/brandFitDurableStorageWriteGate.ts'
      - 'lib/intelligence/brandFitStoredEvidenceWrite.ts'
      - 'lib/server/storage/brandFitStoredEvidenceBlobRuntime.ts'
      - 'scripts/operations/brandFitDurableStorageWriteGateV1.mts'
      - 'scripts/operations/brandFitStoredEvidenceWriteV1.mts'
      - '.github/workflows/write-brand-fit-durable-evidence-v1.yml'
      - '.github/workflows/validate-brand-fit-durable-storage-write-v1.yml'
      - 'tests/brand-fit-durable-storage-write-v1.test.mts'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run Brand Fit durable storage tests
        run: npx tsx --test tests/brand-fit-durable-storage-write-v1.test.mts
      - name: Typecheck
        run: npm run typecheck

      - name: Probe existing VERCEL_TOKEN project OIDC permission
        if: github.event.pull_request.head.repo.full_name == github.repository
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: 'prj_aT3p8zmjyochu8iGmFOuNR1lSU7v'
          VERCEL_TEAM_ID: 'team_OrRPxuBxMwCYU3kk0r76AfOs'
        run: |
          set -euo pipefail
          node <<'NODE'
          const accessToken = String(process.env.VERCEL_TOKEN ?? '').trim();
          const projectId = String(process.env.VERCEL_PROJECT_ID ?? '').trim();
          const teamId = String(process.env.VERCEL_TEAM_ID ?? '').trim();

          if (!accessToken) {
            throw new Error('brand_fit_vercel_access_token_missing');
          }

          const url = new URL(
            'https://api.vercel.com/v1/projects/'
              + encodeURIComponent(projectId)
              + '/token',
          );
          url.searchParams.set('teamId', teamId);

          const response = await fetch(url, {
            method: 'POST',
            headers: {
              Authorization: 'Bearer ' + accessToken,
              'Content-Type': 'application/json',
            },
            body: JSON.stringify({
              source: 'github-actions:brand-fit-oidc-permission-probe-v1',
            }),
          });

          if (!response.ok) {
            throw new Error(
              'brand_fit_vercel_project_oidc_probe_failed:'
                + response.status,
            );
          }

          const payload = await response.json();
          const token = (
            payload
            && typeof payload === 'object'
            && !Array.isArray(payload)
            && typeof payload.token === 'string'
          )
            ? payload.token.trim()
            : '';

          if (token.length < 32 || /\s/.test(token)) {
            throw new Error(
              'brand_fit_vercel_project_oidc_probe_invalid_response',
            );
          }

          process.stdout.write('::add-mask::' + token + '\n');
          process.stdout.write(
            'brandFitVercelProjectOidcProbe=success\n',
          );
          NODE
