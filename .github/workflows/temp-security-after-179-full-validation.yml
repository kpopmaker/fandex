name: TEMP Security After PR179 Full Validation

on:
  push:
    branches:
      - validation/security-after-179-5ca-full

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Verify exact source parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5ca45c83c0336b5bd29233f3868ccd0a7b497daf"

      - name: Install exact dependencies
        run: npm ci

      - name: Production dependency security
        run: npm run security:audit:production

      - name: Static checks
        run: npm run typecheck && npm run lint

      - name: Production regression suite
        run: >-
          npm run test:security &&
          npm run test:persistence &&
          npm run test:ingestion:v121 &&
          npm run test:role-bootstrap &&
          npm run test:production-bootstrap &&
          npm run test:deployment-readiness &&
          npm run test:merge-safety

      - name: Plan-only DB boundaries
        run: npm run db:migrate && npm run db:roles

      - name: Production build
        run: npm run build
