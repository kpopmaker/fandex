name: PR127 momentum v156 triple artifact acceptance validation

on:
  pull_request:
    branches:
      - main
    paths:
      - 'lib/intelligence/fandexMomentumTripleArtifactAcceptanceResearch.ts'
      - 'tests/fandex-momentum-triple-artifact-acceptance-v156.test.mts'
      - 'tests/fandex-momentum-manifest-guarded-preflight-v155.test.mts'
      - 'tests/fandex-momentum-paired-artifact-manifest-v154.test.mts'
      - 'data/momentum-research/iu_paired_artifact_manifest_v154.jsonl'
      - '.github/workflows/pr127-momentum-v156-triple-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate v156 and upstream transaction boundaries
        run: |
          npx tsx --test tests/fandex-momentum-triple-artifact-acceptance-v156.test.mts
          npx tsx --test tests/fandex-momentum-manifest-guarded-preflight-v155.test.mts
          npx tsx --test tests/fandex-momentum-paired-artifact-manifest-v154.test.mts
      - name: Typecheck
        run: npm run typecheck
      - name: Diff check
        run: git diff --check
