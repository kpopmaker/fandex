name: PR127 Lastfm v137 historical checkpoint validation

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate v137 and upstream regressions
        run: |
          npx tsx --conditions=react-server --test tests/lastfm-historical-shadow-checkpoint-v137.test.mts
          npx tsx --conditions=react-server --test tests/lastfm-repeated-shadow-reconciliation-v136.test.mts
          npx tsx --conditions=react-server --test tests/lastfm-shadow-scoring-reconciliation-v135.test.mts
          npx tsx --conditions=react-server --test tests/lastfm-historical-window-v133.test.mts
          npm run typecheck
      - name: Replay current main genuine daily history
        run: |
          git fetch origin main
          BRANCH_SEED="$(git rev-parse HEAD:app/data/v4/metrics/artistMonthlyMetricSeed.ts)"
          MAIN_SEED="$(git rev-parse origin/main:app/data/v4/metrics/artistMonthlyMetricSeed.ts)"
          test "$BRANCH_SEED" = "$MAIN_SEED"
          git show origin/main:data/lastfm-cloud/lastfm_artist_interest_history_v1.csv > /tmp/main-lastfm-history.csv
          npm run research:lastfm:v137-checkpoint -- --history /tmp/main-lastfm-history.csv > /tmp/v137-output.txt
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/v137-output.txt','utf8');
          const start = raw.indexOf('{');
          if (start < 0) throw new Error('missing checkpoint json');
          const x = JSON.parse(raw.slice(start));
          if (x.capturedContemporaneously !== false) throw new Error('capture semantics changed');
          if (x.application.productionApplied !== false) throw new Error('production applied');
          if (x.effects.externalCalls !== 0 || x.effects.databaseWrites !== 0) throw new Error('side effects present');
          console.log(JSON.stringify({
            contractVersion: x.contractVersion,
            evidenceMode: x.evidenceMode,
            sourceDateCount: x.sourceDateCount,
            sourceRowCount: x.sourceRowCount,
            sourceDateRange: x.sourceDateRange,
            replayStartDate: x.replayStartDate,
            replaySnapshotCount: x.replaySnapshotCount,
            state: x.state,
            repeatedReadinessState: x.repeatedReadiness.state,
            repeatedReasons: x.repeatedReadiness.reasons,
            latestSnapshotState: x.repeatedReadiness.latestSnapshotState,
            latestCoverage: x.repeatedReadiness.history.coverageRatio.at(-1)?.value ?? null,
            latestMeanAbsNormalizedDelta: x.repeatedReadiness.history.meanAbsoluteNormalizedDelta.at(-1)?.value ?? null,
            latestMeanAbsRankDelta: x.repeatedReadiness.history.meanAbsoluteRankDelta.at(-1)?.value ?? null,
            digest: x.digest
          }, null, 2));
          NODE
