name: PR170 IU Luminate production review gate validation

on:
  push:
    branches:
      - research/musicbrainz-album-catalog-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate IU Luminate production review gate
        run: |
          npx tsx --test tests/iu-luminate-production-review-gate-research-v1.test.mts
          npx tsx --test tests/luminate-album-observation-stored-reader-research-v1.test.mts
          npx tsx --test tests/iu-luminate-licensed-bootstrap-research-v1.test.mts
          npx tsx --test tests/iu-luminate-stored-normalization-research-v1.test.mts
          npx tsx --test tests/luminate-album-authorization-research-v1.test.mts
          npx tsx --test tests/album-production-readiness-research-v1.test.mts
          npm run typecheck
