name: PR127 momentum v155 manifest guarded preflight validation

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - 'lib/intelligence/fandexMomentumManifestGuardedPreflightResearch.ts'
      - 'tests/fandex-momentum-manifest-guarded-preflight-v155.test.mts'
      - '.github/workflows/pr127-momentum-v155-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate v155 and upstream persistence boundaries
        run: |
          npx tsx --test tests/fandex-momentum-manifest-guarded-preflight-v155.test.mts
          npx tsx --test tests/fandex-momentum-paired-artifact-manifest-v154.test.mts
          npx tsx --test tests/fandex-momentum-dual-artifact-coordinator-v152.test.mts
      - name: Materialize current committed-pair v155 preflight
        run: |
          cat > .tmp-v155-current.mts <<'TS'
          import { readFile } from 'node:fs/promises';
          import {
            evaluateFandexMomentumManifestGuardedPreflightResearch,
          } from './lib/intelligence/fandexMomentumManifestGuardedPreflightResearch';

          const [manifestJsonl, historyJsonl, watermarkJsonl] = await Promise.all([
            readFile('data/momentum-research/iu_paired_artifact_manifest_v154.jsonl', 'utf8'),
            readFile('data/momentum-research/iu_cross_family_evidence_state_v147.jsonl', 'utf8'),
            readFile('data/momentum-research/iu_evaluation_watermark_v151.jsonl', 'utf8'),
          ]);

          const result = {
            contractVersion: 'v143_fandex_momentum_output_form_eligibility_research_v1',
            sourceContractVersion: 'v142_fandex_momentum_cross_family_combination_research_v1',
            state: 'categorical-research-output-only',
            canonicalArtistId: 'iu',
            alignmentCutoffAt: '2026-09-20T01:59:13.000Z',
            currentResearchOutput: {
              outputForm: 'structured-categorical-evidence',
              directionalConsensus: 'direction-conflicted',
              persistenceConsensus: 'persistence-not-applicable',
              qualitativeDirectionEvidenceUsable: false,
              levelPercentileSpreadDiagnostic: 100,
              productMomentumScore: null,
            },
            numericEligibility: {
              status: 'not-eligible',
              unmetRequirements: [
                'numeric-estimand-defined',
                'independent-calibration-target-established',
                'non-circular-observed-calibration-dataset-available',
                'data-derived-mapping-or-weights-established',
                'out-of-sample-validation-passed',
                'conflict-and-missingness-numeric-policy-validated',
                'product-schema-migration-prevents-preview-fallback',
              ],
              numericEstimand: null,
              calibrationTarget: null,
              mappingOrWeights: null,
              outOfSampleValidation: null,
              additionalFamiliesAloneSufficient: false,
              legacyPreviewSeedCalibrationAllowed: false,
            },
            currentProductSchema: {
              metricValueKind: 'number-or-null',
              weightedScoreRequiresNumericValue: true,
              currentMomentumSourceStage: 'derived_signal',
              currentMomentumQualityLabel: 'preview',
              previewFallbackEnabled: true,
              previewFallbackExample: null,
              categoricalEvidenceFitsCurrentMomentumSlot: false,
            },
            researchCarrier: {
              observationContractVersion: 'fandex-observation-v1',
              categoricalRawValueSupported: true,
              recommendedVariableId: 'momentum.cross-family-evidence-state.research',
              registryBindingEstablished: false,
              productMetricBindingEstablished: false,
            },
            blockers: [],
            digest: '87edf2884c2f35a3a5819349ebb374012926f103fdeb3d41af10da59ca68de7a',
            effects: {
              externalCalls: 0,
              databaseReads: 0,
              databaseWrites: 0,
              masterScoreWrites: 0,
              websiteWrites: 0,
            },
          } as any;

          const preflight = evaluateFandexMomentumManifestGuardedPreflightResearch({
            manifestJsonl,
            historyJsonl,
            watermarkJsonl,
            result,
            sourceEvidence: {
              lastfmEvidenceId: '723cf73abb93882779edc0621a12381ab80e464c',
              lastfmLatestComponentEndAt: '2026-09-20T01:59:13.000Z',
              naverEvidenceId: '39ec4ddeeda1eedd906bc33288e1550a6c8fd3aeb1f46be590e661fcb6c41a9c',
              naverThroughSlotStart: '2026-09-20T15:00:00.000Z',
            },
            evaluatedAt: '2026-09-20T16:20:00.000Z',
            recordedAt: '2026-09-20T16:20:00.000Z',
            manifestedAt: '2026-09-20T16:20:00.000Z',
          });

          if (preflight.state !== 'evaluation-prepared') {
            throw new Error('current_v155_preflight_not_prepared');
          }
          console.log(JSON.stringify({
            contractVersion: preflight.contractVersion,
            state: preflight.state,
            currentPairAcceptance: {
              state: preflight.currentPairAcceptance.state,
              readyForNextEvaluation:
                preflight.currentPairAcceptance.readyForNextEvaluation,
              digest: preflight.currentPairAcceptance.digest,
            },
            coordinator: {
              state: preflight.coordinator.state,
              gateState: preflight.coordinator.gate.state,
              digest: preflight.coordinator.digest,
            },
            nextManifest: {
              sequence: preflight.nextManifest.sequence,
              coordinatorState: preflight.nextManifest.coordinatorState,
              previousManifestDigest:
                preflight.nextManifest.previousManifestDigest,
              expectedWrites: preflight.nextManifest.expectedWrites,
              manifestDigest: preflight.nextManifest.manifestDigest,
            },
            proposedWrites: preflight.proposedWrites,
            readyForPhysicalPersistence: preflight.readyForPhysicalPersistence,
            blockers: preflight.blockers,
            effects: preflight.effects,
            digest: preflight.digest,
          }, null, 2));
          TS
          npx tsx .tmp-v155-current.mts
          rm .tmp-v155-current.mts
      - name: Typecheck
        run: npm run typecheck
      - name: Diff check
        run: git diff --check
