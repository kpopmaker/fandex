name: Artist Expansion Last.fm Sync Generic Cohort v1

on:
  push:
    branches:
      - validation/artist-expansion-generic-naver-pipeline-v1

permissions:
  contents: read

jobs:
  validate-lastfm-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python syntax check
        run: |
          python -m py_compile scripts/fandex-cloud-migration/source/lastfm_sync_cloud_history_v1_1.py
          python -m py_compile tests/artist-expansion-lastfm-generic-count-v1.py
      - name: Last.fm 11-artist sync regression
        run: python tests/artist-expansion-lastfm-generic-count-v1.py
