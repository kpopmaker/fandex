name: Wikimedia Lightweight Transport Validation

on:
  push:
    branches:
      - research/wikimedia-entity-attention-v1
    paths:
      - ".github/workflows/wikimedia-lightweight-transport-spike.yml"
      - "lib/alternative-evidence/wikimediaEntityAttentionAqsTransportResearch.ts"
      - "tests/wikimedia-entity-attention-aqs-transport-research.test.mts"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lightweight transport contract tests
        run: npx tsx --test tests/wikimedia-entity-attention-aqs-transport-research.test.mts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run bounded IU live AQS transport spike
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const UA = 'FANDEX Wikimedia entity-attention research (https://github.com/kpopmaker/fandex/issues/240)';
          const headers = { 'User-Agent': UA, 'Accept': 'application/json' };
          const target = '2026092300';
          const start = '2026091500';
          const end = '2026092300';

          async function getJson(url) {
            const response = await fetch(url, { headers });
            const text = await response.text();
            let json = null;
            try { json = JSON.parse(text); } catch {}
            return { status: response.status, json };
          }

          const identityUrl = new URL('https://en.wikipedia.org/w/api.php');
          identityUrl.searchParams.set('action', 'query');
          identityUrl.searchParams.set('format', 'json');
          identityUrl.searchParams.set('formatversion', '2');
          identityUrl.searchParams.set('titles', 'IU (entertainer)');
          identityUrl.searchParams.set('prop', 'info|redirects');
          identityUrl.searchParams.set('rdnamespace', '0');
          identityUrl.searchParams.set('rdlimit', 'max');
          const identity = await getJson(identityUrl);
          if (identity.status !== 200) throw new Error('identity HTTP ' + identity.status);

          const page = identity.json?.query?.pages?.[0];
          if (!page || page.missing) throw new Error('identity missing');
          const titles = [
            page.title,
            ...(page.redirects ?? []).map(r => r.title),
          ];

          const aggregateUrl =
            'https://wikimedia.org/api/rest_v1/metrics/pageviews/aggregate/en.wikipedia.org/all-access/user/daily/'
            + start + '/' + end;
          const aggregate = await getJson(aggregateUrl);
          const aggregateTarget = (aggregate.json?.items ?? [])
            .find(item => item.timestamp === target);

          const perTitle = [];
          for (const title of titles) {
            const article = encodeURIComponent(title.replace(/ /g, '_'));
            const url =
              'https://wikimedia.org/api/rest_v1/metrics/pageviews/per-article/en.wikipedia.org/all-access/user/'
              + article + '/daily/' + start + '/' + end;
            const response = await getJson(url);
            const item = (response.json?.items ?? []).find(x => x.timestamp === target);
            perTitle.push({
              title,
              httpStatus: response.status,
              explicit: item ? item.views : null,
            });
          }

          const canonical = perTitle.find(row => row.title === page.title);
          const loaded =
            aggregate.status === 200
            && aggregateTarget
            && canonical?.httpStatus === 200
            && canonical.explicit !== null;

          const summary = {
            observationDay: '2026-09-23',
            identityHttpStatus: identity.status,
            canonicalPageId: page.pageid,
            canonicalTitle: page.title,
            redirectCount: titles.length - 1,
            aggregateHttpStatus: aggregate.status,
            aggregateTargetDayPresent: Boolean(aggregateTarget),
            canonicalTargetDayPresent:
              canonical?.httpStatus === 200 && canonical.explicit !== null,
            loadedDayProof: Boolean(loaded),
            explicitTitleCount: perTitle.filter(row => row.explicit !== null).length,
            zeroOmissionTitleCount: loaded
              ? perTitle.filter(row =>
                  row.explicit === null
                  && (row.httpStatus === 200 || row.httpStatus === 404)
                ).length
              : 0,
            transportErrorCount: perTitle.filter(row =>
              row.httpStatus === 429 || row.httpStatus >= 500
            ).length,
            entityViews: loaded
              ? perTitle.reduce((sum, row) => sum + (row.explicit ?? 0), 0)
              : null,
            perTitle,
          };

          console.log('WIKIMEDIA_TRANSPORT_SUMMARY=' + JSON.stringify(summary));
          NODE
