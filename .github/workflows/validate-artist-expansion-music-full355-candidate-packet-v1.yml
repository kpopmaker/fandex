name: Validate Artist Expansion Music full355 candidate packet v1

on:
  push:
    branches:
      - evidence/artist-expansion-music-full355-candidate-packet-v1

permissions:
  contents: read

jobs:
  validate-music-full355-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Music full355 candidate discovery receipt
        run: python tests/artist-expansion-music-full355-candidate-discovery-v1.py
