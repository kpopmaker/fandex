name: Validate FANDEX artist runtime binding v1

on:
  pull_request:
    paths:
      - 'lib/product/runtime/fandexArtistRuntimeBinding.ts'
      - 'lib/server/product/fandexArtistEndToEndRuntime.ts'
      - 'lib/server/product/naverNewsIssuePointRealProductRead.ts'
      - 'lib/server/product/activityExposureRealProductRead.ts'
      - 'lib/server/product/momentumEvidenceConsensusRealProductRead.ts'
      - 'lib/server/product/momentumLiveShadowProductReadiness.ts'
      - 'lib/server/product/musicAlbumPointCurrentRuntimeRead.ts'
      - 'lib/server/product/snsFandomPointCurrentRuntimeRead.ts'
      - 'lib/server/product/riskAdjustmentCurrentRuntimeRead.ts'
      - 'lib/server/product/brandFitStoredEvidenceRuntime.ts'
      - 'lib/product/runtime/brandFitStoredEvidenceRuntime.ts'
      - 'lib/product/assembly/fandexArtistEndToEndProductAssembly.ts'
      - 'lib/product/adapters/fandexArtistVariableProductOrchestrator.ts'
      - 'tests/fandex-artist-runtime-binding-v1.test.mts'
      - 'tests/fandex-artist-end-to-end-product-assembly-v1.test.mts'
      - '.github/workflows/validate-fandex-artist-runtime-binding-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/fandex-artist-runtime-binding-v1.test.mts tests/fandex-artist-end-to-end-product-assembly-v1.test.mts tests/fandex-current-runtime-assembly-readiness-v1.test.mts tests/risk-adjustment-news-issue-projection-v1.test.mts tests/risk-adjustment-activity-exposure-projection-v1.test.mts tests/brand-fit-stored-evidence-runtime-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
