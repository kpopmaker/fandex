name: Album Live Identity Reconciliation Validation

on:
  push:
    branches:
      - integration/album-live-identity-reconciliation

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run live identity reconciliation tests
        run: npx tsx --test tests/album-live-identity-reconciliation-v1.test.mts
      - name: Run provider binding regression tests
        run: npx tsx --test tests/album-provider-executor-binding-v1.test.mts
      - name: Run one-shot network gate regression tests
        run: npx tsx --test tests/album-one-shot-network-executor-v1.test.mts
      - name: Typecheck
        run: npm run typecheck
