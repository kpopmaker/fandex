name: Validate Activity Exposure persistence runtime v1

on:
  push:
    branches:
      - validation/activity-exposure-persistence-runtime-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Activity Exposure persistence repository
        run: npx tsx --test tests/activity-exposure-persistence-repository-v1.test.mts
      - name: Activity Exposure existing regressions
        run: |
          npx tsx --test tests/product-activity-exposure-contract-v1.test.mts
          npx tsx --test tests/activity-exposure-ingestion-contract-v1.test.mts
          npx tsx --test tests/activity-exposure-musicbrainz-production-collector-v1.test.mts
          npx tsx --test tests/activity-exposure-youtube-production-collector-v1.test.mts
          npx tsx --test tests/activity-exposure-production-boundary-v1.test.mts
      - name: Product and persistence regressions
        run: |
          npx tsx --test tests/product-state-foundation-v1.test.mts
          npx tsx --test tests/product-time-foundation-v1.test.mts
          npm run test:persistence
          npm run test:ingestion:v121
          npm run test:role-bootstrap
      - name: Production dependency security
        run: npm run security:audit:production
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
