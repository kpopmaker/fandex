name: Validate Activity Exposure post-merge activation candidate v1

on:
  push:
    branches:
      - validation/activity-exposure-postmerge-activation-candidate-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FANDEX_RUNTIME_DATABASE_URL: ${{ secrets.FANDEX_RUNTIME_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read-only post-merge activation candidate
        run: npx tsx scripts/validation/activityExposurePostMergeActivationCandidateV1.ts
