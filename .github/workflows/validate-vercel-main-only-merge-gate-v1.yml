name: Validate Vercel main-only guarded merge gate v1

on:
  push:
    branches:
      - integration/ops-vercel-main-only-merge-gate-v1
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/codex-version-pr-auto-merge.yml'
      - '.github/workflows/validate-vercel-main-only-merge-gate-v1.yml'
      - 'docs/operations/fandex-ci-cd-deployment-policy-v1.md'
      - 'scripts/github/evaluate-vercel-pr-head-requirement.mjs'
      - 'tests/vercel-main-only-merge-gate-v1.test.mjs'

permissions:
  contents: read

jobs:
  validate:
    if: >-
      github.event_name == 'push' ||
      github.head_ref == 'integration/ops-vercel-main-only-merge-gate-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "+refs/heads/main:refs/remotes/origin/main"
            MERGE_BASE="$(git merge-base refs/remotes/origin/main "$PR_HEAD_SHA")"
            git diff --name-only "$MERGE_BASE...$PR_HEAD_SHA" | sort > /tmp/changed.txt
          else
            git diff --name-only f4e9bea33d0182fff51096eb13891fd3f4fd643f...HEAD | sort > /tmp/changed.txt
          fi

          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/codex-version-pr-auto-merge.yml
          .github/workflows/validate-vercel-main-only-merge-gate-v1.yml
          docs/operations/fandex-ci-cd-deployment-policy-v1.md
          scripts/github/evaluate-vercel-pr-head-requirement.mjs
          tests/vercel-main-only-merge-gate-v1.test.mjs
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Main-only guarded merge regression
        run: node --test tests/vercel-main-only-merge-gate-v1.test.mjs

      - name: Merge safety regression
        run: npm run test:merge-safety

      - name: Production dependency security gate
        run: npm run security:audit:production

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
