name: Validate NAVER scheduler secret presence 2026-09-29 v1

on:
  push:
    branches:
      - validation/naver-scheduler-secret-presence-20260929-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check secret presence without exposing value
        env:
          NAVER_SCHEDULER_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_SCHEDULER_SECRET }}
        run: |
          if [ -n "$NAVER_SCHEDULER_SECRET" ]; then
            echo "FANDEX_GITHUB_NAVER_SCHEDULER_SECRET_PRESENT=true"
          else
            echo "FANDEX_GITHUB_NAVER_SCHEDULER_SECRET_PRESENT=false"
          fi
          echo "secretValuesLogged=0"
          echo "productionMutations=0"
