name: PR127 momentum v167 configuration mutation execution guard

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - 'lib/intelligence/fandexMomentumVerifierConfigurationMutationExecutionGuardResearch.ts'
      - 'tests/fandex-momentum-verifier-configuration-mutation-execution-guard-v167.test.mts'
      - '.github/workflows/pr127-momentum-v167-configuration-mutation-execution-guard.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Evaluate current v167 blocked state
        run: |
          cat > .tmp-v167-current.mts <<'TS'
          import {
            evaluateFandexMomentumVerifierConfigurationMutationAuthorization,
          } from './lib/intelligence/fandexMomentumVerifierConfigurationMutationAuthorizationResearch';
          import {
            evaluateFandexMomentumVerifierConfigurationMutationExecutionGuard,
          } from './lib/intelligence/fandexMomentumVerifierConfigurationMutationExecutionGuardResearch';

          const authorization =
            evaluateFandexMomentumVerifierConfigurationMutationAuthorization({
              evaluatedAt: '2026-09-21T23:40:00.000Z',
              requestIntent: 'generic-continuation',
              upstreamV165Digest:
                'f75d091666f2f8e9109918e8857cb0e0941c1a641cac8dd86660ba45cb10734f',
              upstreamV165State: 'provisioning-plan-ready',
              record: null,
            });

          const out =
            evaluateFandexMomentumVerifierConfigurationMutationExecutionGuard({
              authorization,
              expectedV165PlanDigest:
                'f75d091666f2f8e9109918e8857cb0e0941c1a641cac8dd86660ba45cb10734f',
              expectedAuthorizationRecordDigest: null,
              secretHandleAttestation: null,
            });

          if (
            out.state !== 'mutation-envelope-blocked'
            || out.mutationEnvelopeReady
            || out.envelope !== null
          ) {
            throw new Error('current v167 state must remain blocked without explicit v166 authorization');
          }

          console.log('V167_CURRENT_BEGIN');
          console.log(JSON.stringify(out, null, 2));
          console.log('V167_CURRENT_END');
          TS
          npx tsx --conditions=react-server .tmp-v167-current.mts
          rm .tmp-v167-current.mts

      - name: Validate v167 and upstream regressions
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-configuration-mutation-execution-guard-v167.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-configuration-authorization-v166.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-provisioning-authorization-plan-v165.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-configuration-evidence-v164.test.mts
          npm run typecheck
          git diff --check
