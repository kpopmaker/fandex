name: Validate Momentum evidence consensus Product contract v1

on:
  push:
    branches:
      - work/momentum-evidence-consensus-product-contract-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        run: |
          git diff --name-only 32dbbac844306f38b0dd33792265d24d439394f2...HEAD | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/validate-momentum-evidence-consensus-product-contract-v1.yml
          lib/product/adapters/momentumEvidenceConsensusProductReadModel.ts
          lib/product/contracts/productMomentumEvidenceConsensus.ts
          tests/momentum-evidence-consensus-product-contract-v1.test.mts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Momentum evidence consensus Product contract
        run: npx tsx --test tests/momentum-evidence-consensus-product-contract-v1.test.mts

      - name: Momentum post-execution readiness regression
        run: npx tsx --test tests/momentum-post-execution-product-readiness-v1.test.mts

      - name: Consumed execution regression
        run: npx tsx --test tests/momentum-native-verifier-production-execution-authorization-v1.test.mts

      - name: Activity Exposure Production regression
        run: npx tsx --test tests/activity-exposure-public-route-cutover-execution-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
