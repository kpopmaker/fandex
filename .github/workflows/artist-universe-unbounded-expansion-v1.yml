name: Artist Universe Unbounded Expansion v1

on:
  push:
    branches:
      - validation/artist-expansion-generic-naver-pipeline-v1

permissions:
  contents: read

jobs:
  validate-universe-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unbounded artist universe regression
        run: npx tsx --test tests/artist-universe-unbounded-expansion-v1.test.mts
