name: Artist Universe Unbounded Expansion v1

on:
  push:
    branches:
      - validation/artist-expansion-generic-naver-pipeline-v1

permissions:
  contents: read

jobs:
  validate-universe-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unbounded artist universe regression
        run: npx tsx --test tests/artist-universe-unbounded-expansion-v1.test.mts
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install chart discovery dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4 requests
      - name: Catalog intake regression
        run: |
          python tests/artist-catalog-intake-from-chart-v1.py
          python tests/artist-catalog-review-queue-v1.py
      - name: Stage 7 multisource discovery regression
        run: |
          python tests/artist-universe-multisource-discovery-v1.py
          python tests/artist-expansion-starship-roster-adapter-v1.py
          python tests/artist-expansion-yg-roster-adapter-v1.py
          python tests/artist-expansion-jyp-roster-adapter-v1.py
          python tests/artist-expansion-sm-roster-adapter-v1.py
          python tests/artist-expansion-pnation-roster-adapter-v1.py
          python tests/artist-expansion-kq-roster-adapter-v1.py
          python tests/artist-expansion-fnc-japan-roster-adapter-v1.py
          python tests/artist-expansion-woollim-roster-adapter-v1.py
          python tests/artist-expansion-highup-roster-adapter-v1.py
          python tests/artist-expansion-rbw-roster-adapter-v1.py
          python tests/artist-expansion-wakeone-roster-adapter-v1.py
          python tests/artist-expansion-fantagio-roster-adapter-v1.py
          python tests/artist-expansion-cube-japan-roster-adapter-v1.py
          python tests/artist-expansion-mnh-roster-adapter-v1.py
          python tests/artist-expansion-bugs-yg-provider-catalog-v1.py
          python tests/artist-expansion-weverse-con-roster-v1.py
          python tests/artist-expansion-seoul-music-awards-roster-v1.py
          python tests/artist-scope-review-queue-v1.py
          python tests/artist-scope-deferred-queue-v1.py
          python tests/artist-onboarding-blocker-queue-v1.py
      - name: Export full artist universe identity index
        run: npx tsx scripts/artist-expansion/export-artist-universe-identity-v1.mts artist_universe_identity_index_runtime.json
      - name: Collect STARSHIP official roster
        run: |
          python scripts/artist-expansion/collect_starship_agency_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/starship-official-roster-2026-09-24.json \
            --output starship_agency_roster_v1_latest.json
      - name: Collect YG official roster
        run: |
          python scripts/artist-expansion/collect_yg_agency_roster_v1.py \
            --output yg_agency_roster_v1_latest.json
      - name: Collect JYP official roster
        run: |
          python scripts/artist-expansion/collect_jyp_agency_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/jyp-official-roster-2026-09-25.json \
            --output jyp_agency_roster_v1_latest.json
      - name: Collect SM official featured roster
        run: |
          python scripts/artist-expansion/collect_sm_agency_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/sm-official-featured-roster-2026-09-25.json \
            --output sm_agency_roster_v1_latest.json
      - name: Collect P NATION official roster
        run: |
          python scripts/artist-expansion/collect_pnation_agency_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/pnation-official-roster-2026-09-25.json \
            --output pnation_agency_roster_v1_latest.json
      - name: Collect KQ official roster
        run: |
          python scripts/artist-expansion/collect_kq_agency_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/kq-official-roster-2026-09-25.json \
            --output kq_agency_roster_v1_latest.json
      - name: Collect FNC Japan official music roster
        run: |
          python scripts/artist-expansion/collect_fnc_japan_music_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/fnc-japan-music-roster-2026-09-25.json \
            --output fnc_japan_music_roster_v1_latest.json
      - name: Collect Woollim official roster
        run: |
          python scripts/artist-expansion/collect_woollim_agency_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/woollim-official-roster-2026-09-25.json \
            --output woollim_agency_roster_v1_latest.json
      - name: Collect High Up official roster
        run: |
          python scripts/artist-expansion/collect_highup_agency_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/highup-official-roster-2026-09-25.json \
            --output highup_agency_roster_v1_latest.json
      - name: Collect RBW official roster
        run: |
          python scripts/artist-expansion/collect_rbw_agency_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/rbw-official-roster-2026-09-25.json \
            --output rbw_agency_roster_v1_latest.json
      - name: Collect WAKEONE official notice-aware roster
        run: |
          python scripts/artist-expansion/collect_wakeone_agency_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/wakeone-notice-aware-roster-2026-09-26.json \
            --output wakeone_agency_roster_v1_latest.json
      - name: Collect Fantagio official music identity roster
        run: |
          python scripts/artist-expansion/collect_fantagio_music_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/fantagio-music-roster-2026-09-26.json \
            --output fantagio_music_roster_v1_latest.json
      - name: Collect CUBE Japan official music roster
        run: |
          python scripts/artist-expansion/collect_cube_japan_music_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/cube-japan-music-roster-2026-09-26.json \
            --output cube_japan_music_roster_v1_latest.json
      - name: Collect MNH official artist roster
        run: |
          python scripts/artist-expansion/collect_mnh_agency_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/mnh-official-roster-2026-09-26.json \
            --output mnh_agency_roster_v1_latest.json
      - name: Collect Bugs YG provider catalog
        run: |
          python scripts/artist-expansion/collect_bugs_yg_provider_catalog_v1.py \
            --output bugs_yg_provider_catalog_v1_latest.json
      - name: Collect Weverse Con event roster
        run: |
          python scripts/artist-expansion/collect_weverse_con_2026_roster_v1.py \
            --output weverse_con_2026_roster_v1_latest.json
      - name: Collect Seoul Music Awards roster
        run: |
          python scripts/artist-expansion/collect_seoul_music_awards_group_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/seoul-music-awards-world-choice-group-2026.json \
            --output seoul_music_awards_group_roster_v1_latest.json
      - name: Stage 7 live multisource discovery
        run: |
          python scripts/artist-expansion/artist_universe_multisource_discovery_v1.py \
            --identity-index artist_universe_identity_index_runtime.json \
            --snapshot starship_agency_roster_v1_latest.json \
            --snapshot yg_agency_roster_v1_latest.json \
            --snapshot jyp_agency_roster_v1_latest.json \
            --snapshot sm_agency_roster_v1_latest.json \
            --snapshot pnation_agency_roster_v1_latest.json \
            --snapshot kq_agency_roster_v1_latest.json \
            --snapshot fnc_japan_music_roster_v1_latest.json \
            --snapshot woollim_agency_roster_v1_latest.json \
            --snapshot highup_agency_roster_v1_latest.json \
            --snapshot rbw_agency_roster_v1_latest.json \
            --snapshot wakeone_agency_roster_v1_latest.json \
            --snapshot fantagio_music_roster_v1_latest.json \
            --snapshot cube_japan_music_roster_v1_latest.json \
            --snapshot mnh_agency_roster_v1_latest.json \
            --snapshot bugs_yg_provider_catalog_v1_latest.json \
            --snapshot weverse_con_2026_roster_v1_latest.json \
            --snapshot seoul_music_awards_group_roster_v1_latest.json \
            --decisions data/artist-catalog-review-decisions-v1.json \
            --output artist_universe_multisource_discovery_v1_latest.json
      - name: Build Stage 7 scope review queue
        run: |
          python scripts/artist-expansion/artist_scope_review_queue_v1.py \
            artist_universe_multisource_discovery_v1_latest.json \
            artist_scope_review_queue_v1_latest.json
      - name: Build Stage 7 scope deferred queue
        run: |
          python scripts/artist-expansion/artist_scope_deferred_queue_v1.py \
            artist_universe_multisource_discovery_v1_latest.json \
            artist_scope_deferred_queue_v1_latest.json
      - name: Build Stage 7 onboarding blocker queue
        run: |
          python scripts/artist-expansion/artist_onboarding_blocker_queue_v1.py \
            artist_universe_multisource_discovery_v1_latest.json \
            artist_onboarding_blocker_queue_v1_latest.json
      - name: Live chart catalog discovery
        env:
          ARTIST_UNIVERSE_IDENTITY_FILE: artist_universe_identity_index_runtime.json
        run: python scripts/fandex-cloud-migration/source/music_chart_discover_artist_candidates_v2.py
      - name: Build catalog review queue
        run: |
          python scripts/artist-expansion/artist_catalog_review_queue_v1.py \
            music_chart_artist_candidates_v2_raw_latest.json \
            artist_catalog_review_queue_v1_latest.json \
            --identity-index artist_universe_identity_index_runtime.json \
            --decisions data/artist-catalog-review-decisions-v1.json
      - name: Upload catalog discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: artist-catalog-discovery-v1
          path: |
            music_chart_artist_candidates_v2_raw_latest.json
            MUSIC_CHART_ARTIST_CANDIDATES_V2_REPORT_latest.txt
            artist_catalog_review_queue_v1_latest.json
            starship_agency_roster_v1_latest.json
            yg_agency_roster_v1_latest.json
            jyp_agency_roster_v1_latest.json
            sm_agency_roster_v1_latest.json
            pnation_agency_roster_v1_latest.json
            kq_agency_roster_v1_latest.json
            fnc_japan_music_roster_v1_latest.json
            woollim_agency_roster_v1_latest.json
            highup_agency_roster_v1_latest.json
            rbw_agency_roster_v1_latest.json
            wakeone_agency_roster_v1_latest.json
            fantagio_music_roster_v1_latest.json
            cube_japan_music_roster_v1_latest.json
            mnh_agency_roster_v1_latest.json
            bugs_yg_provider_catalog_v1_latest.json
            weverse_con_2026_roster_v1_latest.json
            seoul_music_awards_group_roster_v1_latest.json
            artist_universe_multisource_discovery_v1_latest.json
            artist_scope_review_queue_v1_latest.json
            artist_scope_deferred_queue_v1_latest.json
            artist_onboarding_blocker_queue_v1_latest.json
          if-no-files-found: error
