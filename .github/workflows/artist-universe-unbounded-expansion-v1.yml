name: Artist Universe Unbounded Expansion v1

on:
  push:
    branches:
      - validation/artist-expansion-generic-naver-pipeline-v1

permissions:
  contents: read

jobs:
  validate-universe-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unbounded artist universe regression
        run: npx tsx --test tests/artist-universe-unbounded-expansion-v1.test.mts
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install chart discovery dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4 requests
      - name: Catalog intake regression
        run: |
          python tests/artist-catalog-intake-from-chart-v1.py
          python tests/artist-catalog-review-queue-v1.py
      - name: Stage 7 multisource discovery regression
        run: |
          python tests/artist-universe-multisource-discovery-v1.py
          python tests/artist-expansion-starship-roster-adapter-v1.py
          python tests/artist-expansion-yg-roster-adapter-v1.py
          python tests/artist-expansion-jyp-roster-adapter-v1.py
          python tests/artist-expansion-bugs-yg-provider-catalog-v1.py
          python tests/artist-expansion-weverse-con-roster-v1.py
          python tests/artist-expansion-seoul-music-awards-roster-v1.py
          python tests/artist-scope-review-queue-v1.py
          python tests/artist-scope-deferred-queue-v1.py
          python tests/artist-onboarding-blocker-queue-v1.py
      - name: Export full artist universe identity index
        run: npx tsx scripts/artist-expansion/export-artist-universe-identity-v1.mts artist_universe_identity_index_runtime.json
      - name: Collect STARSHIP official roster
        run: |
          python scripts/artist-expansion/collect_starship_agency_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/starship-official-roster-2026-09-24.json \
            --output starship_agency_roster_v1_latest.json
      - name: Collect YG official roster
        run: |
          python scripts/artist-expansion/collect_yg_agency_roster_v1.py \
            --output yg_agency_roster_v1_latest.json
      - name: Collect JYP official roster
        run: |
          python scripts/artist-expansion/collect_jyp_agency_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/jyp-official-roster-2026-09-25.json \
            --output jyp_agency_roster_v1_latest.json
      - name: Collect Bugs YG provider catalog
        run: |
          python scripts/artist-expansion/collect_bugs_yg_provider_catalog_v1.py \
            --output bugs_yg_provider_catalog_v1_latest.json
      - name: Collect Weverse Con event roster
        run: |
          python scripts/artist-expansion/collect_weverse_con_2026_roster_v1.py \
            --output weverse_con_2026_roster_v1_latest.json
      - name: Collect Seoul Music Awards roster
        run: |
          python scripts/artist-expansion/collect_seoul_music_awards_group_roster_v1.py \
            --fallback-snapshot data/artist-expansion-sources/seoul-music-awards-world-choice-group-2026.json \
            --output seoul_music_awards_group_roster_v1_latest.json
      - name: Stage 7 live multisource discovery
        run: |
          python scripts/artist-expansion/artist_universe_multisource_discovery_v1.py \
            --identity-index artist_universe_identity_index_runtime.json \
            --snapshot starship_agency_roster_v1_latest.json \
            --snapshot yg_agency_roster_v1_latest.json \
            --snapshot jyp_agency_roster_v1_latest.json \
            --snapshot bugs_yg_provider_catalog_v1_latest.json \
            --snapshot weverse_con_2026_roster_v1_latest.json \
            --snapshot seoul_music_awards_group_roster_v1_latest.json \
            --decisions data/artist-catalog-review-decisions-v1.json \
            --output artist_universe_multisource_discovery_v1_latest.json
      - name: Build Stage 7 scope review queue
        run: |
          python scripts/artist-expansion/artist_scope_review_queue_v1.py \
            artist_universe_multisource_discovery_v1_latest.json \
            artist_scope_review_queue_v1_latest.json
            artist_scope_deferred_queue_v1_latest.json
      - name: Build Stage 7 scope deferred queue
        run: |
          python scripts/artist-expansion/artist_scope_deferred_queue_v1.py \
            artist_universe_multisource_discovery_v1_latest.json \
            artist_scope_deferred_queue_v1_latest.json
      - name: Build Stage 7 onboarding blocker queue
        run: |
          python scripts/artist-expansion/artist_onboarding_blocker_queue_v1.py \
            artist_universe_multisource_discovery_v1_latest.json \
            artist_onboarding_blocker_queue_v1_latest.json
      - name: Live chart catalog discovery
        env:
          ARTIST_UNIVERSE_IDENTITY_FILE: artist_universe_identity_index_runtime.json
        run: python scripts/fandex-cloud-migration/source/music_chart_discover_artist_candidates_v2.py
      - name: Build catalog review queue
        run: |
          python scripts/artist-expansion/artist_catalog_review_queue_v1.py \
            music_chart_artist_candidates_v2_raw_latest.json \
            artist_catalog_review_queue_v1_latest.json \
            --identity-index artist_universe_identity_index_runtime.json \
            --decisions data/artist-catalog-review-decisions-v1.json
      - name: Upload catalog discovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: artist-catalog-discovery-v1
          path: |
            music_chart_artist_candidates_v2_raw_latest.json
            MUSIC_CHART_ARTIST_CANDIDATES_V2_REPORT_latest.txt
            artist_catalog_review_queue_v1_latest.json
            starship_agency_roster_v1_latest.json
            yg_agency_roster_v1_latest.json
            jyp_agency_roster_v1_latest.json
            bugs_yg_provider_catalog_v1_latest.json
            weverse_con_2026_roster_v1_latest.json
            seoul_music_awards_group_roster_v1_latest.json
            artist_universe_multisource_discovery_v1_latest.json
            artist_scope_review_queue_v1_latest.json
            artist_onboarding_blocker_queue_v1_latest.json
          if-no-files-found: error
