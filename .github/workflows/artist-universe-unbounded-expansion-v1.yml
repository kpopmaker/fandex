name: Artist Universe Unbounded Expansion v1

on:
  push:
    branches:
      - validation/artist-expansion-generic-naver-pipeline-v1

permissions:
  contents: read

jobs:
  validate-universe-expansion:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unbounded artist universe regression
        run: npx tsx --test tests/artist-universe-unbounded-expansion-v1.test.mts
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install chart discovery dependency
        run: python -m pip install --disable-pip-version-check beautifulsoup4 requests
      - name: Catalog intake regression
        run: |
          python tests/artist-catalog-intake-from-chart-v1.py
          python tests/artist-catalog-review-queue-v1.py
      - name: Stage 7 multisource discovery regression
        run: |
          python tests/artist-universe-multisource-discovery-v1.py
          python tests/artist-expansion-starship-roster-adapter-v1.py
