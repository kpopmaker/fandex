name: TEMP newsIssuePoint Guarded Premerge Validation

on:
  push:
    branches:
      - validation/news-issue-point-59a3-guarded-premerge

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Verify exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "59a3c69523e7393e56915b83dc41fdf5c21fea9a"

      - name: Install exact dependencies
        run: npm ci

      - name: Run dependency security gate
        run: npm run security:audit:production

      - name: Run static checks
        run: npm run typecheck && npm run lint

      - name: Run persistence and deployment safety tests
        run: >-
          npm run test:security &&
          npm run test:persistence &&
          npm run test:ingestion:v121 &&
          npm run test:role-bootstrap &&
          npm run test:production-bootstrap &&
          npm run test:deployment-readiness &&
          npm run test:merge-safety

      - name: Verify plan-only database boundaries
        run: npm run db:migrate && npm run db:roles

      - name: Build production bundle without deployment
        run: npm run build
