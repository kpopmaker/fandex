name: Probe Brand Fit Render Production runtime v1

on:
  pull_request:
    paths:
      - '.github/workflows/probe-brand-fit-render-production-runtime-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-brand-fit-render-production-runtime-v1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Probe Render health
        shell: bash
        run: |
          set -euo pipefail
          base='https://fandex-product-self-host-v1.onrender.com'

          for attempt in $(seq 1 40); do
            status="$(curl               --silent               --show-error               --location               --retry 0               --connect-timeout 10               --max-time 20               --output /tmp/fandex-render-health.json               --write-out '%{http_code}'               "${base}/api/health" || true)"

            if [[ "${status}" == "200" ]]; then
              break
            fi

            if [[ "${attempt}" -eq 40 ]]; then
              echo "FANDEX_RENDER_HEALTH_HTTP=${status:-request-failed}"
              exit 1
            fi

            sleep 3
          done

          node <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(
            fs.readFileSync('/tmp/fandex-render-health.json', 'utf8'),
          );

          if (
            value?.ok !== true
            || value?.service !== 'fandex'
            || value?.runtime !== 'nodejs'
          ) {
            throw new Error('render-health-contract-failed');
          }

          console.log('FANDEX_RENDER_HEALTH=validated');
          NODE

      - name: Probe Render Brand Fit Product surface
        shell: bash
        run: |
          set -euo pipefail
          url='https://fandex-product-self-host-v1.onrender.com/artists/iu/fandex-beta'

          for attempt in $(seq 1 20); do
            status="$(curl               --silent               --show-error               --location               --retry 0               --connect-timeout 10               --max-time 30               --output /tmp/fandex-render-beta.html               --write-out '%{http_code}'               "${url}" || true)"

            if [[ "${status}" == "200" ]]; then
              break
            fi

            if [[ "${attempt}" -eq 20 ]]; then
              echo "FANDEX_RENDER_BETA_HTTP=${status:-request-failed}"
              exit 1
            fi

            sleep 3
          done

          node <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync(
            '/tmp/fandex-render-beta.html',
            'utf8',
          );

          const start = html.indexOf('brandFitPoint');
          const end = html.indexOf(
            'comebackActivityPoint',
            start + 'brandFitPoint'.length,
          );

          if (start < 0 || end < 0) {
            throw new Error('render-brand-fit-card-not-found');
          }

          const card = html.slice(start, end);

          const required = [
            'verified-commercial-partnership-activity',
            'Research',
            'real',
          ];

          for (const value of required) {
            if (!card.includes(value)) {
              throw new Error(
                'render-brand-fit-required-value-missing:' + value,
              );
            }
          }

          const forbidden = [
            '런타임 확인 필요',
            'durable-stored-evidence-runtime-unavailable',
            'durable-stored-evidence-not-found',
            'runtime-read-failed',
          ];

          for (const value of forbidden) {
            if (card.includes(value)) {
              throw new Error(
                'render-brand-fit-runtime-blocker-present:' + value,
              );
            }
          }

          console.log(JSON.stringify({
            renderBrandFitRuntime: 'ok',
            productSurface: '/artists/iu/fandex-beta',
            valueState:
              'verified-commercial-partnership-activity',
            lifecycle: 'research',
            materialClass: 'real',
            providerCalls: 0,
            blobWrites: 0,
            databaseWrites: 0,
            productActivations: 0,
            publications: 0,
          }));
          NODE

      - name: Safety boundary
        if: always()
        run: |
          echo "FANDEX_RENDER_PROBE_PROVIDER_EXECUTIONS=0"
          echo "FANDEX_RENDER_PROBE_DATABASE_WRITES=0"
          echo "FANDEX_RENDER_PROBE_BLOB_WRITES=0"
          echo "FANDEX_RENDER_PROBE_PRODUCT_ACTIVATIONS=0"
          echo "FANDEX_RENDER_PROBE_PUBLICATION_CHANGES=0"
          echo "FANDEX_RENDER_PROBE_CREDENTIALS_LOGGED=false"
          echo "FANDEX_RENDER_PROBE_RAW_EVIDENCE_LOGGED=false"
