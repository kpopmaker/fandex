name: Validate Momentum current evaluation logic current main v1

on:
  push:
    branches:
      - integration/momentum-current-evaluation-logic-current-main-v1
  pull_request:
    paths:
      - 'lib/intelligence/fandexNaverMediaAttentionMomentumResearch.ts'
      - 'lib/intelligence/fandexMomentumTemporalNormalizationResearch.ts'
      - 'lib/intelligence/fandexMomentumCrossFamilyCombinationResearch.ts'
      - 'lib/intelligence/fandexMomentumCurrentEvaluationPipeline.ts'
      - 'lib/lastfm-signal/**'
      - 'tests/fandex-naver-media-attention-momentum-v140.test.mts'
      - 'tests/fandex-momentum-temporal-normalization-v141.test.mts'
      - 'tests/fandex-momentum-cross-family-combination-v142.test.mts'
      - 'tests/momentum-current-evaluation-pipeline-v1.test.mts'
      - '.github/workflows/validate-momentum-current-evaluation-logic-current-main-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Frozen v140/v141/v142 and pipeline regression
        run: >-
          npx tsx --test
          tests/fandex-naver-media-attention-momentum-v140.test.mts
          tests/fandex-momentum-temporal-normalization-v141.test.mts
          tests/fandex-momentum-cross-family-combination-v142.test.mts
          tests/momentum-current-evaluation-pipeline-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
