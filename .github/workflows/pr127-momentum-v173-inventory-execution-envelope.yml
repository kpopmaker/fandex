name: PR127 momentum v173 inventory execution envelope

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - 'lib/intelligence/fandexMomentumVerifierVercelInventoryExecutionEnvelopeResearch.ts'
      - 'tests/fandex-momentum-verifier-vercel-inventory-execution-envelope-v173.test.mts'
      - 'lib/intelligence/fandexMomentumVerifierConfigurationEvidenceResearch.ts'
      - 'tests/fandex-momentum-verifier-configuration-evidence-v164.test.mts'
      - '.github/workflows/pr127-momentum-v173-inventory-execution-envelope.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate v173 and upstream regressions
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-vercel-inventory-execution-envelope-v173.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-vercel-inventory-read-channel-plan-v172.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-vercel-inventory-acquisition-v171.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-configuration-evidence-v164.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-channel-readiness-v163.test.mts
          npm run typecheck
          git diff --check
