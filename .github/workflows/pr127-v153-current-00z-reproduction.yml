name: PR127 v153 current 00Z stored-evidence reproduction

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Evaluate exact current 00Z v153 reproduced state
        run: |
          cat > .tmp-v153-current-00z.mts <<'TS'
          import {
            evaluateFandexMomentumSourceProvenanceResearch,
          } from './lib/intelligence/fandexMomentumSourceProvenanceResearch';

          const result = evaluateFandexMomentumSourceProvenanceResearch({
            snapshot: {
              canonicalArtistId: 'iu',
              naverEvidenceId: 'dae0750b1ad81f468f479328ef726e6344eaa31a62246cce3e4aeebc5d9a3f7d',
              naverCollectionKey: 'sched-v125-naver-news-20260921t000000z-f1ed381d367d',
              naverThroughSlotStart: '2026-09-21T00:00:00.000Z',
              naverStatus: 'succeeded',
              naverRawEvidenceCount: 100,
              naverNormalizedRecordCount: 100,
              naverDuplicateRecordCount: 0,
              naverRejectedItemCount: 0,
            },
            runtimeObservation: {
              observedAt: '2026-09-21T00:02:01.000Z',
              requestPath: '/api/internal/naver-news/shadow-scheduler',
              httpStatus: 200,
              deploymentId: 'dpl_6fmT3qKqeytud3kFCNVoArBGGK1K',
              branch: 'main',
            },
            storedEvidenceReproducedThisEvaluation: true,
          });

          if (result.state !== 'stored-evidence-read-reproduced') {
            throw new Error('current 00Z v153 reproduced state not reached');
          }
          if (
            result.naverEvidenceId !== 'dae0750b1ad81f468f479328ef726e6344eaa31a62246cce3e4aeebc5d9a3f7d'
            || result.naverThroughSlotStart !== '2026-09-21T00:00:00.000Z'
            || !result.futureLiveRefreshEligible
            || result.blockers.length !== 0
          ) {
            throw new Error('current 00Z provenance mismatch');
          }
          console.log('V153_CURRENT_00Z_BEGIN');
          console.log(JSON.stringify(result));
          console.log('V153_CURRENT_00Z_END');
          TS
          npx tsx --conditions=react-server .tmp-v153-current-00z.mts
          rm .tmp-v153-current-00z.mts
      - name: Regress provenance gate
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-source-provenance-v153.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-provenance-gated-refresh-v158.test.mts
          npm run typecheck
          git diff --check
