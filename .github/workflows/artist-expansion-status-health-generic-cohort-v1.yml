name: Artist Expansion Status Health Generic Cohort v1

on:
  push:
    branches:
      - validation/artist-expansion-generic-naver-pipeline-v1

permissions:
  contents: read

jobs:
  validate-generic-cohort:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Python syntax check
        run: |
          python -m py_compile scripts/fandex-cloud-migration/source/fandex_python_health_check_v3.py
          python -m py_compile scripts/fandex-cloud-migration/source/fandex_daily_summary_v3.py
          python -m py_compile scripts/fandex-cloud-migration/source/lastfm_global_interest_score_preview_v1.py
          python -m py_compile scripts/fandex-cloud-migration/source/lastfm_global_interest_rolling_score_preview_v1.py
      - name: Last.fm 11-artist score regression
        run: python tests/artist-expansion-lastfm-score-generic-cohort-v1.py
