name: TEMP NAVER newsIssuePoint Construct Validation

on:
  push:
    branches:
      - methodology/naver-news-issue-point-construct-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Focused construct test
        run: npx tsx --test tests/naver-news-issue-point-construct.test.mts

      - name: Typecheck
        run: npm run typecheck
