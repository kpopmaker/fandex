name: Dispatch NAVER Production Blob read verification v1

on:
  push:
    branches:
      - ops/invoke-naver-production-blob-read-verification-20260929-v1

permissions:
  contents: read
  actions: write

concurrency:
  group: naver-production-blob-read-verification-dispatch-v1
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_MAIN_SHA: 5bac5d1d3244ebdfdeacba7e152fcd923448c29b
      TARGET_WORKFLOW: verify-naver-production-blob-read-v1.yml
      EXECUTION_APPROVAL: ops-naver-blob-read-verification-20260929-v1
    steps:
      - name: Verify exact main and no prior probe dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          current_main="$(
            curl --fail-with-body -sS               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/kpopmaker/fandex/branches/main"             | jq -r '.commit.sha'
          )"
          test "$current_main" = "$EXPECTED_MAIN_SHA"

          prior_runs="$(
            curl --fail-with-body -sS               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "https://api.github.com/repos/kpopmaker/fandex/actions/workflows/$TARGET_WORKFLOW/runs?event=workflow_dispatch&per_page=100"             | jq '.workflow_runs | length'
          )"
          test "$prior_runs" = "0"

      - name: Dispatch approved probe exactly once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          payload="$(
            jq -nc               --arg ref "main"               --arg approval "$EXECUTION_APPROVAL"               '{ref: $ref, inputs: {execution_approval: $approval}}'
          )"

          curl --fail-with-body -sS             -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/kpopmaker/fandex/actions/workflows/$TARGET_WORKFLOW/dispatches"             -d "$payload"

          echo "NAVER_PRODUCTION_BLOB_READ_PROBE_DISPATCH=ACCEPTED"
