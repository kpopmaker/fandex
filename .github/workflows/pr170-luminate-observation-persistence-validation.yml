name: PR170 Luminate observation persistence validation

on:
  push:
    branches:
      - research/musicbrainz-album-catalog-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate append-only Luminate observation persistence path
        run: |
          npm run test:album:luminate-observation-persistence
          npx tsx --test tests/luminate-album-observation-intake-research-v1.test.mts
          npx tsx --test tests/luminate-album-authorization-research-v1.test.mts
          npx tsx --test tests/luminate-album-sales-production-candidate-research-v1.test.mts
          npx tsx --test tests/album-production-readiness-research-v1.test.mts
          npx tsx --test tests/album-normalization-research-v1.test.mts
          npx tsx --test tests/album-normalization-readiness-integration-v1.test.mts
          npm run typecheck
