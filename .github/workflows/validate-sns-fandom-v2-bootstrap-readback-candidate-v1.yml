name: Validate snsFandom v2 bootstrap readback candidate v1

on:
  pull_request:
    paths:
      - 'lib/intelligence/snsFandomYoutubeV2BootstrapReadbackCandidateV1.ts'
      - 'tests/sns-fandom-v2-bootstrap-readback-candidate-v1.test.mts'
      - 'scripts/operations/snsFandomYoutubeV2BootstrapReadbackCandidateV1.mts'
      - 'docs/research/sns-fandom-v2-bootstrap-readback-candidate-v1.md'
      - '.github/workflows/validate-sns-fandom-v2-bootstrap-readback-candidate-v1.yml'
  workflow_dispatch:
    inputs:
      verify_live_blob:
        description: Read-only manual audit of actual private Blob receipts
        type: boolean
        required: true
        default: false
      through_observed_slot_start:
        description: Latest NATURAL successful UTC-hour slot independently checked via Render and Actions
        type: string
        required: true
        default: ''

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Bootstrap chain replay and fail-closed regressions
        run: npx tsx --test tests/sns-fandom-v2-bootstrap-readback-candidate-v1.test.mts
      - name: Typecheck
        run: npm run typecheck
      - name: Offline safety boundary
        if: always()
        run: |
          echo 'readOnly=true'
          echo 'liveReadbackPerformedByPR=false'
          echo 'checkpointBodiesPersisted=0'
          echo 'blobWrites=0'
          echo 'providerCallsPerformed=false'
          echo 'historicalBackfillPerformed=false'
          echo 'productionCollectionAuthorized=false'
          echo 'productActivationAuthorized=false'

  live-readback:
    if: >-
      github.event_name == 'workflow_dispatch'
      && github.ref == 'refs/heads/main'
      && inputs.verify_live_blob == true
      && inputs.through_observed_slot_start != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.FANDEX_NAVER_EVIDENCE_BLOB_READ_WRITE_TOKEN }}
      FANDEX_SNS_FANDOM_V2_BOOTSTRAP_THROUGH_OBSERVED_SLOT: ${{ inputs.through_observed_slot_start }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Replay actual canonical and receipt bodies through corroborated horizon (read-only)
        run: |
          test -n "$BLOB_READ_WRITE_TOKEN"
          npx tsx scripts/operations/snsFandomYoutubeV2BootstrapReadbackCandidateV1.mts
      - name: Safety boundary
        if: always()
        run: |
          echo 'checkpointBodiesPersisted=0'
          echo 'blobWrites=0'
          echo 'providerCallsPerformed=false'
          echo 'historicalBackfillPerformed=false'
          echo 'schedulerMutationPerformed=false'
          echo 'providerSubmissionAuthorized=false'
          echo 'productionCollectionAuthorized=false'
          echo 'productActivationAuthorized=false'
