name: Album Observation ID Determinism Validation

on:
  push:
    branches:
      - integration/album-first-bounded-production-research-write
    paths:
      - ".github/workflows/album-observation-id-determinism-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Direct observation ID determinism
        run: npx tsx --test tests/album-direct-observation-id-determinism-v1.test.mts
      - name: Album regression suite
        run: >-
          npx tsx --test
          tests/album-provider-executor-binding-v1.test.mts
          tests/album-reviewed-subset-normalizer-v1.test.mts
          tests/album-research-observation-intake-v1.test.mts
          tests/album-research-persistence-writer-v1.test.mts
          tests/album-bounded-production-research-write-gate-v1.test.mts
      - name: Typecheck
        run: npm run typecheck
