name: PR170 Luminate handoff packet validation

on:
  push:
    branches:
      - research/musicbrainz-album-catalog-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate Luminate handoff packet
        run: |
          npx tsx --test tests/iu-luminate-license-handoff-docs-v1.test.mts
          npx tsx --test tests/iu-luminate-licensed-bootstrap-command-research-v1.test.mts
          npx tsx --test tests/iu-luminate-production-review-gate-research-v1.test.mts
          npm run typecheck
