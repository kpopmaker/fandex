name: TEMP newsIssuePoint Activation Readiness Current-Base Validation

on:
  push:
    branches:
      - validation/news-issue-point-activation-readiness-de1a62

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Verify exact successor parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "de1a6277ce146df163f62fa1ab2b227583e9adf7"

      - name: Install exact dependencies
        run: npm ci

      - name: Production dependency security
        run: npm run security:audit:production

      - name: Activation readiness
        run: node --import tsx --test tests/product-news-issue-point-activation-readiness-v1.test.mts

      - name: Promotion control and Product regressions
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/product-news-issue-point-promotion-authorization-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-promotion-gate-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-read-boundary-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-selector-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-candidate-v1.test.mts
          node --import tsx --test tests/intelligence-variable-confidence-v1.test.mts
          node --import tsx --test tests/product-variable-boundary-v1.test.mts
          node --import tsx --test tests/product-evidence-boundary-v1.test.mts

      - name: Stored Evidence lineage
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/naver-news-canonical-job-evidence-v130.test.mts
          node --import tsx --test tests/naver-news-canonical-observation-v130.test.mts

      - name: Static checks
        run: npm run typecheck && npm run lint

      - name: Production build
        run: npm run build

      - name: Diff checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 752a850e2002695e30b119db3e70f93d4e5d7477...de1a6277ce146df163f62fa1ab2b227583e9adf7
          git diff --check de1a6277ce146df163f62fa1ab2b227583e9adf7...HEAD
