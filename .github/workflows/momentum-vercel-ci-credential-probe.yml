name: Momentum Vercel CI Credential Probe

on:
  push:
    branches:
      - verify/momentum-v153-stored-evidence-live
    paths:
      - '.github/workflows/momentum-vercel-ci-credential-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check Vercel CI credentials without printing values
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name:-}" ]; then
              echo "${name}=missing"
              missing=1
            else
              echo "${name}=configured"
            fi
          done
          exit "$missing"
