name: PR170 Luminate acquisition handoff validation

on:
  push:
    branches:
      - research/musicbrainz-album-catalog-v1

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate Luminate acquisition handoff
        run: |
          npx tsx --test tests/luminate-album-acquisition-handoff-research-v1.test.mts
          npx tsx --test tests/luminate-album-authorization-research-v1.test.mts
          npx tsx --test tests/luminate-album-observation-intake-research-v1.test.mts
          npx tsx --test tests/iu-luminate-stored-normalization-research-v1.test.mts
          npx tsx --test tests/album-production-readiness-research-v1.test.mts
          npm run typecheck
