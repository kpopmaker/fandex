name: Album Research Observation Intake Validation

on:
  push:
    branches:
      - integration/album-research-observation-intake

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run research observation intake tests
        run: npx tsx --test tests/album-research-observation-intake-v1.test.mts tests/album-research-observation-current-view-v1.test.mts
      - name: Run persistence regression tests
        run: npx tsx --test tests/album-persistence-integration-depth-v1.test.mts
      - name: Run reviewed subset regression tests
        run: npx tsx --test tests/album-reviewed-subset-normalizer-v1.test.mts tests/album-reviewed-identity-mapping-packet-v1.test.mts
      - name: Typecheck
        run: npm run typecheck
