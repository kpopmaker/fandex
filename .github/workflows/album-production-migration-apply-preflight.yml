name: Album Production Migration Apply Preflight

on:
  push:
    branches:
      - integration/album-production-migration-apply

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run exact migration gate regression
        run: npx tsx --test tests/album-production-migration-gate-v1.test.mts tests/album-research-persistence-sql-contract-v1.test.mts
      - name: Plan exact production migration runner
        run: npx tsx scripts/database/apply-album-production-migration-v1.mts
      - name: Typecheck
        run: npm run typecheck
