name: TEMP newsIssuePoint Promotion Disable Validation

on:
  push:
    branches:
      - validation/news-issue-point-promotion-disable-a769

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm
      - name: Verify exact source parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "a769b23787948eed1e0ea9fdb11d727ddabc53d0"
      - name: Install exact dependencies
        run: npm ci
      - name: Production dependency security
        run: npm run security:audit:production
      - name: Promotion authorization and disable regressions
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/product-news-issue-point-promotion-authorization-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-promotion-gate-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-selector-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-candidate-v1.test.mts
          node --import tsx --test tests/intelligence-variable-confidence-v1.test.mts
          node --import tsx --test tests/product-variable-boundary-v1.test.mts
      - name: Static checks
        run: npm run typecheck && npm run lint
      - name: Production build
        run: npm run build
      - name: Diff sanity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 2cb01343ae2cb51b551ceb7f873442e310217ba7...a769b23787948eed1e0ea9fdb11d727ddabc53d0
