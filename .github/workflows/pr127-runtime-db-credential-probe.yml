name: PR127 runtime DB credential availability probe

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - '.github/workflows/pr127-runtime-db-credential-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Check runtime DB credential availability without printing value
        shell: bash
        env:
          FANDEX_RUNTIME_DATABASE_URL: ${{ secrets.FANDEX_RUNTIME_DATABASE_URL }}
        run: |
          set -euo pipefail
          if [ -n "${FANDEX_RUNTIME_DATABASE_URL:-}" ]; then
            echo "FANDEX_RUNTIME_DATABASE_URL=configured"
          else
            echo "FANDEX_RUNTIME_DATABASE_URL=missing"
            exit 2
          fi
