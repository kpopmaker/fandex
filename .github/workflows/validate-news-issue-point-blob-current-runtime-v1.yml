name: Validate newsIssuePoint Blob current runtime v1

on:
  pull_request:
    paths:
      - 'lib/server/product/naverNewsIssuePointBlobRuntimeRead.ts'
      - 'lib/server/product/naverNewsBlobReadStageTiming.ts'
      - 'lib/server/product/fandexCurrentRuntimeAssemblyReadiness.ts'
      - 'lib/server/product/fandexArtistEndToEndRuntime.ts'
      - 'lib/server/ingestion/naverNewsStoredEvidenceMirror.ts'
      - 'lib/server/ingestion/naverNewsBlobMirrorRuntime.ts'
      - 'lib/server/ingestion/naverNewsShadowFirstSeenSeries.ts'
      - 'lib/server/ingestion/naverNewsLatestOfficialShadowSlot.ts'
      - 'tests/naver-news-issue-point-blob-runtime-read-v1.test.mts'
      - 'tests/naver-news-blob-read-stage-timing-v1.test.mts'
      - 'tests/naver-news-blob-current-evidence-coverage-v1.test.mts'
      - 'tests/naver-news-stored-evidence-mirror-v1.test.mts'
      - 'tests/product-news-issue-point-real-read-boundary-v1.test.mts'
      - 'tests/fandex-current-runtime-assembly-readiness-v1.test.mts'
      - '.github/workflows/validate-news-issue-point-blob-current-runtime-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/naver-news-issue-point-blob-runtime-read-v1.test.mts tests/naver-news-blob-read-stage-timing-v1.test.mts tests/naver-news-blob-current-evidence-coverage-v1.test.mts tests/naver-news-stored-evidence-mirror-v1.test.mts tests/product-news-issue-point-real-read-boundary-v1.test.mts tests/fandex-current-runtime-assembly-readiness-v1.test.mts tests/risk-adjustment-news-issue-projection-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
