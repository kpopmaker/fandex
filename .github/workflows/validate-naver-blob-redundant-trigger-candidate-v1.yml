name: Validate NAVER GitHub automatic schedule disable v1

on:
  push:
    branches:
      - integration/ops-naver-github-schedule-disable-v1
  pull_request:
    paths:
      - '.github/workflows/naver-news-blob-only-recurring-production-v1.yml'
      - '.github/workflows/validate-naver-blob-redundant-trigger-candidate-v1.yml'
      - 'tests/naver-news-blob-only-direct-v1.test.mts'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Assert Render-canonical manual-dispatch contract
        shell: bash
        run: |
          set -euo pipefail

          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync(
            '.github/workflows/naver-news-blob-only-recurring-production-v1.yml',
            'utf8',
          );
          const required = [
            'workflow_dispatch:',
            "github.event_name == 'workflow_dispatch'",
            "inputs.execution_approval == 'approved-github-actions-blob-only-recurring-v1'",
            "runStatus === 'already-finalized'",
            "providerCalls === 0",
            "runStatus === 'collected-and-finalized'",
            "providerCalls === 1",
            "databaseWrites=0",
            "productActivations=0",
          ];
          for (const token of required) {
            if (!source.includes(token)) {
              console.error('missing_contract_token:' + token);
              process.exit(2);
            }
          }
          const forbidden = [
            'schedule:',
            "cron: '17 * * * *'",
            "cron: '37 * * * *'",
            "cron: '57 * * * *'",
            "github.event_name == 'schedule'",
            'github.event.schedule',
            'FANDEX_NAVER_BLOB_REDUNDANT_TRIGGER_ENABLED',
          ];
          for (const token of forbidden) {
            if (source.includes(token)) {
              console.error('forbidden_automatic_schedule_token:' + token);
              process.exit(3);
            }
          }
          console.log('FANDEX_NAVER_GITHUB_AUTOMATIC_SCHEDULE=disabled');
          console.log('manualWorkflowDispatchPreserved=true');
          console.log('sameSlotProviderSkipProtected=true');
          console.log('databaseWrites=0');
          console.log('productActivations=0');
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Direct Blob runner regression
        run: npx tsx --test tests/naver-news-blob-only-direct-v1.test.mts
