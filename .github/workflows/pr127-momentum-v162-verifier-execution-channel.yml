name: PR127 momentum v162 verifier execution channel

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - 'lib/server/ingestion/naverNewsMomentumVerifierExecutionChannel.ts'
      - 'app/api/internal/naver-news/momentum-verifier/route.ts'
      - 'tests/fandex-momentum-verifier-execution-channel-v162.test.mts'
      - '.github/workflows/pr127-momentum-v162-verifier-execution-channel.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate v162 and native verifier regressions
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-execution-channel-v162.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-native-verifier-output-v161.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-output-attestation-v160.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-stored-evidence-attestation-v159.test.mts
          npm run typecheck
          git diff --check
