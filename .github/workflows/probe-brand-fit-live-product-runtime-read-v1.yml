name: Probe Brand Fit live Product runtime read v1

on:
  pull_request:
    paths:
      - 'scripts/operations/brandFitProductRuntimeReadProbeV1.mts'
      - '.github/workflows/probe-brand-fit-live-product-runtime-read-v1.yml'

permissions:
  contents: read

jobs:
  probe:
    if: >-
      github.repository == 'kpopmaker/fandex' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_PROJECT_ID: 'prj_aT3p8zmjyochu8iGmFOuNR1lSU7v'
      VERCEL_TEAM_ID: 'team_OrRPxuBxMwCYU3kk0r76AfOs'
      VERCEL_ENV: 'production'
      FANDEX_BRAND_FIT_EVIDENCE_BLOB_STORE_ID: 'store_oe4nEFW5ox93XB8v'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Mint short-lived Vercel project OIDC token
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          (async () => {
            const accessToken = String(process.env.VERCEL_TOKEN ?? '').trim();
            if (!accessToken) {
              throw new Error('brand_fit_live_probe_vercel_token_missing');
            }

            const url = new URL(
              'https://api.vercel.com/v1/projects/'
                + encodeURIComponent(process.env.VERCEL_PROJECT_ID)
                + '/token',
            );
            url.searchParams.set('teamId', process.env.VERCEL_TEAM_ID);

            const response = await fetch(url, {
              method: 'POST',
              headers: {
                Authorization: 'Bearer ' + accessToken,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({
                source: 'github-actions:brand-fit-live-product-runtime-read-v1',
              }),
            });

            if (!response.ok) {
              throw new Error(
                'brand_fit_live_probe_oidc_mint_failed:'
                  + response.status,
              );
            }

            const payload = await response.json();
            const oidcToken = String(payload.token ?? '').trim();
            if (oidcToken.length < 32 || /\s/.test(oidcToken)) {
              throw new Error(
                'brand_fit_live_probe_oidc_response_invalid',
              );
            }

            process.stdout.write('::add-mask::' + oidcToken + '\n');
            fs.appendFileSync(
              process.env.GITHUB_ENV,
              'VERCEL_OIDC_TOKEN=' + oidcToken + '\n',
            );
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Read live Brand Fit durable evidence through Product runtime
        run: >-
          npx tsx --conditions=react-server
          scripts/operations/brandFitProductRuntimeReadProbeV1.mts

      - name: Verify actual Production readiness endpoint sees Brand Fit
        shell: bash
        env:
          PROBE_SECRET: ${{ secrets.FANDEX_NAVER_NEWS_SCHEDULER_SECRET }}
        run: |
          set -euo pipefail
          test -n "$PROBE_SECRET"

          status="$(
            curl \
              --silent \
              --show-error \
              --request POST \
              --retry 0 \
              --output /tmp/fandex-production-readiness.json \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer ${PROBE_SECRET}" \
              --header 'X-Fandex-Product-Runtime-Probe-Id: ops-fandex-product-runtime-readiness-20261004-v1' \
              --header 'X-Fandex-Probe-Source: github-actions-manual-v1' \
              'https://fandex-eta.vercel.app/api/internal/fandex/product-runtime-readiness'
          )"

          if [[ "$status" != "200" ]]; then
            echo "BRAND_FIT_PRODUCTION_RUNTIME_HTTP_STATUS=$status"
            exit 1
          fi

          node <<'NODE'
          const fs = require('node:fs');
          const value = JSON.parse(
            fs.readFileSync(
              '/tmp/fandex-production-readiness.json',
              'utf8',
            ),
          );

          const states = Array.isArray(value?.variableStates)
            ? value.variableStates
            : [];
          const brandFit = states.find(
            (entry) => entry?.variableId === 'brandFitPoint',
          );

          const valid =
            value?.ok === true
            && value?.mode === 'fandex-product-runtime-readiness-probe'
            && value?.canonicalArtistId === 'iu'
            && brandFit?.sourceState === 'resolved'
            && brandFit?.adapterState === 'ok'
            && brandFit?.reason === null
            && Array.isArray(value?.resolvedVariableIds)
            && value.resolvedVariableIds.includes('brandFitPoint')
            && value?.scoreCalculated === false
            && value?.methodologyFinalized === false
            && value?.publicRouteActivated === false
            && value?.providerExecutionPerformed === false
            && value?.writeOperationsAuthorized === false;

          if (!valid) {
            console.log(JSON.stringify({
              productionRuntimeStatus: value?.status ?? null,
              brandFitSourceState: brandFit?.sourceState ?? null,
              brandFitAdapterState: brandFit?.adapterState ?? null,
              brandFitReason: brandFit?.reason ?? null,
              brandFitResolved:
                Array.isArray(value?.resolvedVariableIds)
                && value.resolvedVariableIds.includes('brandFitPoint'),
              scoreCalculated: value?.scoreCalculated ?? null,
              methodologyFinalized: value?.methodologyFinalized ?? null,
              publicRouteActivated: value?.publicRouteActivated ?? null,
              providerExecutionPerformed:
                value?.providerExecutionPerformed ?? null,
              writeOperationsAuthorized:
                value?.writeOperationsAuthorized ?? null,
            }));
            process.exit(1);
          }

          console.log(JSON.stringify({
            productionRuntimeProbe: 'ok',
            productionRuntimeStatus: value.status,
            brandFitSourceState: brandFit.sourceState,
            brandFitAdapterState: brandFit.adapterState,
            brandFitReason: brandFit.reason,
            brandFitResolved: true,
            scoreCalculated: value.scoreCalculated,
            methodologyFinalized: value.methodologyFinalized,
            publicRouteActivated: value.publicRouteActivated,
            providerExecutionPerformed:
              value.providerExecutionPerformed,
            writeOperationsAuthorized:
              value.writeOperationsAuthorized,
          }));
          NODE

      - name: Safety boundary
        if: always()
        run: |
          echo "BRAND_FIT_LIVE_RUNTIME_PROVIDER_CALLS=0"
          echo "BRAND_FIT_LIVE_RUNTIME_BLOB_WRITES=0"
          echo "BRAND_FIT_LIVE_RUNTIME_DATABASE_WRITES=0"
          echo "BRAND_FIT_LIVE_RUNTIME_PRODUCT_ACTIVATIONS=0"
          echo "BRAND_FIT_LIVE_RUNTIME_PUBLICATIONS=0"
          echo "BRAND_FIT_LIVE_RUNTIME_DEPLOYS=0"
          echo "BRAND_FIT_LIVE_RUNTIME_RAW_EVIDENCE_LOGGED=false"
          echo "BRAND_FIT_LIVE_RUNTIME_CREDENTIALS_LOGGED=false"
