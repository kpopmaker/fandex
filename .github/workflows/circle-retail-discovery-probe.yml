name: Circle Retail Discovery Probe

on:
  push:
    branches:
      - integration/album-circle-retail-discovery

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect Circle retail List structure
        shell: bash
        run: |
          node <<'NODE'
          (async () => {
            const pageUrl = 'https://circlechart.kr/page_chart/retail.circle?termGbn=day&yyyymmdd=20260529';
            const endpointUrl = 'https://circlechart.kr/data/api/chart/retail_list';
            const baseHeaders = {
              'user-agent': 'Mozilla/5.0 (compatible; FANDEX-Research-Discovery/1.0)',
              'accept': 'text/html,application/xhtml+xml,application/json,text/javascript,*/*;q=0.8',
            };

            const pageResponse = await fetch(pageUrl, {
              method: 'GET',
              headers: baseHeaders,
              redirect: 'follow',
              signal: AbortSignal.timeout(15000),
            });
            const cookieHeader = pageResponse.headers.get('set-cookie');
            const cookie = cookieHeader ? cookieHeader.split(';', 1)[0] : null;
            await pageResponse.text();

            const requestHeaders = {
              ...baseHeaders,
              'accept': 'application/json,text/javascript,*/*;q=0.01',
              'content-type': 'application/x-www-form-urlencoded; charset=UTF-8',
              'x-requested-with': 'XMLHttpRequest',
              'referer': pageUrl,
            };
            if (cookie) requestHeaders.cookie = cookie;

            const response = await fetch(endpointUrl, {
              method: 'POST',
              headers: requestHeaders,
              body: new URLSearchParams({ termGbn: 'day', yyyymmdd: '20260529' }).toString(),
              redirect: 'follow',
              signal: AbortSignal.timeout(15000),
            });
            const parsed = JSON.parse(await response.text());

            function typeOf(value) {
              if (value === null) return 'null';
              if (Array.isArray(value)) return 'array';
              return typeof value;
            }

            console.log('FANDEX_CIRCLE_RETAIL_LIST_META=' + JSON.stringify({
              endpointUrl,
              method: 'POST',
              requestFields: ['termGbn', 'yyyymmdd'],
              status: response.status,
              contentType: response.headers.get('content-type'),
              rootKeys: Object.keys(parsed).sort(),
              rootTypes: Object.fromEntries(Object.entries(parsed).map(([key, value]) => [key, typeOf(value)])),
              resultStatus: parsed.ResultStatus ?? null,
            }));

            const list = parsed.List;
            console.log('FANDEX_CIRCLE_RETAIL_LIST_VALUE=' + JSON.stringify({
              type: typeOf(list),
              length: typeof list === 'string' || Array.isArray(list) ? list.length : null,
              keys: list && typeof list === 'object' && !Array.isArray(list) ? Object.keys(list).slice(0, 40) : [],
              prefix: typeof list === 'string' ? list.slice(0, 500).replace(/\s+/g, ' ') : null,
            }));

            let rows = null;
            let rowPath = null;
            if (Array.isArray(list)) {
              rows = list;
              rowPath = '$.List';
            } else if (list && typeof list === 'object') {
              const entries = Object.entries(list);
              for (const [key, value] of entries) {
                if (Array.isArray(value)) {
                  rows = value;
                  rowPath = `$.List.${key}`;
                  break;
                }
              }
              if (!rows) {
                const objectValues = entries.map(([, value]) => value).filter((value) => value && typeof value === 'object' && !Array.isArray(value));
                if (objectValues.length) {
                  rows = objectValues;
                  rowPath = '$.List{values}';
                }
              }
            } else if (typeof list === 'string') {
              try {
                const nested = JSON.parse(list);
                if (Array.isArray(nested)) {
                  rows = nested;
                  rowPath = '$.List(JSON)';
                } else if (nested && typeof nested === 'object') {
                  const nestedArrays = Object.entries(nested).find(([, value]) => Array.isArray(value));
                  if (nestedArrays) {
                    rows = nestedArrays[1];
                    rowPath = `$.List(JSON).${nestedArrays[0]}`;
                  }
                }
              } catch {}
            }

            if (!rows || rows.length === 0) {
              console.log('FANDEX_CIRCLE_RETAIL_ROWS=' + JSON.stringify({ rowPath, rowCount: rows?.length ?? 0 }));
              return;
            }

            const row = rows[0];
            if (!row || typeof row !== 'object' || Array.isArray(row)) {
              console.log('FANDEX_CIRCLE_RETAIL_ROWS=' + JSON.stringify({ rowPath, rowCount: rows.length, firstRowType: typeOf(row) }));
              return;
            }

            const keys = Object.keys(row).sort();
            const sample = Object.fromEntries(keys.map((key) => {
              const value = row[key];
              if (typeof value === 'string') return [key, value.length > 160 ? value.slice(0, 160) + '…' : value];
              if (typeof value === 'number' || typeof value === 'boolean' || value === null) return [key, value];
              return [key, `[${typeOf(value)}]`];
            }));

            console.log('FANDEX_CIRCLE_RETAIL_ROWS=' + JSON.stringify({
              rowPath,
              rowCount: rows.length,
              firstRowKeys: keys,
              firstRowTypes: Object.fromEntries(keys.map((key) => [key, typeOf(row[key])])),
              firstRowSample: sample,
            }));
          })().catch((error) => {
            console.error('FANDEX_CIRCLE_PROBE_FATAL=' + JSON.stringify({ error: error instanceof Error ? error.message : String(error) }));
            process.exitCode = 1;
          });
          NODE
