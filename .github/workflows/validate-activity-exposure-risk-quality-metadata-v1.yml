name: Validate Activity Exposure Risk quality metadata v1

on:
  pull_request:
    paths:
      - 'lib/product/adapters/activityExposureRiskQualityMetadata.ts'
      - 'tests/activity-exposure-risk-quality-metadata-v1.test.mts'
      - '.github/workflows/validate-activity-exposure-risk-quality-metadata-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/activity-exposure-risk-quality-metadata-v1.test.mts
      - run: npm run typecheck
