name: Validate snsFandom real analytics reporting surface v1

on:
  push:
    branches:
      - 'deploy/sns-fandom-analytics-evidence-isolated-v1'
    paths:
      - 'lib/product/presentation/snsFandomYoutubeAnalyticsReportingSurface.ts'
      - 'app/components/SnsFandomYoutubeAnalyticsReportingSurface.tsx'
      - 'app/youtube-analytics-evidence/page.tsx'
      - 'tests/sns-fandom-youtube-analytics-reporting-surface-v1.test.mts'
      - 'tests/sns-fandom-youtube-real-analytics-reporting-surface-v1.test.mts'
      - 'docs/research/sns-fandom-youtube-audit-evidence-refs-v1.json'
      - '.github/workflows/validate-sns-fandom-real-analytics-reporting-surface-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/sns-fandom-youtube-analytics-reporting-surface-v1.test.mts tests/sns-fandom-youtube-real-analytics-reporting-surface-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
