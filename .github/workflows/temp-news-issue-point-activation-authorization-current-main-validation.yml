name: TEMP newsIssuePoint Activation Authorization Current-Main Validation

on:
  push:
    branches:
      - validation/news-issue-point-activation-authorization-f105fe

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact feature parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f105fec04ab1defd98088a56284d083380b5965e"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Production dependency security
        run: npm run security:audit:production
      - name: Activation authorization
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-activation-authorization-v1.test.mts
      - name: Activation readiness regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-activation-readiness-v1.test.mts
      - name: Product Operations approval regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-product-operations-approval-v1.test.mts
      - name: Promotion authorization/control regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-promotion-authorization-v1.test.mts
      - name: Real Product read and Evidence regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-real-read-boundary-v1.test.mts
      - name: Promotion gate regression
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-real-promotion-gate-v1.test.mts
      - name: Selector and candidate regressions
        run: npx tsx --conditions=react-server --test tests/product-news-issue-point-real-selector-v1.test.mts tests/product-news-issue-point-real-candidate-v1.test.mts
      - name: Registry regression
        run: npx tsx --conditions=react-server --test tests/intelligence-variable-confidence-v1.test.mts
      - name: Product boundary regressions
        run: npx tsx --conditions=react-server --test tests/product-variable-boundary-v1.test.mts tests/product-evidence-boundary-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - name: Production build
        env:
          NODE_ENV: production
        run: npm run build
      - name: Diff sanity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 3fec2776ed732abfae642d56d1c234e2e6d9a157...f105fec04ab1defd98088a56284d083380b5965e
          git diff --check f105fec04ab1defd98088a56284d083380b5965e...HEAD
