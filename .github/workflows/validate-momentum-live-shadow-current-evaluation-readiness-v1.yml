name: Validate Momentum live-shadow current evaluation readiness v1

on:
  push:
    branches:
      - work/momentum-live-shadow-current-evaluation-readiness-v1

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        run: |
          git diff --name-only e5d828d3cf8a198c17e0983b8b3d7c3722e4d571...HEAD | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/validate-momentum-live-shadow-current-evaluation-readiness-v1.yml
          data/momentum-product/iu_momentum_live_shadow_source_currentness_audit_v1.json
          lib/product/readiness/momentumLiveShadowProductReadiness.ts
          lib/product/readiness/momentumPostExecutionProductReadiness.ts
          lib/server/product/momentumLiveShadowProductReadiness.ts
          tests/momentum-live-shadow-product-readiness-v1.test.mts
          tests/momentum-post-execution-product-readiness-v1.test.mts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Momentum live-shadow current evaluation readiness
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-live-shadow-product-readiness-v1.test.mts

      - name: Momentum post-execution readiness regression
        run: npx tsx --test tests/momentum-post-execution-product-readiness-v1.test.mts

      - name: Real IU runtime Stored Evidence read regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-evidence-consensus-runtime-read-v1.test.mts

      - name: Momentum Evidence Consensus Product contract regression
        run: npx tsx --test tests/momentum-evidence-consensus-product-contract-v1.test.mts

      - name: Consumed execution regression
        run: npx tsx --test tests/momentum-native-verifier-production-execution-authorization-v1.test.mts

      - name: Activity Exposure Production regression
        run: npx tsx --test tests/activity-exposure-public-route-cutover-execution-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
