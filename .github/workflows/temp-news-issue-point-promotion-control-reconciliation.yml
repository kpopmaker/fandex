name: TEMP newsIssuePoint Promotion Control Reconciliation

on:
  push:
    branches:
      - validation/news-issue-point-promotion-control-7d2245

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Verify exact successor parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "7d22456eb2e5a244fc20338265249daf5239f4d7"
          test "$(git merge-base HEAD 7d22456eb2e5a244fc20338265249daf5239f4d7)" = "7d22456eb2e5a244fc20338265249daf5239f4d7"

      - name: Install exact dependencies
        run: npm ci

      - name: Production dependency security
        run: npm run security:audit:production

      - name: Promotion authorization and revocation controls
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/product-news-issue-point-promotion-authorization-v1.test.mts

      - name: Promotion and Product boundary regressions
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/product-news-issue-point-real-promotion-gate-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-read-boundary-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-selector-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-candidate-v1.test.mts
          node --import tsx --test tests/product-variable-boundary-v1.test.mts
          node --import tsx --test tests/product-evidence-boundary-v1.test.mts
          node --import tsx --test tests/intelligence-variable-confidence-v1.test.mts
          node --import tsx --test tests/temp-promotion-control-other-six-isolation.test.mts

      - name: Stored Evidence lineage regression
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/naver-news-canonical-job-evidence-v130.test.mts
          node --import tsx --test tests/naver-news-canonical-observation-v130.test.mts

      - name: Static checks
        run: npm run typecheck && npm run lint

      - name: Production build
        run: npm run build

      - name: Diff checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 8c8a4b7795baf17d7cabac8089d0f5eed50e196d...7d22456eb2e5a244fc20338265249daf5239f4d7
          git diff --check 7d22456eb2e5a244fc20338265249daf5239f4d7...HEAD
