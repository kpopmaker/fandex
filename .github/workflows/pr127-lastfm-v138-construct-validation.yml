name: PR127 Lastfm v138 construct alignment validation

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate v138 and upstream Last.fm regressions
        run: |
          npx tsx --conditions=react-server --test tests/lastfm-momentum-construct-alignment-v138.test.mts
          npx tsx --conditions=react-server --test tests/lastfm-historical-shadow-checkpoint-v137.test.mts
          npx tsx --conditions=react-server --test tests/lastfm-repeated-shadow-reconciliation-v136.test.mts
          npm run typecheck
      - name: Review current main genuine Last.fm history
        run: |
          git fetch origin main
          BRANCH_SEED="$(git rev-parse HEAD:app/data/v4/metrics/artistMonthlyMetricSeed.ts)"
          MAIN_SEED="$(git rev-parse origin/main:app/data/v4/metrics/artistMonthlyMetricSeed.ts)"
          test "$BRANCH_SEED" = "$MAIN_SEED"
          git show origin/main:data/lastfm-cloud/lastfm_artist_interest_history_v1.csv > /tmp/main-lastfm-history.csv
          npx tsx --conditions=react-server scripts/lastfm-shadow/research-lastfm-v138-construct-review.mts --history /tmp/main-lastfm-history.csv > /tmp/v138-output.txt
          node - <<'NODE'
          const fs = require('fs');
          const raw = fs.readFileSync('/tmp/v138-output.txt','utf8');
          const start = raw.indexOf('{');
          if (start < 0) throw new Error('missing v138 json');
          const x = JSON.parse(raw.slice(start));
          if (x.decision.directReplacementAllowed !== false) throw new Error('direct replacement unexpectedly allowed');
          if (x.decision.legacyDivergencePromotionGate !== false) throw new Error('legacy divergence unexpectedly gates promotion');
          if (x.decision.v136ReadinessCanAuthorizePromotion !== false) throw new Error('v136 unexpectedly authorizes promotion');
          if (x.decision.syntheticSeedBackfillAllowed !== false) throw new Error('synthetic backfill unexpectedly allowed');
          if (x.decision.productActivationAllowed !== false || x.decision.productionEligible !== false) {
            throw new Error('product/production boundary violated');
          }
          console.log(JSON.stringify({
            contractVersion: x.contractVersion,
            state: x.state,
            lastfmConstruct: x.constructs.lastfm,
            fandexMomentumConstruct: x.constructs.fandexMomentum,
            equivalentForDirectReplacement: x.constructs.equivalentForDirectReplacement,
            legacySourceStage: x.legacyComparator.sourceStage,
            legacyQuality: x.legacyComparator.qualityLabel,
            legacyFormulaSeedVerified: x.legacyComparator.formulaSeedVerified,
            legacyComparatorRole: x.legacyComparator.role,
            comparableArtistCount: x.legacyComparator.comparableArtistCount,
            expectedArtistCount: x.legacyComparator.expectedArtistCount,
            missingArtistIds: x.legacyComparator.missingArtistIds,
            v137State: x.checkpoint.state,
            replaySnapshotCount: x.checkpoint.replaySnapshotCount,
            latestCoverage: x.checkpoint.latestCoverage,
            latestMeanAbsNormalizedDelta: x.checkpoint.latestMeanAbsoluteNormalizedDelta,
            latestMeanAbsRankDelta: x.checkpoint.latestMeanAbsoluteRankDelta,
            recommendedRole: x.decision.recommendedRole,
            futureCompositeOrConstructRedefinitionRequiredForProductMomentum:
              x.decision.futureCompositeOrConstructRedefinitionRequiredForProductMomentum,
            reasons: x.reasons,
            digest: x.digest
          }, null, 2));
          NODE
