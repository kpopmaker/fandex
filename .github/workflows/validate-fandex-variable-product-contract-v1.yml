name: Validate FANDEX common variable Product contract v1

on:
  pull_request:
    paths:
      - 'lib/product/contracts/fandexVariableProduct.ts'
      - 'tests/fandex-variable-product-contract-v1.test.mts'
      - '.github/workflows/validate-fandex-variable-product-contract-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx tsx --test tests/fandex-variable-product-contract-v1.test.mts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
