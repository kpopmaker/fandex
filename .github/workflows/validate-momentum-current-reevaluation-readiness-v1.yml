name: Validate Momentum current reevaluation readiness v1

on:
  pull_request:
    paths:
      - 'lib/intelligence/fandexMomentumCurrentReevaluationReadiness.ts'
      - 'scripts/operations/momentumCurrentReevaluationReadinessV1.mts'
      - '.github/workflows/momentum-current-reevaluation-readiness-v1.yml'
      - '.github/workflows/validate-momentum-current-reevaluation-readiness-v1.yml'
      - 'tests/momentum-current-reevaluation-readiness-v1.test.mts'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Assert Production Blob secret binding contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const source = fs.readFileSync(
            '.github/workflows/momentum-current-reevaluation-readiness-v1.yml',
            'utf8',
          );
          const required = 'BLOB_READ_WRITE_TOKEN: ${{ secrets.FANDEX_NAVER_EVIDENCE_BLOB_READ_WRITE_TOKEN }}';
          const forbidden = 'BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}';
          if (!source.includes(required)) {
            console.error('missing_naver_evidence_blob_secret_binding');
            process.exit(2);
          }
          if (source.includes(forbidden)) {
            console.error('obsolete_blob_secret_binding_present');
            process.exit(3);
          }
          console.log('momentumReadinessBlobSecretBinding=valid');
          NODE

      - run: npm ci

      - name: Current reevaluation readiness regression
        run: npx tsx --test tests/momentum-current-reevaluation-readiness-v1.test.mts

      - name: Blob recovery continuity regression
        run: npx tsx --test tests/momentum-recovery-continuity-gate-v1.test.mts

      - name: Typecheck
        run: npm run typecheck
