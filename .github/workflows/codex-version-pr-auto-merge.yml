name: FANDEX Codex Version PR Auto Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed, edited, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]

permissions: {}

concurrency:
  group: codex-version-pr-auto-merge-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  authorize:
    if: >-
      github.event.pull_request.base.ref == 'main' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login == github.repository_owner &&
      github.event.pull_request.state == 'open' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'production-merge-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out trusted base authorization evaluator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up trusted authorization runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verify exact-head human merge authorization
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ ! "${HEAD_REF}" =~ ^v[0-9]+- ]]; then
            echo "Refusing non-version branch: ${HEAD_REF}"
            exit 1
          fi

          pr_snapshot="$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json state,baseRefName,headRefOid,baseRefOid,labels)"
          current_state="$(jq -r '.state' <<<"${pr_snapshot}")"
          current_base_ref="$(jq -r '.baseRefName' <<<"${pr_snapshot}")"
          current_head="$(jq -r '.headRefOid' <<<"${pr_snapshot}")"
          current_base="$(jq -r '.baseRefOid' <<<"${pr_snapshot}")"
          if [[ "${current_state}" != "OPEN" || "${current_base_ref}" != "main" \
              || "${current_head}" != "${HEAD_SHA}" || "${current_base}" != "${BASE_SHA}" ]]; then
            echo "PR state, base ref, head, or base changed; refusing authorization."
            exit 1
          fi

          label_count="$(jq '[.labels[].name | select(. == "production-merge-approved")] | length' <<<"${pr_snapshot}")"
          if [[ "${label_count}" != "1" ]]; then
            echo "The exact production-merge-approved label is required."
            exit 1
          fi

          review_pages="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate --slurp)"
          review_decision="$(node scripts/github/evaluate-version-pr-reviews.mjs \
            --head-sha "${HEAD_SHA}" --pr-author "${PR_AUTHOR}" <<<"${review_pages}")"
          if [[ "$(jq -r '.authorized' <<<"${review_decision}")" != "true" ]]; then
            echo "A current trusted APPROVED review and zero current trusted changes requests are required."
            exit 1
          fi

  validate:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Check out exact authorized base without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compose exact authorized base and head for validation
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${BASE_SHA}"
          git cat-file -e "${HEAD_SHA}^{commit}"
          git checkout --detach "${BASE_SHA}"
          git merge --no-commit --no-ff "${HEAD_SHA}"
          test -z "$(git ls-files --unmerged)"
          git diff --check --cached

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Run dependency security gate
        run: npm run security:audit:production

      - name: Run static checks
        run: npm run typecheck && npm run lint

      - name: Run persistence and deployment safety tests
        run: >-
          npm run test:security &&
          npm run test:persistence &&
          npm run test:role-bootstrap &&
          npm run test:production-bootstrap &&
          npm run test:deployment-readiness &&
          npm run test:merge-safety

      - name: Verify plan-only database boundaries
        run: npm run db:migrate && npm run db:roles

      - name: Build production bundle without deployment
        run: npm run build

  merge:
    needs: [authorize, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: read
      statuses: read

    steps:
      - name: Check out trusted base authorization evaluator
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up trusted authorization runtime
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Reverify authorization, wait for Vercel, and perform guarded exact-base merge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ ! "${HEAD_REF}" =~ ^v[0-9]+- ]]; then
            echo "Refusing non-version branch: ${HEAD_REF}"
            exit 1
          fi

          deadline=$((SECONDS + 1800))
          vercel_ready=false

          while (( SECONDS < deadline )); do
            pr_snapshot="$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json state,baseRefName,headRefOid,baseRefOid,isDraft,labels)"
            current_state="$(jq -r '.state' <<<"${pr_snapshot}")"
            current_base_ref="$(jq -r '.baseRefName' <<<"${pr_snapshot}")"
            current_head="$(jq -r '.headRefOid' <<<"${pr_snapshot}")"
            current_base="$(jq -r '.baseRefOid' <<<"${pr_snapshot}")"
            current_draft="$(jq -r '.isDraft' <<<"${pr_snapshot}")"
            label_count="$(jq '[.labels[].name | select(. == "production-merge-approved")] | length' <<<"${pr_snapshot}")"

            if [[ "${current_state}" != "OPEN" || "${current_base_ref}" != "main" \
                || "${current_head}" != "${HEAD_SHA}" || "${current_base}" != "${BASE_SHA}" \
                || "${current_draft}" != "false" || "${label_count}" != "1" ]]; then
              echo "PR state, base ref, head, base, draft state, or explicit merge label changed; refusing merge."
              exit 1
            fi

            review_pages="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate --slurp)"
            review_decision="$(node scripts/github/evaluate-version-pr-reviews.mjs \
              --head-sha "${HEAD_SHA}" --pr-author "${PR_AUTHOR}" <<<"${review_pages}")"
            if [[ "$(jq -r '.authorized' <<<"${review_decision}")" != "true" ]]; then
              echo "Current trusted exact-head approval is absent or a trusted changes request is active; refusing merge."
              exit 1
            fi

            vercel_state="$(gh api "repos/${REPOSITORY}/commits/${HEAD_SHA}/status" \
              --jq '[.statuses[] | select(.context == "Vercel")][0].state // "missing"')"

            case "${vercel_state}" in
              success)
                vercel_ready=true
                echo "Vercel check succeeded with authorization still intact."
                break
                ;;
              failure|error)
                echo "Vercel check failed with state: ${vercel_state}"
                exit 1
                ;;
              pending|missing)
                echo "Vercel state is ${vercel_state}; checking again in 15 seconds."
                sleep 15
                ;;
              *)
                echo "Unexpected Vercel state: ${vercel_state}"
                exit 1
                ;;
            esac
          done

          if [[ "${vercel_ready}" != "true" ]]; then
            echo "Timed out waiting for Vercel success."
            exit 1
          fi

          final_snapshot="$(gh pr view "${PR_NUMBER}" --repo "${REPOSITORY}" --json state,baseRefName,headRefOid,baseRefOid,isDraft,labels)"
          final_state="$(jq -r '.state' <<<"${final_snapshot}")"
          final_base_ref="$(jq -r '.baseRefName' <<<"${final_snapshot}")"
          final_head="$(jq -r '.headRefOid' <<<"${final_snapshot}")"
          final_base="$(jq -r '.baseRefOid' <<<"${final_snapshot}")"
          final_draft="$(jq -r '.isDraft' <<<"${final_snapshot}")"
          final_label_count="$(jq '[.labels[].name | select(. == "production-merge-approved")] | length' <<<"${final_snapshot}")"
          final_review_pages="$(gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}/reviews" --paginate --slurp)"
          final_review_decision="$(node scripts/github/evaluate-version-pr-reviews.mjs \
            --head-sha "${HEAD_SHA}" --pr-author "${PR_AUTHOR}" <<<"${final_review_pages}")"

          if [[ "${final_state}" != "OPEN" || "${final_base_ref}" != "main" \
              || "${final_head}" != "${HEAD_SHA}" || "${final_base}" != "${BASE_SHA}" \
              || "${final_draft}" != "false" || "${final_label_count}" != "1" \
              || "$(jq -r '.authorized' <<<"${final_review_decision}")" != "true" ]]; then
            echo "Final exact-base/head authorization check failed; refusing merge."
            exit 1
          fi

          remote_base="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [[ "${remote_base}" != "${BASE_SHA}" ]]; then
            echo "Remote main changed before merge composition; refusing merge."
            exit 1
          fi

          git checkout --detach "${BASE_SHA}"
          git merge --no-commit --no-ff "${HEAD_SHA}"
          test -z "$(git ls-files --unmerged)"
          git diff --check --cached

          merge_tree="$(git write-tree)"
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME="${GIT_AUTHOR_NAME}"
          export GIT_COMMITTER_EMAIL="${GIT_AUTHOR_EMAIL}"
          merge_sha="$(printf 'Merge guarded version PR #%s\n\nExact base: %s\nExact head: %s\n' \
            "${PR_NUMBER}" "${BASE_SHA}" "${HEAD_SHA}" \
            | git commit-tree "${merge_tree}" -p "${BASE_SHA}" -p "${HEAD_SHA}")"

          test "$(git rev-parse "${merge_sha}^1")" = "${BASE_SHA}"
          test "$(git rev-parse "${merge_sha}^2")" = "${HEAD_SHA}"

          askpass="$(mktemp)"
          trap 'rm -f "${askpass}"' EXIT
          cat >"${askpass}" <<'EOF'
          #!/usr/bin/env sh
          case "$1" in
            *Password*) printf '%s\n' "$GH_TOKEN" ;;
            *) printf '%s\n' 'x-access-token' ;;
          esac
          EOF
          chmod 700 "${askpass}"

          GIT_ASKPASS="${askpass}" GIT_TERMINAL_PROMPT=0 \
            git push "https://x-access-token@github.com/${REPOSITORY}.git" \
              "${merge_sha}:refs/heads/main"

          pushed_main="$(git ls-remote --exit-code origin refs/heads/main | awk '{print $1}')"
          if [[ "${pushed_main}" != "${merge_sha}" ]]; then
            echo "Remote main does not match the guarded merge commit."
            exit 1
          fi
