name: Validate Artist Expansion Music Genie strong26 application receipt v1

on:
  push:
    branches:
      - work/artist-expansion-music-genie-strong26-application-v1

permissions:
  contents: read

jobs:
  validate-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Genie strong26 source receipt
        run: python tests/artist-expansion-music-genie-strong26-source-application-v1.py
