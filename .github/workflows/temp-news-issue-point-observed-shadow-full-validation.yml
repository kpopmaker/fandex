name: TEMP newsIssuePoint Observed Shadow Full Validation

on:
  push:
    branches:
      - validation/news-issue-point-observed-shadow-full-724ad8

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Verify exact source parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "724ad818a04834b7b2cafd7805529b07b5e6bbfb"
          test "$(git merge-base HEAD 724ad818a04834b7b2cafd7805529b07b5e6bbfb)" = "724ad818a04834b7b2cafd7805529b07b5e6bbfb"

      - name: Install exact dependencies
        run: npm ci

      - name: Production dependency security
        run: npm run security:audit:production

      - name: Observed shadow boundary acceptance
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/temp-news-issue-point-observed-shadow-acceptance.test.mts
          node --import tsx --test tests/product-news-issue-point-real-read-boundary-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-candidate-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-selector-v1.test.mts
          node --import tsx --test tests/product-news-issue-point-real-promotion-gate-v1.test.mts
          node --import tsx --test tests/intelligence-variable-confidence-v1.test.mts
          node --import tsx --test tests/product-variable-boundary-v1.test.mts
          node --import tsx --test tests/product-evidence-boundary-v1.test.mts
          node --import tsx --test tests/product-artist-variable-route-integration-v1.test.mts

      - name: Frozen methodology and NAVER lineage regressions
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --test tests/naver-news-issue-point-frozen-methodology.test.mts
          node --import tsx --test tests/naver-news-shadow-epoch-v1.test.mts
          node --import tsx --test tests/naver-news-shadow-first-seen-activity-v1.test.mts
          node --import tsx --test tests/naver-news-shadow-first-seen-series-v1.test.mts
          node --import tsx --test tests/naver-news-canonical-job-evidence-v130.test.mts
          node --import tsx --test tests/naver-news-canonical-observation-v130.test.mts
          node --import tsx --test tests/naver-news-observation-set-coverage-v130.test.mts

      - name: Static checks
        run: npm run typecheck && npm run lint

      - name: Production build
        run: npm run build

      - name: Diff checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check 2cb01343ae2cb51b551ceb7f873442e310217ba7...724ad818a04834b7b2cafd7805529b07b5e6bbfb
          git diff --check 724ad818a04834b7b2cafd7805529b07b5e6bbfb...HEAD
