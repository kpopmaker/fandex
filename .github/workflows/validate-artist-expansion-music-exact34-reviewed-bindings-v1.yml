name: Validate Artist Expansion Music exact34 reviewed bindings v1

on:
  push:
    branches:
      - review/artist-expansion-music-exact34-bindings-v1

permissions:
  contents: read

jobs:
  validate-music-exact34-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Music exact34 reviewed binding preview
        run: python tests/artist-expansion-music-exact34-reviewed-bindings-v1.py
