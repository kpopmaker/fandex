name: TMP PR127 Current Main Deployment Integration Preflight

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - .github/workflows/tmp-pr127-current-main-deployment-integration-preflight.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Simulate merge of exact current main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "fandex-preflight"
          git config user.email "fandex-preflight@example.invalid"
          git fetch origin main

          EXPECTED_MAIN="b1a0ca1cd47113595d4584fb66a3444188eeb29e"
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN"

          set +e
          git merge --no-commit --no-ff "$EXPECTED_MAIN"
          MERGE_EXIT=$?
          set -e

          mapfile -t CONFLICTS < <(git diff --name-only --diff-filter=U)
          printf 'merge_exit=%s\n' "$MERGE_EXIT"
          printf 'conflict_count=%s\n' "${#CONFLICTS[@]}"
          printf 'conflicts=%s\n' "${CONFLICTS[*]-}"

          if [ "${#CONFLICTS[@]}" -gt 0 ]; then
            test "${#CONFLICTS[@]}" -eq 1
            test "${CONFLICTS[0]}" = "vercel.json"
            git checkout --ours vercel.json
            git add vercel.json
          fi

          test -z "$(git diff --name-only --diff-filter=U)"

          # Current-main Activity Exposure persistence must survive the simulated merge.
          test -f lib/server/ingestion/activityExposureRepository.ts
          test -f lib/server/ingestion/activityExposurePersistenceBridge.ts

          # Momentum verifier production candidate files must also survive.
          test -f app/api/internal/naver-news/momentum-verifier/route.ts
          test -f lib/server/ingestion/naverNewsMomentumVerifierExecutionChannel.ts
          test -f lib/server/ingestion/naverNewsMomentumNativeVerifier.ts

          # Preserve Vercel deployment suppression for the long-lived validation branch.
          grep -Fq "v131-lastfm-real-signal-read-model" vercel.json

          git status --short

      - run: npm ci

      - name: Momentum verifier regression
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-native-verifier-output-v161.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-execution-channel-v162.test.mts
          npx tsx --test tests/fandex-momentum-verifier-channel-readiness-v163.test.mts
          npx tsx --test tests/fandex-momentum-verifier-configuration-evidence-v164.test.mts

      - name: Current-main Activity Exposure regression
        run: |
          npx tsx --conditions=react-server --test tests/activity-exposure-persistence-repository-v1.test.mts
          npx tsx --conditions=react-server --test tests/activity-exposure-persistence-bridge-v1.test.mts
          npx tsx --conditions=react-server --test tests/activity-exposure-production-readiness-v1.test.mts

      - name: Typecheck
        run: npm run typecheck

      - name: Abort simulated merge
        if: always()
        shell: bash
        run: git merge --abort || true
