name: OPS Provision FANDEX NAVER Evidence private Blob v1

on:
  push:
    branches:
      - ops/provision-naver-evidence-private-blob-v1

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_OrRPxuBxMwCYU3kk0r76AfOs
      VERCEL_PROJECT_ID: prj_aT3p8zmjyochu8iGmFOuNR1lSU7v
      STORE_NAME: fandex-naver-evidence
    steps:
      - uses: actions/checkout@v4

      - name: Approval scope guard
        run: |
          test -n "$VERCEL_TOKEN"
          test "$VERCEL_PROJECT_ID" = "prj_aT3p8zmjyochu8iGmFOuNR1lSU7v"
          test "$STORE_NAME" = "fandex-naver-evidence"

      - name: Verify exact FANDEX project access
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/project.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v9/projects/$VERCEL_PROJECT_ID?teamId=$VERCEL_ORG_ID")
          echo "FANDEX_VERCEL_PROJECT_READ_HTTP=$HTTP_CODE"
          test "$HTTP_CODE" = "200"
          node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync("/tmp/project.json","utf8"));
            if (p.id !== process.env.VERCEL_PROJECT_ID) process.exit(2);
            console.log("FANDEX_VERCEL_PROJECT_READ=verified");
          '

      - name: Inspect existing Blob stores through REST
        id: inspect
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/stores.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/storage/stores?teamId=$VERCEL_ORG_ID")
          echo "FANDEX_BLOB_STORE_LIST_HTTP=$HTTP_CODE"
          test "$HTTP_CODE" = "200"

          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/stores.json', 'utf8'));
          const stores = Array.isArray(data.stores) ? data.stores : [];
          const matches = stores.filter(s => s && s.name === process.env.STORE_NAME);
          if (matches.length > 1) {
            console.error('duplicate_same_name_blob_stores');
            process.exit(42);
          }
          if (matches.length === 0) {
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'state=absent\n');
            process.exit(0);
          }
          const store = matches[0];
          const projects = Array.isArray(store.projectsMetadata) ? store.projectsMetadata : [];
          const bound = projects.find(p => p && p.projectId === process.env.VERCEL_PROJECT_ID);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'state=existing\n');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `store_id=${store.id}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `already_bound=${bound ? 'true' : 'false'}\n`);
          console.log('FANDEX_BLOB_EXISTING_STORE_ID=' + store.id);
          console.log('FANDEX_BLOB_EXISTING_BOUND=' + (bound ? 'true' : 'false'));
          NODE

      - name: Create private Blob store
        id: create
        if: steps.inspect.outputs.state == 'absent'
        run: |
          HTTP_CODE=$(curl -sS -o /tmp/create.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v1/storage/stores/blob?teamId=$VERCEL_ORG_ID" \
            --data '{"name":"fandex-naver-evidence","region":"iad1","access":"private"}')
          echo "FANDEX_BLOB_CREATE_HTTP=$HTTP_CODE"
          test "$HTTP_CODE" = "200" -o "$HTTP_CODE" = "201"

          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/create.json', 'utf8'));
          const store = data.store;
          if (!store || typeof store.id !== 'string') {
            console.error('blob_create_response_invalid');
            process.exit(2);
          }
          if (store.name && store.name !== process.env.STORE_NAME) {
            console.error('blob_create_name_mismatch');
            process.exit(3);
          }
          if (store.region && store.region !== 'iad1') {
            console.error('blob_create_region_mismatch');
            process.exit(4);
          }
          if (store.access && store.access !== 'private') {
            console.error('blob_create_access_mismatch');
            process.exit(5);
          }
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `store_id=${store.id}\n`);
          console.log('FANDEX_BLOB_CREATED_STORE_ID=' + store.id);
          console.log('FANDEX_BLOB_CREATED_ACCESS=private');
          console.log('FANDEX_BLOB_CREATED_REGION=iad1');
          NODE

      - name: Resolve exact Blob store id
        id: store
        run: |
          if [ -n "${{ steps.create.outputs.store_id }}" ]; then
            STORE_ID="${{ steps.create.outputs.store_id }}"
          else
            STORE_ID="${{ steps.inspect.outputs.store_id }}"
          fi
          test -n "$STORE_ID"
          case "$STORE_ID" in
            store_*|blob_*) ;;
            *) echo "unexpected Blob store id format"; exit 6 ;;
          esac
          echo "store_id=$STORE_ID" >> "$GITHUB_OUTPUT"
          echo "FANDEX_BLOB_STORE_ID=$STORE_ID"

      - name: Bind Blob store to Production only
        if: steps.inspect.outputs.already_bound != 'true'
        run: |
          STORE_ID="${{ steps.store.outputs.store_id }}"
          HTTP_CODE=$(curl -sS -o /tmp/connect.json -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.vercel.com/v1/storage/stores/$STORE_ID/connections?teamId=$VERCEL_ORG_ID" \
            --data '{"envVarEnvironments":["production"],"projectId":"prj_aT3p8zmjyochu8iGmFOuNR1lSU7v","type":"integration"}')
          echo "FANDEX_BLOB_CONNECT_HTTP=$HTTP_CODE"
          test "$HTTP_CODE" = "200" -o "$HTTP_CODE" = "201"

      - name: Verify private store and Production-only binding
        run: |
          STORE_ID="${{ steps.store.outputs.store_id }}"

          HTTP_CODE=$(curl -sS -o /tmp/store-detail.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/storage/stores/$STORE_ID?teamId=$VERCEL_ORG_ID")
          echo "FANDEX_BLOB_DETAIL_HTTP=$HTTP_CODE"
          test "$HTTP_CODE" = "200"

          HTTP_CODE=$(curl -sS -o /tmp/stores-after.json -w '%{http_code}' \
            -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v1/storage/stores?teamId=$VERCEL_ORG_ID")
          echo "FANDEX_BLOB_STORE_LIST_AFTER_HTTP=$HTTP_CODE"
          test "$HTTP_CODE" = "200"

          node <<'NODE'
          const fs = require('fs');
          const detailData = JSON.parse(fs.readFileSync('/tmp/store-detail.json', 'utf8'));
          const store = detailData.store || detailData;
          if (!store || store.id !== process.env.STORE_ID) {
            console.error('blob_store_detail_identity_mismatch');
            process.exit(2);
          }
          if (store.name !== process.env.STORE_NAME) {
            console.error('blob_store_detail_name_mismatch');
            process.exit(3);
          }
          if (store.region !== 'iad1') {
            console.error('blob_store_detail_region_mismatch');
            process.exit(4);
          }
          if (store.access !== 'private') {
            console.error('blob_store_detail_access_not_private');
            process.exit(5);
          }

          const listData = JSON.parse(fs.readFileSync('/tmp/stores-after.json', 'utf8'));
          const stores = Array.isArray(listData.stores) ? listData.stores : [];
          const listed = stores.find(s => s && s.id === process.env.STORE_ID);
          if (!listed) {
            console.error('blob_store_not_listed_after_binding');
            process.exit(6);
          }
          const projects = Array.isArray(listed.projectsMetadata) ? listed.projectsMetadata : [];
          const project = projects.find(p => p && p.projectId === process.env.VERCEL_PROJECT_ID);
          if (!project) {
            console.error('blob_store_project_binding_missing');
            process.exit(7);
          }
          const environments = Array.isArray(project.environments) ? [...project.environments].sort() : [];
          if (JSON.stringify(environments) !== JSON.stringify(['production'])) {
            console.error('blob_store_binding_not_production_only:' + JSON.stringify(environments));
            process.exit(8);
          }

          console.log('FANDEX_BLOB_BINDING_VERIFIED=production-only');
          console.log('FANDEX_BLOB_STORE_NAME=' + process.env.STORE_NAME);
          console.log('FANDEX_BLOB_ACCESS=private');
          console.log('FANDEX_BLOB_REGION=iad1');
          NODE
        env:
          STORE_ID: ${{ steps.store.outputs.store_id }}

      - name: Safety boundary
        run: |
          echo "liveMirrorWritesEnabled=false"
          echo "historicalBackfillPerformed=false"
          echo "productionMirrorReadCutover=false"
          echo "productionVerifierExecutions=0"
          echo "productPublication=false"
          echo "publicRouteCutover=false"
