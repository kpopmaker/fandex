name: PR127 momentum v169 pre-mutation rollback readiness

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - 'lib/intelligence/fandexMomentumVerifierPreMutationRollbackReadinessResearch.ts'
      - 'tests/fandex-momentum-verifier-premutation-rollback-readiness-v169.test.mts'
      - '.github/workflows/pr127-momentum-v169-premutation-rollback-readiness.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Evaluate current v169 blocked state
        run: |
          cat > .tmp-v169-current.mts <<'TS'
          import {
            evaluateFandexMomentumVerifierPreMutationRollbackReadiness,
          } from './lib/intelligence/fandexMomentumVerifierPreMutationRollbackReadinessResearch';

          const out =
            evaluateFandexMomentumVerifierPreMutationRollbackReadiness({
              target: {
                teamId: 'team_OrRPxuBxMwCYU3kk0r76AfOs',
                projectId: 'prj_aT3p8zmjyochu8iGmFOuNR1lSU7v',
                projectName: 'fandex',
                environment: 'production',
              },
              inventoryEvidence: {
                endpoint: '/v10/projects/{idOrName}/env',
                method: 'GET',
                teamId: 'team_OrRPxuBxMwCYU3kk0r76AfOs',
                projectId: 'prj_aT3p8zmjyochu8iGmFOuNR1lSU7v',
                decryptRequested: false,
                inventoryQueryable: false,
                evidenceBoundToProjectAndTeam: false,
                completeForProductionTarget: false,
              },
              observations: [
                {
                  key: 'FANDEX_MOMENTUM_NATIVE_VERIFIER_CHANNEL_ENABLED',
                  presence: 'unknown',
                  targetScope: 'unknown',
                  providerType: 'unknown',
                  nonSecretPriorValueKnown: false,
                  nonSecretPriorValue: null,
                  secretValueExposed: false,
                  opaqueRollbackHandleId: null,
                  opaqueRollbackRestorableAttested: false,
                },
                {
                  key: 'FANDEX_MOMENTUM_NATIVE_VERIFIER_CHANNEL_DEPLOYMENT',
                  presence: 'unknown',
                  targetScope: 'unknown',
                  providerType: 'unknown',
                  nonSecretPriorValueKnown: false,
                  nonSecretPriorValue: null,
                  secretValueExposed: false,
                  opaqueRollbackHandleId: null,
                  opaqueRollbackRestorableAttested: false,
                },
                {
                  key: 'FANDEX_MOMENTUM_NATIVE_VERIFIER_SECRET',
                  presence: 'unknown',
                  targetScope: 'unknown',
                  providerType: 'unknown',
                  nonSecretPriorValueKnown: false,
                  nonSecretPriorValue: null,
                  secretValueExposed: false,
                  opaqueRollbackHandleId: null,
                  opaqueRollbackRestorableAttested: false,
                },
              ],
              touchedKeys: [
                'FANDEX_MOMENTUM_NATIVE_VERIFIER_CHANNEL_ENABLED',
                'FANDEX_MOMENTUM_NATIVE_VERIFIER_CHANNEL_DEPLOYMENT',
                'FANDEX_MOMENTUM_NATIVE_VERIFIER_SECRET',
              ],
              excludedKeys: [
                'FANDEX_RUNTIME_DATABASE_URL',
                'FANDEX_NAVER_NEWS_SCHEDULER_SECRET',
              ],
            });

          if (out.state !== 'rollback-readiness-blocked' || out.rollbackReady) {
            throw new Error('current v169 state must remain blocked while inventory is unavailable');
          }

          console.log('V169_CURRENT_BEGIN');
          console.log(JSON.stringify(out, null, 2));
          console.log('V169_CURRENT_END');
          TS
          npx tsx --conditions=react-server .tmp-v169-current.mts
          rm .tmp-v169-current.mts

      - name: Validate v169 and upstream regressions
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-premutation-rollback-readiness-v169.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-vercel-mutation-dry-run-v168.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-configuration-mutation-execution-guard-v167.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-configuration-authorization-v166.test.mts
          npm run typecheck
          git diff --check
