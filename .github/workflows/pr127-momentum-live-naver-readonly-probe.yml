name: PR127 momentum live NAVER read-only probe

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - '.github/workflows/pr127-momentum-live-naver-readonly-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FANDEX_RUNTIME_DATABASE_URL: ${{ secrets.FANDEX_RUNTIME_DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Fail closed if runtime read credential is unavailable
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FANDEX_RUNTIME_DATABASE_URL:-}" ]]; then
            echo "FANDEX_RUNTIME_DATABASE_URL is unavailable."
            exit 1
          fi
      - name: Verify committed NAVER boundary from stored evidence read-only
        shell: bash
        run: |
          set -euo pipefail
          npx tsx scripts/ingestion/verify-naver-news-shadow-series.mts \
            --artist iu \
            --protocol-start 2026-09-15T16:00:00.000Z \
            --through-slot-start 2026-09-20T15:00:00.000Z \
            > /tmp/naver-series.json
          cat /tmp/naver-series.json
          node <<'NODE'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync('/tmp/naver-series.json','utf8'));
          if (x.status !== 'available') throw new Error('live_naver_series_not_available');
          if (x.reason !== 'available') throw new Error('live_naver_series_reason_invalid');
          if (x.canonicalArtistId !== 'iu') throw new Error('live_naver_artist_invalid');
          if (x.protocolStart !== '2026-09-15T16:00:00.000Z') throw new Error('live_naver_epoch_invalid');
          if (x.throughSlotStart !== '2026-09-20T15:00:00.000Z') throw new Error('live_naver_boundary_invalid');
          if (x.expectedSlotCount !== x.snapshotCount) throw new Error('live_naver_slot_gap');
          if (x.activity?.status !== 'available') throw new Error('live_naver_activity_unavailable');
          console.log(JSON.stringify({
            status: x.status,
            protocolStart: x.protocolStart,
            throughSlotStart: x.throughSlotStart,
            expectedSlotCount: x.expectedSlotCount,
            snapshotCount: x.snapshotCount,
            latestSlot: x.activity.slots.at(-1) ?? null,
          }, null, 2));
          NODE
      - name: Confirm research isolation
        run: git diff --exit-code
