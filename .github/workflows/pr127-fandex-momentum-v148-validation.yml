name: PR127 FANDEX momentum v148 validation

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate v148 append-from-artifact and upstream contracts
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-append-from-artifact-v148.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-unified-history-v147.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-append-adapter-v146.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-carrier-change-v145.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-research-carrier-v144.test.mts
          npm run typecheck
