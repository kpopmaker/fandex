name: TEMP Apply Next 16.3.5 Security Fix

on:
  push:
    branches:
      - integration/security-next-16-3-5

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply security patch
        run: npm install next@16.3.5 --save-exact

      - name: Validate security patch
        run: npm run security:audit:production && npm run typecheck && npm run build

      - name: Commit dependency files when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "Dependency files already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix(deps): upgrade Next.js to 16.3.5"
          git push origin HEAD:integration/security-next-16-3-5
