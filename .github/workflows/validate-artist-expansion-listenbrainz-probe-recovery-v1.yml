name: Validate Artist Expansion ListenBrainz probe recovery v1

on:
  push:
    branches:
      - evidence/artist-expansion-listenbrainz-probe-recovery-v1

permissions:
  contents: read

jobs:
  validate-probe-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate full21 recovery receipt
        run: python tests/artist-expansion-listenbrainz-probe-recovery-v1.py
