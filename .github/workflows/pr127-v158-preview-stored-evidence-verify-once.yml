name: PR127 v158 preview stored evidence verify once

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - '.github/workflows/pr127-v158-preview-stored-evidence-verify-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke fixed READY preview read-only verifier
        shell: bash
        run: |
          set -euo pipefail
          url="https://fandex-bbcwna4vo-larva3203-1222s-projects.vercel.app/api/internal/momentum-v158-preview-stored-evidence"
          status=$(curl --silent --show-error --output response.json --write-out '%{http_code}' \
            --connect-timeout 10 --max-time 60 "$url")
          echo "http_status=$status"
          cat response.json
          test "$status" = "200"
          node - <<'NODE'
          const fs = require('node:fs');
          const x = JSON.parse(fs.readFileSync('response.json', 'utf8'));
          if (x.ok !== true) throw new Error('preview_verifier_not_ok');
          if (x.mode !== 'preview-read-only-stored-evidence-verifier') {
            throw new Error('preview_verifier_mode_invalid');
          }
          if (x.canonicalArtistId !== 'iu') throw new Error('artist_invalid');
          if (x.protocolStart !== '2026-09-15T16:00:00.000Z') {
            throw new Error('protocol_start_invalid');
          }
          if (x.throughSlotStart !== '2026-09-21T00:00:00.000Z') {
            throw new Error('through_slot_invalid');
          }
          if (x.expectedSlotCount !== 129 || x.snapshotCount !== 129) {
            throw new Error('slot_count_invalid');
          }
          if (x.status !== 'available' || x.activityStatus !== 'available') {
            throw new Error('stored_series_unavailable');
          }
          if (x.latest?.slotStart !== '2026-09-21T00:00:00.000Z') {
            throw new Error('latest_slot_invalid');
          }
          if (
            x.latest?.jobId
              !== 'dae0750b1ad81f468f479328ef726e6344eaa31a62246cce3e4aeebc5d9a3f7d'
          ) {
            throw new Error('latest_job_id_invalid');
          }
          if (x.latest?.observedObservationCount !== 100) {
            throw new Error('latest_observation_count_invalid');
          }
          if (x.latest?.bootstrap !== false) {
            throw new Error('latest_bootstrap_invalid');
          }
          if (x.storedEvidenceReproducedThisEvaluation !== true) {
            throw new Error('stored_evidence_not_reproduced');
          }
          NODE
