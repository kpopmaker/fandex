name: Validate Artist Expansion Music Genie JINU identity live v1

on:
  push:
    branches:
      - research/artist-expansion-music-genie-partial39-triage-v1
    paths:
      - 'scripts/fandex-cloud-migration/source/music_genie_jinu_identity_linkage_live_v1.py'
      - '.github/workflows/validate-artist-expansion-music-genie-jinu-identity-live-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate-jinu-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install live HTML dependencies
        run: python -m pip install beautifulsoup4 requests
      - name: Check investigation syntax
        run: python -m py_compile scripts/fandex-cloud-migration/source/music_genie_jinu_identity_linkage_live_v1.py
      - name: Probe live Genie identity without rebinding
        working-directory: scripts/fandex-cloud-migration/source
        run: python music_genie_jinu_identity_linkage_live_v1.py
      - name: Upload non-activating JINU identity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artist-expansion-music-genie-jinu-identity-live-v1
          path: scripts/fandex-cloud-migration/source/music_genie_jinu_identity_linkage_live_v1.json
          if-no-files-found: warn
          retention-days: 21
