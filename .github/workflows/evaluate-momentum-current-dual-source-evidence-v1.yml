name: Evaluate Momentum current dual-source evidence v1

on:
  push:
    branches:
      - research/momentum-current-dual-source-evaluation-v1

permissions:
  contents: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FANDEX_RUNTIME_DATABASE_URL: ${{ secrets.FANDEX_RUNTIME_DATABASE_URL }}
      NODE_OPTIONS: --conditions=react-server

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        run: |
          git diff --name-only dd05caeab4682a642cf63e61f4f12b67182ecc9e...HEAD | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/evaluate-momentum-current-dual-source-evidence-v1.yml
          lib/intelligence/fandexMomentumCrossFamilyCombinationResearch.ts
          lib/intelligence/fandexMomentumOutputFormEligibilityResearch.ts
          lib/intelligence/fandexMomentumTemporalNormalizationResearch.ts
          lib/intelligence/fandexNaverMediaAttentionMomentumResearch.ts
          lib/lastfm-signal/contracts.ts
          lib/lastfm-signal/csv.ts
          lib/lastfm-signal/historicalShadowCheckpoint.ts
          lib/lastfm-signal/historicalWindow.ts
          lib/lastfm-signal/identityQualityGate.ts
          lib/lastfm-signal/index.ts
          lib/lastfm-signal/momentumConstructAlignment.ts
          lib/lastfm-signal/momentumProductConstructResearch.ts
          lib/lastfm-signal/readModel.ts
          lib/lastfm-signal/repeatedShadowReconciliation.ts
          lib/lastfm-signal/repositorySnapshot.ts
          lib/lastfm-signal/shadowScoringReconciliation.ts
          lib/lastfm-signal/shadowVariableAdapter.ts
          scripts/validation/momentumCurrentDualSourceEvaluationV1.ts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Current dual-source categorical evaluation
        run: npx tsx scripts/validation/momentumCurrentDualSourceEvaluationV1.ts

      - name: Momentum live-shadow readiness regression
        run: npx tsx --test tests/momentum-live-shadow-product-readiness-v1.test.mts

      - name: Runtime Stored Evidence regression
        run: npx tsx --test tests/momentum-evidence-consensus-runtime-read-v1.test.mts

      - name: Activity Exposure Production regression
        run: npx tsx --test tests/activity-exposure-public-route-cutover-execution-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
