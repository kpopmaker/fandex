name: Wikimedia Entity Attention Research Validation

on:
  push:
    branches:
      - research/wikimedia-entity-attention-v1
    paths:
      - ".github/workflows/wikimedia-entity-attention-research-validation.yml"
      - "lib/alternative-evidence/wikimediaEntityAttentionResearch.ts"
      - "tests/wikimedia-entity-attention-research.test.mts"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Wikimedia research contract tests
        run: npx tsx --test tests/wikimedia-entity-attention-research.test.mts

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint
