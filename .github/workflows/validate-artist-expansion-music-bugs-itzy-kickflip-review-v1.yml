name: Validate Artist Expansion Music Bugs ITZY KickFlip review v1

on:
  push:
    branches:
      - review/artist-expansion-music-bugs-itzy-kickflip-v1

permissions:
  contents: read

jobs:
  validate-bugs-itzy-kickflip-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Music Bugs reviewed bindings
        run: python tests/artist-expansion-music-bugs-itzy-kickflip-reviewed-bindings-v1.py
