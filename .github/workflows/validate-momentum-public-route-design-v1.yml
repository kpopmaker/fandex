name: Validate Momentum public route design v1

on:
  push:
    branches:
      - integration/momentum-public-route-design-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        run: |
          git diff --name-only f9163ceba5f60291bac28fa64e4a701e2ac44512...HEAD | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/validate-momentum-current-dual-source-evaluation-v1.yml
          .github/workflows/validate-momentum-public-route-design-v1.yml
          lib/product/readiness/momentumPublicRouteDesignCandidate.ts
          lib/server/product/momentumPublicRouteDesignCandidate.ts
          tests/momentum-public-route-design-v1.test.mts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Momentum public route design regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-public-route-design-v1.test.mts

      - name: Momentum live-shadow readiness regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-live-shadow-product-readiness-v1.test.mts

      - name: Momentum Product contract regression
        run: npx tsx --test tests/momentum-evidence-consensus-product-contract-v1.test.mts

      - name: Momentum runtime Stored Evidence regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-evidence-consensus-runtime-read-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
