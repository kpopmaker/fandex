name: PR127 FANDEX momentum current-real transition validation

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Validate current real IU transition through v146
        run: |
          git fetch origin main
          git show b4194f0d69e4bd9fed3604db1522cebd2cdf1d56:data/lastfm-cloud/lastfm_artist_interest_history_v1.csv > /tmp/previous-main-lastfm-history.csv
          git show origin/main:data/lastfm-cloud/lastfm_artist_interest_history_v1.csv > /tmp/current-main-lastfm-history.csv

          cat > .tmp-current-real-transition.mts <<'TS'
          import { readFile } from 'node:fs/promises';
          import {
            deriveFandexNaverMediaAttentionMomentumResearch,
          } from './lib/intelligence/fandexNaverMediaAttentionMomentumResearch';
          import {
            evaluateFandexMomentumTemporalNormalizationResearch,
          } from './lib/intelligence/fandexMomentumTemporalNormalizationResearch';
          import {
            evaluateFandexMomentumCrossFamilyCombinationResearch,
          } from './lib/intelligence/fandexMomentumCrossFamilyCombinationResearch';
          import {
            evaluateFandexMomentumOutputFormEligibilityResearch,
          } from './lib/intelligence/fandexMomentumOutputFormEligibilityResearch';
          import {
            writeFandexMomentumCategoricalCarrierResearch,
          } from './lib/intelligence/fandexMomentumCategoricalCarrierResearch';
          import {
            applyFandexMomentumAppendAdapterResearch,
          } from './lib/intelligence/fandexMomentumAppendAdapterResearch';
          import {
            NAVER_NEWS_ISSUE_POINT_FROZEN_METHODOLOGY_CONTRACT_VERSION,
          } from './lib/server/ingestion/naverNewsIssuePointFrozenMethodology';
          import {
            NAVER_NEWS_ISSUE_POINT_METHODOLOGY_VERSION,
          } from './lib/intelligence/naverNewsIssuePointConstruct';

          function points(anchors: readonly (readonly [string, number, number, number])[]) {
            return anchors.map(([throughSlotStart, activityRate, score, priorDefinedWindowCount]) => ({
              contractVersion: NAVER_NEWS_ISSUE_POINT_FROZEN_METHODOLOGY_CONTRACT_VERSION,
              methodologyVersion: NAVER_NEWS_ISSUE_POINT_METHODOLOGY_VERSION,
              lifecycle: 'research',
              directProductContributionEligible: false,
              productScorePublished: false,
              variableId: 'newsIssuePoint',
              canonicalArtistId: 'iu',
              protocolStart: '2026-09-15T16:00:00.000Z',
              throughSlotStart,
              selectedWindowSlotCount: 8,
              rollingWindowSemantics: 'overlapping',
              baselineScope: 'same_artist_same_official_shadow_epoch',
              baselineReadiness: {
                cycleSlotCount: 24,
                utcHourCoverageCount: 24,
                completeCycleCount: 2,
                sameUtcHourReplicationFloor: 2,
                sameUtcHourReplicationCeiling: 2,
                status: 'replicated_cycle_history',
              },
              normalizationType: 'HISTORICAL_STRICT_EXCEEDANCE_SHARE',
              status: 'available',
              reason: 'frozen_methodology_value_available',
              score,
              currentActivityRate: activityRate,
              priorDefinedWindowCount,
              priorLessThanLatestCount: 0,
              priorEqualToLatestCount: 0,
              priorGreaterThanLatestCount: 0,
              currentWindow: null,
              eligiblePriorWindows: [],
              excludedWindows: [],
              evidenceTrace: { windows: [], storedEvidenceJobIds: [] },
            })) as any;
          }

          function derive(history: string, anchors: readonly (readonly [string, number, number, number])[]) {
            const v140 = deriveFandexNaverMediaAttentionMomentumResearch(points(anchors));
            const v141 = evaluateFandexMomentumTemporalNormalizationResearch({
              canonicalArtistId: 'iu',
              lastfmHistoryCsv: history,
              naverComponent: v140,
            });
            const v142 = evaluateFandexMomentumCrossFamilyCombinationResearch(v141);
            const v143 = evaluateFandexMomentumOutputFormEligibilityResearch(v142);
            return { v140, v141, v142, v143 };
          }

          const previousAnchors = [
            ['2026-09-17T17:00:00.000Z', 0.00125, 26.829268292683, 41],
            ['2026-09-18T01:00:00.000Z', 0.00125, 24.489795918367, 49],
            ['2026-09-18T09:00:00.000Z', 0.03375, 98.245614035088, 57],
            ['2026-09-18T17:00:00.000Z', 0.0025, 33.846153846154, 65],
            ['2026-09-19T01:00:00.000Z', 0.0, 0.0, 73],
            ['2026-09-19T09:00:00.000Z', 0.0025, 41.975308641975, 81],
          ] as const;

          const currentAnchors = [
            ['2026-09-17T21:00:00.000Z', 0.00125, 24.444444444444, 45],
            ['2026-09-18T05:00:00.000Z', 0.02375, 94.339622641509, 53],
            ['2026-09-18T13:00:00.000Z', 0.0125, 72.131147540984, 61],
            ['2026-09-18T21:00:00.000Z', 0.00125, 17.391304347826, 69],
            ['2026-09-19T05:00:00.000Z', 0.00125, 20.779220779221, 77],
            ['2026-09-19T13:00:00.000Z', 0.00125, 18.823529411765, 85],
            ['2026-09-19T21:00:00.000Z', 0.0, 0.0, 93],
            ['2026-09-20T05:00:00.000Z', 0.00125, 30.693069306931, 101],
          ] as const;

          const [previousHistory, currentHistory] = await Promise.all([
            readFile('/tmp/previous-main-lastfm-history.csv', 'utf8'),
            readFile('/tmp/current-main-lastfm-history.csv', 'utf8'),
          ]);

          const previous = derive(previousHistory, previousAnchors);
          if (previous.v143.digest !== '121343630db936fa265f546523b28977614ce1658c13e68a7857344c4b3add28') {
            throw new Error('previous v143 digest reconstruction mismatch');
          }
          if (previous.v143.currentResearchOutput.directionalConsensus !== 'direction-corroborated-down') {
            throw new Error('previous direction mismatch');
          }
          if (previous.v143.currentResearchOutput.persistenceConsensus !== 'one-direction-repeated') {
            throw new Error('previous persistence mismatch');
          }

          const current = derive(currentHistory, currentAnchors);
          if (current.v143.state !== 'categorical-research-output-only') {
            throw new Error('current v143 state invalid');
          }

          const records = new Map<string, any>();
          const repository = {
            async findByRecordId(recordId: string) {
              return records.get(recordId) ?? null;
            },
            async listByArtist(canonicalArtistId: string) {
              return [...records.values()].filter((r) => r.canonicalArtistId === canonicalArtistId);
            },
            async insert(record: any) {
              if (records.has(record.recordId)) return 'already-exists' as const;
              records.set(record.recordId, record);
              return 'inserted' as const;
            },
          };

          const seeded = await writeFandexMomentumCategoricalCarrierResearch({
            result: previous.v143,
            collectedAt: '2026-09-19T15:26:05.410Z',
            repository,
          });
          if (seeded.state !== 'inserted') throw new Error('previous carrier seed failed');

          const applied = await applyFandexMomentumAppendAdapterResearch({
            result: current.v143,
            collectedAt: '2026-09-20T05:30:00.000Z',
            repository,
          });

          if (applied.state !== 'appended') throw new Error('current transition was not appended');
          if (applied.decision.changeKind !== 'direction-and-persistence-changed') {
            throw new Error('unexpected transition classification: ' + applied.decision.changeKind);
          }
          if (applied.decision.directionalConsensusChanged !== true) {
            throw new Error('direction change not preserved');
          }
          if (applied.decision.persistenceConsensusChanged !== true) {
            throw new Error('persistence change not preserved');
          }
          if (applied.recordCountBefore !== 1 || applied.recordCountAfter !== 2) {
            throw new Error('append count postcondition failed');
          }
          if (
            applied.effects.productMetricReads !== 0
            || applied.effects.productMetricWrites !== 0
            || applied.effects.previewFallbackReads !== 0
          ) {
            throw new Error('Product/preview isolation violated');
          }

          console.log(JSON.stringify({
            previous: {
              alignmentCutoffAt: previous.v143.alignmentCutoffAt,
              directionalConsensus: previous.v143.currentResearchOutput.directionalConsensus,
              persistenceConsensus: previous.v143.currentResearchOutput.persistenceConsensus,
              digest: previous.v143.digest,
            },
            current: {
              alignmentCutoffAt: current.v143.alignmentCutoffAt,
              directionalConsensus: current.v143.currentResearchOutput.directionalConsensus,
              persistenceConsensus: current.v143.currentResearchOutput.persistenceConsensus,
              digest: current.v143.digest,
            },
            transition: {
              state: applied.state,
              changeKind: applied.decision.changeKind,
              directionalConsensusChanged: applied.decision.directionalConsensusChanged,
              persistenceConsensusChanged: applied.decision.persistenceConsensusChanged,
              sourceDigestChanged: applied.decision.sourceDigestChanged,
              previousRecordId: applied.previousRecordId,
              resultingRecordId: applied.resultingRecord?.recordId ?? null,
              previousObservationId: applied.decision.previousObservationId,
              resultingObservationId: applied.resultingRecord?.observationId ?? null,
              recordCountBefore: applied.recordCountBefore,
              recordCountAfter: applied.recordCountAfter,
              effects: applied.effects,
            },
          }, null, 2));
          TS

          npx tsx --conditions=react-server .tmp-current-real-transition.mts
          rm .tmp-current-real-transition.mts
