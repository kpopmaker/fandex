name: Validate Artist Expansion ListenBrainz distinct epoch delta receipt v1

on:
  push:
    branches:
      - evidence/artist-expansion-listenbrainz-distinct-epoch-delta-v1

permissions:
  contents: read

jobs:
  validate-delta-receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate distinct-epoch delta receipt
        run: python tests/artist-expansion-listenbrainz-distinct-epoch-delta-receipt-v1.py
