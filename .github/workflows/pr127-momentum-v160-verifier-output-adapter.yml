name: PR127 momentum v160 verifier output adapter

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
    paths:
      - 'lib/intelligence/fandexMomentumVerifierOutputAttestationAdapterResearch.ts'
      - 'tests/fandex-momentum-verifier-output-attestation-v160.test.mts'
      - 'tests/fandex-momentum-stored-evidence-attestation-v159.test.mts'
      - '.github/workflows/pr127-momentum-v160-verifier-output-adapter.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Evaluate v160 retrospective compatibility
        run: |
          cat > .tmp-v160-retrospective.mts <<'TS'
          import { readFile } from 'node:fs/promises';
          import {
            adaptFandexMomentumVerifierOutputToStoredEvidenceAttestationResearch,
          } from './lib/intelligence/fandexMomentumVerifierOutputAttestationAdapterResearch';
          import {
            evaluateFandexMomentumStoredEvidenceAttestationResearch,
          } from './lib/intelligence/fandexMomentumStoredEvidenceAttestationResearch';

          const audit = JSON.parse(await readFile(
            './data/momentum-research/iu_stored_evidence_attestation_v159_20260921T012400Z.json',
            'utf8',
          ));

          const snapshot = {
            canonicalArtistId: audit.canonicalArtistId,
            naverEvidenceId: audit.sourceSnapshot.naverEvidenceId,
            naverCollectionKey: audit.sourceSnapshot.naverCollectionKey,
            naverThroughSlotStart: audit.sourceSnapshot.naverThroughSlotStart,
            naverStatus: audit.sourceSnapshot.naverStatus,
            naverRawEvidenceCount: audit.sourceSnapshot.naverRawEvidenceCount,
            naverNormalizedRecordCount:
              audit.sourceSnapshot.naverNormalizedRecordCount,
            naverDuplicateRecordCount:
              audit.sourceSnapshot.naverDuplicateRecordCount,
            naverRejectedItemCount:
              audit.sourceSnapshot.naverRejectedItemCount,
          };

          const verifierOutput = {
            contractVersion:
              'v160_fandex_momentum_stored_evidence_verifier_output_v1',
            verifier: 'neon-read-only-reproducer',
            executionId:
              `retrospective-compatibility:${audit.neonReadOnlyReproduction.projectId}:${audit.readAt}`,
            executedAt: audit.readAt,
            accessMode: audit.neonReadOnlyReproduction.accessMode,
            databaseReadOnly: true,
            databaseWritesObserved: 0,
            canonicalArtistId: audit.canonicalArtistId,
            naverEvidenceId: audit.sourceSnapshot.naverEvidenceId,
            naverCollectionKey: audit.sourceSnapshot.naverCollectionKey,
            naverThroughSlotStart: audit.sourceSnapshot.naverThroughSlotStart,
            naverStatus: audit.sourceSnapshot.naverStatus,
            jobRowReproduced:
              audit.neonReadOnlyReproduction.jobRowReproduced,
            evidenceRows: audit.neonReadOnlyReproduction.evidenceRows,
            distinctEvidenceIds:
              audit.neonReadOnlyReproduction.distinctEvidenceIds,
            distinctItemIndexes:
              audit.neonReadOnlyReproduction.distinctItemIndexes,
            minItemIndex: audit.neonReadOnlyReproduction.minItemIndex,
            maxItemIndex: audit.neonReadOnlyReproduction.maxItemIndex,
            normalizedOutcomes:
              audit.neonReadOnlyReproduction.normalizedOutcomes,
            missingNormalizedIds:
              audit.neonReadOnlyReproduction.missingNormalizedIds,
            missingNormalizedRecords:
              audit.neonReadOnlyReproduction.missingNormalizedRecords,
            distinctNormalizedRecords:
              audit.neonReadOnlyReproduction.distinctNormalizedRecords,
            joinedPayloadRows:
              audit.neonReadOnlyReproduction.joinedPayloadRows,
            rawPayloadTextBytes:
              audit.neonReadOnlyReproduction.rawPayloadTextBytes,
            normalizedPayloadTextBytes:
              audit.neonReadOnlyReproduction.normalizedPayloadTextBytes,
            rawLinkageSetAuditMd5:
              audit.neonReadOnlyReproduction.rawLinkageSetAuditMd5,
            normalizedSetAuditMd5:
              audit.neonReadOnlyReproduction.normalizedSetAuditMd5,
            rawPayloadMaterializedAuditMd5:
              audit.neonReadOnlyReproduction.rawPayloadMaterializedAuditMd5,
            normalizedPayloadMaterializedAuditMd5:
              audit.neonReadOnlyReproduction.normalizedPayloadMaterializedAuditMd5,
            auditFingerprintPurpose:
              audit.neonReadOnlyReproduction.auditFingerprintPurpose,
          } as const;

          const adapted =
            adaptFandexMomentumVerifierOutputToStoredEvidenceAttestationResearch({
              snapshot,
              verifierOutput,
            });

          const downstream =
            evaluateFandexMomentumStoredEvidenceAttestationResearch({
              snapshot,
              runtimeObservation: audit.productionRuntimeObservation,
              readAttestation: adapted.attestation,
            });

          console.log('V160_RETROSPECTIVE_BEGIN');
          console.log(JSON.stringify({
            state: adapted.state,
            verifierOutputAccepted: adapted.verifierOutputAccepted,
            digest: adapted.digest,
            blockers: adapted.blockers,
            effects: adapted.effects,
            attestationMatchesCommittedV159:
              JSON.stringify(adapted.attestation)
                === JSON.stringify(audit.readAttestation),
            downstreamV159State: downstream.state,
            downstreamV159Digest: downstream.digest,
            downstreamProvenanceDigest: downstream.provenance.digest,
            downstreamFutureLiveRefreshEligible:
              downstream.provenance.futureLiveRefreshEligible,
          }, null, 2));
          console.log('V160_RETROSPECTIVE_END');
          TS
          npx tsx --conditions=react-server .tmp-v160-retrospective.mts
          rm .tmp-v160-retrospective.mts

      - name: Validate v160 and attested refresh regressions
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-verifier-output-attestation-v160.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-stored-evidence-attestation-v159.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-provenance-gated-refresh-v158.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-triple-artifact-acceptance-v156.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-partial-persistence-recovery-v157.test.mts
          npm run typecheck
          git diff --check
