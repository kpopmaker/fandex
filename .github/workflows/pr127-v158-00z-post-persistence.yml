name: PR127 v158 00Z post-persistence acceptance

on:
  push:
    branches:
      - v131-lastfm-real-signal-read-model
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Reconstruct pre-persistence v158 and accept committed triple
        run: |
          git fetch origin main
          git show origin/main:data/lastfm-cloud/lastfm_artist_interest_history_v1.csv > /tmp/current-main-lastfm-history.csv
          git show 856f946b5dddc9b80e5fa45d8467d5dc7d07915f:data/momentum-research/iu_evaluation_watermark_v151.jsonl > /tmp/prior-watermark.jsonl
          git show 856f946b5dddc9b80e5fa45d8467d5dc7d07915f:data/momentum-research/iu_paired_artifact_manifest_v154.jsonl > /tmp/prior-manifest.jsonl

          cat > .tmp-v158-post-persist.mts <<'TS'
          import { readFile } from 'node:fs/promises';
          import {
            deriveFandexNaverMediaAttentionMomentumResearch,
          } from './lib/intelligence/fandexNaverMediaAttentionMomentumResearch';
          import {
            evaluateFandexMomentumTemporalNormalizationResearch,
          } from './lib/intelligence/fandexMomentumTemporalNormalizationResearch';
          import {
            evaluateFandexMomentumCrossFamilyCombinationResearch,
          } from './lib/intelligence/fandexMomentumCrossFamilyCombinationResearch';
          import {
            evaluateFandexMomentumOutputFormEligibilityResearch,
          } from './lib/intelligence/fandexMomentumOutputFormEligibilityResearch';
          import {
            evaluateFandexMomentumSourceProvenanceResearch,
          } from './lib/intelligence/fandexMomentumSourceProvenanceResearch';
          import {
            evaluateFandexMomentumProvenanceGatedRefreshResearch,
          } from './lib/intelligence/fandexMomentumProvenanceGatedRefreshResearch';
          import {
            evaluateFandexMomentumTripleArtifactAcceptanceResearch,
          } from './lib/intelligence/fandexMomentumTripleArtifactAcceptanceResearch';
          import {
            planFandexMomentumPartialPersistenceRecoveryResearch,
          } from './lib/intelligence/fandexMomentumPartialPersistenceRecoveryResearch';
          import {
            NAVER_NEWS_ISSUE_POINT_FROZEN_METHODOLOGY_CONTRACT_VERSION,
          } from './lib/server/ingestion/naverNewsIssuePointFrozenMethodology';
          import {
            NAVER_NEWS_ISSUE_POINT_METHODOLOGY_VERSION,
          } from './lib/intelligence/naverNewsIssuePointConstruct';

          const anchors = [
            ['2026-09-17T00:00:00.000Z', 0.00125, 45.833333333333, 24],
            ['2026-09-17T08:00:00.000Z', 0.00625, 68.75, 32],
            ['2026-09-17T16:00:00.000Z', 0.005, 55, 40],
            ['2026-09-18T00:00:00.000Z', 0, 0, 48],
            ['2026-09-18T08:00:00.000Z', 0.03375, 100, 56],
            ['2026-09-18T16:00:00.000Z', 0.0025, 34.375, 64],
            ['2026-09-19T00:00:00.000Z', 0.00125, 16.666666666667, 72],
            ['2026-09-19T08:00:00.000Z', 0.0025, 42.5, 80],
            ['2026-09-19T16:00:00.000Z', 0, 0, 88],
            ['2026-09-20T00:00:00.000Z', 0, 0, 96],
            ['2026-09-20T08:00:00.000Z', 0.00875, 79.807692307692, 104],
            ['2026-09-20T16:00:00.000Z', 0, 0, 112],
            ['2026-09-21T00:00:00.000Z', 0, 0, 120],
          ] as const;

          const points = anchors.map(([throughSlotStart, activityRate, score, priorDefinedWindowCount]) => ({
            contractVersion: NAVER_NEWS_ISSUE_POINT_FROZEN_METHODOLOGY_CONTRACT_VERSION,
            methodologyVersion: NAVER_NEWS_ISSUE_POINT_METHODOLOGY_VERSION,
            lifecycle: 'research',
            directProductContributionEligible: false,
            productScorePublished: false,
            variableId: 'newsIssuePoint',
            canonicalArtistId: 'iu',
            protocolStart: '2026-09-15T16:00:00.000Z',
            throughSlotStart,
            selectedWindowSlotCount: 8,
            rollingWindowSemantics: 'overlapping',
            baselineScope: 'same_artist_same_official_shadow_epoch',
            baselineReadiness: {
              cycleSlotCount: 24,
              utcHourCoverageCount: 24,
              completeCycleCount: 2,
              sameUtcHourReplicationFloor: 2,
              sameUtcHourReplicationCeiling: 2,
              status: 'replicated_cycle_history',
            },
            normalizationType: 'HISTORICAL_STRICT_EXCEEDANCE_SHARE',
            status: 'available',
            reason: 'frozen_methodology_value_available',
            score,
            currentActivityRate: activityRate,
            priorDefinedWindowCount,
            priorLessThanLatestCount: 0,
            priorEqualToLatestCount: 0,
            priorGreaterThanLatestCount: 0,
            currentWindow: null,
            eligiblePriorWindows: [],
            excludedWindows: [],
            evidenceTrace: { windows: [], storedEvidenceJobIds: [] },
          })) as any;

          const [
            lastfmHistory,
            historyJsonl,
            priorWatermarkJsonl,
            priorManifestJsonl,
            observedWatermarkJsonl,
            observedManifestJsonl,
          ] = await Promise.all([
            readFile('/tmp/current-main-lastfm-history.csv', 'utf8'),
            readFile('./data/momentum-research/iu_cross_family_evidence_state_v147.jsonl', 'utf8'),
            readFile('/tmp/prior-watermark.jsonl', 'utf8'),
            readFile('/tmp/prior-manifest.jsonl', 'utf8'),
            readFile('./data/momentum-research/iu_evaluation_watermark_v151.jsonl', 'utf8'),
            readFile('./data/momentum-research/iu_paired_artifact_manifest_v154.jsonl', 'utf8'),
          ]);

          const v140 = deriveFandexNaverMediaAttentionMomentumResearch(points);
          const v141 = evaluateFandexMomentumTemporalNormalizationResearch({
            canonicalArtistId: 'iu',
            lastfmHistoryCsv: lastfmHistory,
            naverComponent: v140,
          });
          const v142 = evaluateFandexMomentumCrossFamilyCombinationResearch(v141);
          const v143 = evaluateFandexMomentumOutputFormEligibilityResearch(v142);

          const provenance = evaluateFandexMomentumSourceProvenanceResearch({
            snapshot: {
              canonicalArtistId: 'iu',
              naverEvidenceId: 'dae0750b1ad81f468f479328ef726e6344eaa31a62246cce3e4aeebc5d9a3f7d',
              naverCollectionKey: 'sched-v125-naver-news-20260921t000000z-f1ed381d367d',
              naverThroughSlotStart: '2026-09-21T00:00:00.000Z',
              naverStatus: 'succeeded',
              naverRawEvidenceCount: 100,
              naverNormalizedRecordCount: 100,
              naverDuplicateRecordCount: 0,
              naverRejectedItemCount: 0,
            },
            runtimeObservation: {
              observedAt: '2026-09-21T00:02:01.000Z',
              requestPath: '/api/internal/naver-news/shadow-scheduler',
              httpStatus: 200,
              deploymentId: 'dpl_6fmT3qKqeytud3kFCNVoArBGGK1K',
              branch: 'main',
            },
            storedEvidenceReproducedThisEvaluation: true,
          });

          const v158 = evaluateFandexMomentumProvenanceGatedRefreshResearch({
            provenance,
            historyJsonl,
            watermarkJsonl: priorWatermarkJsonl,
            manifestJsonl: priorManifestJsonl,
            result: v143,
            sourceEvidence: {
              lastfmEvidenceId: '723cf73abb93882779edc0621a12381ab80e464c',
              lastfmLatestComponentEndAt: '2026-09-20T01:59:13.000Z',
              naverEvidenceId: 'dae0750b1ad81f468f479328ef726e6344eaa31a62246cce3e4aeebc5d9a3f7d',
              naverThroughSlotStart: '2026-09-21T00:00:00.000Z',
            },
            evaluatedAt: '2026-09-21T01:27:00.000Z',
            recordedAt: '2026-09-21T01:27:00.000Z',
            manifestedAt: '2026-09-21T01:27:00.000Z',
          });

          if (v158.state !== 'refresh-prepared' || v158.preflight?.state !== 'evaluation-prepared') {
            throw new Error('expected reconstructed refresh-prepared');
          }
          const preflight = v158.preflight;

          if (
            preflight.proposedWatermarkJsonl !== observedWatermarkJsonl
            || preflight.proposedManifestJsonl !== observedManifestJsonl
            || preflight.proposedHistoryJsonl !== historyJsonl
          ) {
            throw new Error('committed artifacts differ from exact v158 proposal');
          }

          const acceptance = evaluateFandexMomentumTripleArtifactAcceptanceResearch({
            preflight,
            observedHistoryJsonl: historyJsonl,
            observedWatermarkJsonl,
            observedManifestJsonl,
          });
          if (
            acceptance.state !== 'accepted-resulting-triple'
            || !acceptance.readyForNextEvaluation
          ) {
            throw new Error('v156 did not accept committed 00Z triple');
          }

          const recovery = planFandexMomentumPartialPersistenceRecoveryResearch({
            preflight,
            acceptance,
          });
          if (
            recovery.state !== 'no-recovery-needed'
            || !recovery.readyForNextEvaluation
          ) {
            throw new Error('unexpected v157 recovery requirement');
          }

          console.log(JSON.stringify({
            v143Digest: v143.digest,
            provenanceDigest: provenance.digest,
            v158: {
              state: v158.state,
              digest: v158.digest,
              preflightDigest: preflight.digest,
              coordinatorState: preflight.coordinator.state,
              proposedWrites: preflight.proposedWrites,
              nextManifestSequence: preflight.nextManifest.sequence,
              nextManifestDigest: preflight.nextManifest.manifestDigest,
            },
            v156: {
              state: acceptance.state,
              pairAcceptanceState: acceptance.pairAcceptance.state,
              exactExpectedTripleObserved: acceptance.exactExpectedTripleObserved,
              readyForNextEvaluation: acceptance.readyForNextEvaluation,
              observedManifestDigest: acceptance.observedManifestDigest,
              digest: acceptance.digest,
            },
            v157: {
              state: recovery.state,
              readyForNextEvaluation: recovery.readyForNextEvaluation,
              proposedWrites: recovery.proposedWrites,
              digest: recovery.digest,
            },
          }, null, 2));
          TS
          npx tsx --conditions=react-server .tmp-v158-post-persist.mts
          rm .tmp-v158-post-persist.mts
      - name: Regress transaction boundaries
        run: |
          npx tsx --conditions=react-server --test tests/fandex-momentum-provenance-gated-refresh-v158.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-triple-artifact-acceptance-v156.test.mts
          npx tsx --conditions=react-server --test tests/fandex-momentum-partial-persistence-recovery-v157.test.mts
          npm run typecheck
          git diff --check
