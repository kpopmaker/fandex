name: Validate Momentum product activation operations handoff v1

on:
  push:
    branches:
      - integration/momentum-product-activation-operations-handoff-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'push' || github.head_ref == 'integration/momentum-product-activation-operations-handoff-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Scope allowlist
        run: |
          git diff --name-only 1f799902528663c35537050cf7a0b5a1a0d2a1af...HEAD | sort > /tmp/changed.txt
          cat > /tmp/allowed.txt <<'EOF'
          .github/workflows/validate-momentum-product-activation-operations-handoff-v1.yml
          data/momentum-product/iu_momentum_product_activation_operations_handoff_v1.json
          tests/momentum-product-activation-operations-handoff-v1.test.mts
          EOF
          sort -o /tmp/allowed.txt /tmp/allowed.txt
          diff -u /tmp/allowed.txt /tmp/changed.txt

      - run: npm ci

      - name: Momentum activation operations handoff regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-product-activation-operations-handoff-v1.test.mts

      - name: Momentum authorization execution candidate evidence regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-product-activation-authorization-execution-candidate-evidence-v1.test.mts

      - name: Momentum owner-attestation evidence regression
        env:
          NODE_OPTIONS: --conditions=react-server
        run: npx tsx --test tests/momentum-product-activation-owner-attestation-evidence-v1.test.mts

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
