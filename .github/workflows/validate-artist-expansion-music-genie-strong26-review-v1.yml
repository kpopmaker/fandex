name: Validate Artist Expansion Music Genie strong26 review v1

on:
  push:
    branches:
      - review/artist-expansion-music-genie-strong26-bindings-v1

permissions:
  contents: read

jobs:
  validate-genie-strong26-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Genie strong26 review
        run: python tests/artist-expansion-music-genie-strong26-reviewed-bindings-v1.py
